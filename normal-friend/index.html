<script>
// ===== src/scenes_a4.js =====
'use strict';
// =====================================================================
// scenes_a4.js — S3 后半（1:14–1:25）并登记 SCENE_IMPL.S3
//   74–78 「感情已那么深」：海洋剖面，粉色细线像锚链沉入深海，深度表 -10m → -100m → -1000m…，气泡上浮
//   78–82 「叫我怎么能放手」：“我”紧握爱心气球线，强风，线绷紧抖动，“我”被拖着向前滑
//   82–85 「但你说」：定格压暗，“你”上前一步，巨大对话气泡展开并铺满画面（转场到副歌）
// =====================================================================
const OCEAN_SURF = 330;   // 世界坐标中的海面
function oceanChainEnd(t) { return OCEAN_SURF + 120 + 2300 * prog(t, 74.2, 77.7, easeInOutCubic); }
function oceanChainX(wy, t) {
  const d = (wy - OCEAN_SURF) / 2400;
  return 560 + 60 * d + Math.sin(wy * 0.006 + t * 1.2) * 22 * d;
}
// 深度表（对数刻度）：-10m / -100m / -1000m，指针随下沉移动，顶部大读数
function s3DepthGauge(ctx, t) {
  const k = prog(t, 74.3, 78), depth = Math.round(Math.pow(10, 1 + 2.25 * k));
  const x0 = 1690, y0 = 160, y1 = 760, bx = 1780;
  fillRoundRect(ctx, x0, y0 - 30, 130, y1 - y0 + 60, 18, 'rgba(7,7,15,0.35)');
  line(ctx, bx, y0, bx, y1, 4, 'rgba(255,244,224,0.5)');
  const ly = function (d) { return y0 + (Math.log10(d) - 1) / 2.4 * (y1 - y0); };
  ctx.font = fontStr(24, 700, FONT_EN); ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
  for (let p = 1; p <= 3; p++) {
    const y = ly(Math.pow(10, p));
    line(ctx, bx - 18, y, bx, y, 4, PAL.cream);
    ctx.fillStyle = PAL.cream; ctx.fillText('-' + Math.pow(10, p) + 'm', bx - 26, y);
  }
  const py = ly(depth);
  ctx.beginPath(); ctx.moveTo(bx + 6, py); ctx.lineTo(bx + 26, py - 12); ctx.lineTo(bx + 26, py + 12); ctx.closePath();
  ctx.fillStyle = PAL.heart; ctx.fill();
  drawText(ctx, '-' + depth + 'm', 1755, 100, 40, PAL.cream, { family: FONT_EN, weight: 800 });
}
function s3Ocean(ctx, t) {
  const end = oceanChainEnd(t), camY = Math.max(0, end - 640), sy = OCEAN_SURF - camY;
  // 天空（只在海面还在画面内时可见）+ 水体（世界坐标渐变，越深越暗）
  if (sy > 0) { const gs = ctx.createLinearGradient(0, 0, 0, sy); gs.addColorStop(0, '#f0a37a'); gs.addColorStop(1, '#ffd3a8'); ctx.fillStyle = gs; ctx.fillRect(0, 0, W, sy); }
  const g = ctx.createLinearGradient(0, sy, 0, sy + 2800);
  g.addColorStop(0, '#2f8fc0'); g.addColorStop(0.25, '#1a5b8f'); g.addColorStop(0.55, '#0e2f5c');
  g.addColorStop(0.8, '#071634'); g.addColorStop(1, '#03060f');
  ctx.fillStyle = g; ctx.fillRect(0, Math.max(0, sy), W, H);
  // 光柱
  ctx.save(); ctx.globalAlpha = 0.07 * clamp01(1 - camY / 1400);
  for (let i = 0; i < 5; i++) {
    const x = 200 + i * 380 + Math.sin(t * 0.5 + i) * 30;
    ctx.beginPath(); ctx.moveTo(x, sy); ctx.lineTo(x + 90, sy); ctx.lineTo(x + 330, sy + 1100); ctx.lineTo(x + 120, sy + 1100);
    ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
  }
  ctx.restore();
  // 锚链：粉色链环沿摆动曲线向下延伸，末端是爱心锚
  for (let wy = OCEAN_SURF + 6, i = 0; wy < end; wy += 26, i++) {
    const y = wy - camY;
    if (y < -30 || y > H + 30) continue;
    ctx.beginPath();
    if (i % 2) ctx.ellipse(oceanChainX(wy, t), y, 7, 15, 0, 0, TAU); else ctx.ellipse(oceanChainX(wy, t), y, 12, 15, 0, 0, TAU);
    ctx.lineWidth = 5; ctx.strokeStyle = PAL.heart; ctx.stroke();
  }
  const ax = oceanChainX(end, t), ay = end - camY + 40;
  ring(ctx, ax, ay - 52, 12, 6, PAL.heart);
  ctx.beginPath(); ctx.arc(ax, ay - 6, 64, 0.25 * PI, 0.75 * PI); ctx.lineWidth = 9; ctx.strokeStyle = PAL.heart; ctx.stroke();
  drawHeart(ctx, ax, ay, 44, { fill: PAL.heart });
  softGlow(ctx, ax, ay, 160, PAL.heart, 0.35);
  // “我”漂在海面上，下半身没在水里
  if (sy > -120) {
    const my = sy - 34 + Math.sin(t * 2.2) * 6;
    drawMe(ctx, 560, my, { t: t, r: 56, look: 0.3, lookY: 0.8, shadow: false, glow: 0.4, hands: [{ a: 1.9, len: 0.5 }] });
    ctx.fillStyle = 'rgba(47,143,192,0.55)'; ctx.fillRect(0, sy, W, 60);
    ctx.beginPath(); ctx.moveTo(0, sy);
    for (let x = 0; x <= W; x += 40) ctx.lineTo(x, sy + Math.sin(x * 0.01 + t * 2) * 8);
    ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(255,244,224,0.7)'; ctx.stroke();
  }
  // 上浮气泡 + 海雪
  for (let i = 0; i < 40; i++) {
    const sp = 60 + hash01(i, 201) * 110, span = H + 80;
    const y = H + 40 - fract(hash01(i, 202) + t * sp / span) * span;
    if (y < sy) continue;
    const x = hash01(i, 203) * W + Math.sin(t * 2 + i) * 12, r = 4 + hash01(i, 204) * 12;
    ring(ctx, x, y, r, 2.5, 'rgba(255,244,224,0.45)');
    circle(ctx, x - r * 0.35, y - r * 0.35, r * 0.25, 'rgba(255,255,255,0.5)');
  }
  for (let i = 0; i < 50; i++) {
    const y = fract(hash01(i, 211) + t * 0.03) * H;
    if (y < sy) continue;
    ctx.globalAlpha = 0.35; circle(ctx, hash01(i, 212) * W, y, 1.5 + hash01(i, 213) * 2, PAL.cream);
  }
  ctx.globalAlpha = 1;
  s3DepthGauge(ctx, t);
}
// ---- 78–82 强风气球（tf 为画面时间；定格时传入固定值） ----
function s3Balloon(ctx, tf) {
  fillSky(ctx, '#2a2f66', '#5b3a6e');
  for (let i = 0; i < 7; i++) {
    const x = ((hash01(i, 221) * W * 1.5 + tf * (380 + hash01(i, 222) * 250)) % (W + 700)) - 350;
    drawCloud(ctx, x, 110 + hash01(i, 223) * 320, 100 + hash01(i, 224) * 90, '#4a4f8a', 0.8);
  }
  drawSkyline(ctx, tf, 1, '#232858', 0.6);
  drawGround(ctx, '#151936', '#2e3466');
  // 风线 + 飞叶
  for (let i = 0; i < 26; i++) {
    const sp = 1800 * (0.7 + hash01(i, 231) * 0.6), len = 120 + hash01(i, 232) * 140;
    const x = ((hash01(i, 233) * W + tf * sp) % (W + 600)) - 300, y = 40 + hash01(i, 234) * 720;
    line(ctx, x, y, x + len, y, 3, 'rgba(255,244,224,0.22)');
  }
  for (let i = 0; i < 12; i++) {
    const x = ((hash01(i, 241) * W + tf * 1100) % (W + 200)) - 100, y = 150 + hash01(i, 242) * 600 + Math.sin(tf * 5 + i) * 40;
    ctx.save(); ctx.translate(x, y); ctx.rotate(tf * 8 + i);
    ctx.beginPath(); ctx.ellipse(0, 0, 14, 6, 0, 0, TAU); ctx.fillStyle = i % 2 ? '#ff9a4a' : '#e8673c'; ctx.fill();
    ctx.restore();
  }
  // “我”被拖着向前滑：后仰抵抗、脚下拖痕与扬尘
  const slide = prog(tf, 78.3, 82, easeInQuad), mx = lerp(520, 860, slide) + Math.sin(tf * 47) * 3, my = ME_Y;
  const rot = -0.26 - 0.05 * Math.sin(tf * 9), r = 60;
  if (mx > 540) line(ctx, 520, GROUND_Y + 3, mx - 30, GROUND_Y + 3, 6, 'rgba(0,0,0,0.3)');
  for (let i = 0; i < 6; i++) {
    const ph = fract(tf * 3 + i / 6);
    ctx.globalAlpha = 0.5 * (1 - ph);
    circle(ctx, mx - 40 - ph * 120, GROUND_Y - 6 - ph * 18, 10 * (1 - ph), '#5a5f9a');
  }
  ctx.globalAlpha = 1;
  // 爱心气球被风吹向右上，线绷紧高频抖动
  const bx = mx + 470 + Math.sin(tf * 2.3) * 30, by = 300 + Math.sin(tf * 3.1) * 24, brot = 0.25 + Math.sin(tf * 2.7) * 0.08;
  const cx = mx + r * Math.sin(rot), cy = my + r - r * Math.cos(rot);
  const wa = Math.atan2(by - cy, bx - cx), hx = cx + Math.cos(wa) * r * 1.67, hy = cy + Math.sin(wa) * r * 1.67;
  const tx = bx - Math.sin(brot) * 72, ty = by + Math.cos(brot) * 72;
  ctx.beginPath();
  for (let i = 0; i <= 24; i++) {
    const s = i / 24, o = Math.sin(s * PI) * Math.sin(tf * 55 + s * 12) * 5;
    const dx = tx - hx, dy = ty - hy, L = Math.hypot(dx, dy) || 1;
    const x = hx + dx * s - dy / L * o, y = hy + dy * s + dx / L * o;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.lineWidth = 3; ctx.strokeStyle = PAL.cream; ctx.stroke();
  drawMe(ctx, mx, my, { t: tf, r: r, rot: rot, squash: 0.94, look: 1, lookY: -0.6, glow: 0.45, groundY: GROUND_Y,
    hands: [{ a: wa - rot, len: 0.75 }] });
  drawHeart(ctx, bx, by, 80, { fill: PAL.heart, rot: brot });
  ctx.save(); ctx.translate(bx, by); ctx.rotate(brot);
  ctx.beginPath(); ctx.ellipse(-34, -26, 14, 8, -0.6, 0, TAU); ctx.fillStyle = 'rgba(255,255,255,0.35)'; ctx.fill();
  regularPolyPath(ctx, 0, 78, 9, 3, PI / 2); ctx.fillStyle = PAL.heart; ctx.fill();
  ctx.restore();
}
// ---- 82–85 定格 + “你”的巨大对话气泡 ----
const S3_FREEZE = 82;
function s3Speech(ctx, t) {
  withCamera(ctx, 960, 540, 1 + 0.04 * prog(t, 82, 82.5, easeOutCubic), 0, function () { s3Balloon(ctx, S3_FREEZE); });
  desatScreen(ctx, 0.5 * prog(t, 82, 82.3));
  veil(ctx, PAL.abyss, 0.55 * prog(t, 82.05, 82.5));
  veil(ctx, '#ffffff', 0.6 * (1 - prog(t, 82, 82.12)));   // 定格闪光
  // “你”上前两步
  const k1 = prog(t, 82.4, 83.0, easeOutCubic), k2 = prog(t, 83.0, 83.35, easeOutBack);
  const ux = lerp(2080, 1500, k1) - 70 * k2, hop = Math.abs(Math.sin(prog(t, 82.4, 83.35) * PI * 2)) * 26;
  const uy = GROUND_Y - 95 - hop;
  drawYou(ctx, ux, uy, { t: t, r: 95, look: -0.7, lookY: -0.1, groundY: GROUND_Y, glow: 0.35,
    squash: 1 + 0.12 * Math.exp(-8 * Math.max(0, t - 83.35)) * Math.cos((t - 83.35) * 16) * (t > 83.35 ? 1 : 0) });
  // 气泡：从“你”头顶弹出，84.45 秒后放大铺满画面
  const g = prog(t, 83.35, 84.1);
  if (g <= 0) return;
  const gs = easeOutBack(g, 1.5), es = 1 + 3.2 * prog(t, 84.45, 85.0, easeInCubic);
  const tipX = ux - 85, tipY = GROUND_Y - 95 - 75, bcx = 790, bcy = 340;
  ctx.save();
  ctx.translate(bcx, bcy); ctx.scale(es, es); ctx.translate(-bcx, -bcy);
  ctx.translate(tipX, tipY); ctx.scale(gs, gs); ctx.translate(-tipX, -tipY);
  drawBubble(ctx, 230, 120, 1120, 440, tipX, tipY, { fill: PAL.cream, r: 120 });
  drawDots(ctx, bcx, bcy, t, { color: PAL.indigo, r: 16, gap: 52, alpha: 1 - prog(t, 84.45, 84.8) });
  ctx.restore();
}

function drawS3(ctx, t) {
  if (t < 64) s3Change(ctx, t);
  else if (t < 69) s3Rewind(ctx, t);
  else if (t < 74) s3Polaroid(ctx, t);
  else if (t < 78) s3Ocean(ctx, t);
  else if (t < S3_FREEZE) {
    if (t < 78.6) {
      // 圆形遮罩扩散转场：深海 → 强风
      s3Ocean(ctx, t);
      const R = easeInOutCubic(prog(t, 78, 78.6)) * 1150;
      withCircleClip(ctx, 960, 540, R, function () { s3Balloon(ctx, t); });
      ring(ctx, 960, 540, R, 10, PAL.cream);
    } else s3Balloon(ctx, t);
  } else s3Speech(ctx, t);
}
SCENE_IMPL.S3 = { draw: function (ctx, t) { drawS3(ctx, t); } };
</script>
<script>
// ===== src/scenes_b.js =====
'use strict';
// =====================================================================
// scenes_b.js — S4 副歌一（1:25–2:06）共用件 + 前三段：
//   85–90 「I only want to be your friend」：“你”的巨大气泡里逐词砸入，
//          friend 描边大字 + 盖章框，冲击抖动（逐词文字由 s4BubbleWords 在歌词层绘制）
//   90–93 「做个朋友」：写着“朋友”的圆徽章从“你”手里飞出，“啪”地贴到“我”胸前
//   93–95 「我在」：暗场，单束聚光灯打在小小的“我”身上
// 其余：scenes_b1.js（95–113）、scenes_b2.js（113–126，歌词分派，登记 SCENE_IMPL.S4）、
//       scenes_b3.js（S5 间奏）。所有画面只由 t 决定（hash01 种子随机，无帧间状态）。
// =====================================================================

const S4_RED = '#ff3b4f';

// ---- 共用：副歌背景（玫紫夜色 + 强节拍散景 + 中心光晕） ----
function s4Backdrop(ctx, t, top, bot, glowCol) {
  const beat = beatPulse(t);
  fillSky(ctx, top, bot);
  softGlow(ctx, 960, 520, 980 + 90 * beat, glowCol || PAL.heart, 0.10 + 0.14 * beat);
  drawBokeh(ctx, t, { count: 34, seed: 13, color: PAL.meGlow, alpha: 0.11, pulse: beat * 1.4, speed: 1.5, maxR: 46 });
}
// 舞台地面：边缘与地面光带随拍发亮
function s4Floor(ctx, t) {
  const beat = beatPulse(t);
  drawGround(ctx, '#1a1232', '#47305e');
  const g = ctx.createLinearGradient(0, GROUND_Y, 0, GROUND_Y + 140);
  g.addColorStop(0, rgba(PAL.heart, 0.18 * beat)); g.addColorStop(1, rgba(PAL.heart, 0));
  ctx.fillStyle = g; ctx.fillRect(0, GROUND_Y, W, 140);
  ctx.fillStyle = rgba(PAL.heart, 0.6 * beat); ctx.fillRect(0, GROUND_Y, W, 5);
}
// 全屏节拍暗角：每拍开头暗角松开（画面“一亮”），随后收紧
function s4Vignette(ctx, t, gain) {
  const beat = beatPulse(t) * (gain === undefined ? 1 : gain);
  const g = ctx.createRadialGradient(960, 540, 380, 960, 540, 1150);
  g.addColorStop(0, 'rgba(7,7,15,0)');
  g.addColorStop(1, rgba(PAL.abyss, 0.6 - 0.3 * beat));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
// 转场：t0 前 0.22 秒斜向色块盖住旧画面；t0 后 0.3 秒色块向右离开、揭示新画面
function s4Trans(ctx, t, t0, col) {
  if (t >= t0 - 0.22 && t < t0) { diagWipe(ctx, prog(t, t0 - 0.22, t0, easeInCubic), col, 260); return; }
  if (t < t0) return;
  const k = prog(t, t0, t0 + 0.3, easeOutCubic);
  if (k >= 1) return;
  const s = 260, x = lerp(-s, W + s, k);
  ctx.beginPath();
  ctx.moveTo(x + s, -10); ctx.lineTo(W + 10, -10); ctx.lineTo(W + 10, H + 10); ctx.lineTo(x - s, H + 10);
  ctx.closePath(); ctx.fillStyle = col; ctx.fill();
}
// 单束聚光灯：从画面顶端打到地面 (x, floorY)，topW/botW 为光锥上下宽度
function drawSpotCone(ctx, t, x, floorY, topW, botW, a, col) {
  if (a <= 0) return;
  const g = ctx.createLinearGradient(0, 0, 0, floorY);
  g.addColorStop(0, rgba(col, 0.34 * a)); g.addColorStop(1, rgba(col, 0.12 * a));
  ctx.beginPath();
  ctx.moveTo(x - topW / 2, -20); ctx.lineTo(x + topW / 2, -20);
  ctx.lineTo(x + botW / 2, floorY); ctx.lineTo(x - botW / 2, floorY); ctx.closePath();
  ctx.fillStyle = g; ctx.fill();
  ctx.save();
  ctx.globalAlpha = clamp01(a);
  ctx.beginPath(); ctx.ellipse(x, floorY, botW / 2, 42, 0, 0, TAU);
  ctx.fillStyle = rgba(col, 0.32); ctx.fill();
  ctx.restore();
  // 光束里漂浮的微尘
  for (let i = 0; i < 18; i++) {
    const y = fract(hash01(i, 421) + t * (0.02 + 0.03 * hash01(i, 424))) * floorY, wy = y / floorY;
    const px = x + (hash01(i, 422) - 0.5) * lerp(topW, botW, wy) * 0.8 + Math.sin(i + y * 0.01) * 8;
    ctx.globalAlpha = 0.35 * a * (0.5 + 0.5 * Math.sin(i * 2.3 + y * 0.02));
    circle(ctx, px, y, 1.5 + hash01(i, 423) * 2.5, PAL.cream);
  }
  ctx.globalAlpha = 1;
}

// ---- “朋友”圆徽章：中心 (x, y)，半径 r；peel 0..1 为左缘翘起程度（翘起处露出浅色背面） ----
function drawFriendBadge(ctx, x, y, r, rot, peel) {
  if (r <= 0.5) return;
  const p = clamp01(peel || 0);
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  if (p > 0) { // 以右缘为铰链：水平压缩 + 斜切，像贴纸被掀起
    ctx.translate(r, 0); ctx.transform(1 - 0.45 * p, -0.35 * p, 0, 1, 0, 0); ctx.translate(-r, 0);
  }
  circle(ctx, r * 0.08, r * 0.14, r, 'rgba(7,7,15,0.3)');
  circle(ctx, 0, 0, r, PAL.you);
  ctx.save();
  ctx.setLineDash([r * 0.16, r * 0.12]);
  ring(ctx, 0, 0, r * 0.8, Math.max(1.5, r * 0.07), PAL.cream);
  ctx.restore();
  circle(ctx, -r * 0.35, -r * 0.42, r * 0.22, 'rgba(255,255,255,0.25)');
  drawText(ctx, '朋友', 0, r * 0.05, r * 0.62, PAL.cream, { weight: 900, family: FONT_CN, shadow: false });
  if (p > 0) {
    ctx.beginPath(); ctx.ellipse(-r + r * 0.32 * p, 0, r * 0.34 * p, r * 0.86, 0, 0, TAU);
    ctx.fillStyle = '#c4f0f2'; ctx.fill();
  }
  ctx.restore();
}
// “我”的胸口（徽章贴附点）：考虑以脚底为锚点的挤压 sq 与旋转 rot
function meChest(x, y, r, sq, rot) {
  const d = 0.54 * r / (sq || 1), a = rot || 0;
  return { x: x + d * Math.sin(a), y: y + r - d * Math.cos(a) };
}
// 小手指尖位置（与 drawCharacter 的变换一致，忽略挤压）
function charHandTip(x, y, r, a, len, rot) {
  const L = r * (0.92 + len), px = Math.cos(a) * L, py = Math.sin(a) * L - r, c = Math.cos(rot || 0), s = Math.sin(rot || 0);
  return { x: x + c * px - s * py, y: y + r + s * px + c * py };
}
// 冲击放射线
function drawImpact(ctx, x, y, since, r0, col) {
  if (since < 0 || since > 0.4) return;
  const k = since / 0.4, e = easeOutCubic(k);
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * TAU + 0.3, ra = r0 + e * 70, rb = r0 + 30 + e * 110;
    line(ctx, x + Math.cos(a) * ra, y + Math.sin(a) * ra, x + Math.cos(a) * rb, y + Math.sin(a) * rb, 7 * (1 - k) + 1, rgba(col, 1 - k));
  }
  ring(ctx, x, y, r0 + e * 90, 6 * (1 - k), rgba(col, 0.8 * (1 - k)));
}

// =====================================================================
// 85–90 气泡：S3 末尾奶油色气泡铺满画面 → 收回成“你”头顶的巨大气泡；逐词砸入时整体抖动
// =====================================================================
const S4A_BUB = { x: 210, y: 92, w: 1210, h: 500 };
const S4A_YOU_X = 1430, S4A_YOU_Y = GROUND_Y - 95, S4A_TIP_X = 1345, S4A_TIP_Y = GROUND_Y - 170;
const S4A_WORDS = ['I', 'only', 'want', 'to', 'be', 'your', 'friend'];
// 第 i 个词砸入的时刻（相对歌词开始，秒）；friend 多留半拍
function s4WordT(i) { return 0.45 + i * 0.42 + (i === 6 ? 0.3 : 0); }
const S4A_STAMP = 0.3;   // friend 落下后多久盖章
// 冲击抖动幅度（场景时间）
function s4ShakeA(t) {
  let s = 0;
  for (let i = 0; i < S4A_WORDS.length; i++) {
    const since = t - (85 + s4WordT(i) + 0.16);
    if (since > 0) s += Math.exp(-since * 14) * (i === 6 ? 20 : 7);
  }
  const ss = t - (85 + s4WordT(6) + S4A_STAMP + 0.12);
  if (ss > 0) s += Math.exp(-ss * 12) * 26;
  return s;
}

<script>

// ---- 95–100 胸口爱心货架 ----

function s4InHeart(px, py) {

  const flap = prog(t, 104.0, 104.4, easeInOutCubic), lift = prog(t, 104.4, 104.95, easeOutCubic);
  const unfold = prog(t, 104.95, 105.5, easeOutBack);
  fillRoundRect(ctx, x0 + 10, y0 + 12, S4F_EW, S4F_EH, 16, 'rgba(7,7,15,0.3)');
  fillRoundRect(ctx, x0, y0, S4F_EW, S4F_EH, 16, '#e8c79a');

  if (unfold <= 0) s4Paper(ctx, t, S4F_EX, lerp(ey, ey - 190, lift), 160, 0);

  ctx.beginPath();
  ctx.moveTo(x0, y0 + 10); ctx.lineTo(S4F_EX, y0 + S4F_EH * 0.56); ctx.lineTo(x1, y0 + 10);
  ctx.lineTo(x1, y1 - 16); ctx.arcTo(x1, y1, x1 - 16, y1, 16); ctx.lineTo(x0 + 16, y1); ctx.arcTo(x0, y1, x0, y1 - 16, 16);
  ctx.closePath(); ctx.fillStyle = '#ffe2b8'; ctx.fill();

// 信封封口三角：sy = 1 闭合（尖朝下），-1 完全翻开（尖朝上）
function s4Flap(ctx, x0, x1, y0, sy, col) {

// 信纸：中心 (x, y)，高 h；u 为展开进度（折痕逐渐变淡，抽象文字线逐行写出）

// ---- 108–113 回旋镖爱心 ----
const S4G_MX = 430, S4G_R = 78, S4G_THROW = 108.75;
function s4BoomPt(u) {   // 抛出路线（二次贝塞尔），u=1 时已在画面右外侧
  const iu = 1 - u;

}
function s4RetPt(u) {    // 预期返回路线（虚线）：从右侧画面边缘绕下方回到“我”的手边

function s4Boomerang(ctx, t) {
  s4Backdrop(ctx, t, '#2a1f55', '#141a38', PAL.you);

  const rot = -0.22 * wind * (1 - thr) + 0.18 * thr * (1 - prog(t, 109.0, 109.6, easeInOutCubic));

    drawHeart(ctx, tip.x, tip.y - 20, 40, { fill: PAL.heart, rot: -0.3 * wind });
  } else {
    // 飞出：旋转 + 残影
    const u = prog(t, S4G_THROW, 110.0, easeInQuad);
    if (u < 1) {
      for (let j = 3; j >= 0; j--) {
        const p = s4BoomPt(Math.max(0, u - j * 0.035));
        drawHeart(ctx, p.x, p.y, 48, { fill: PAL.heart, rot: (t - S4G_THROW) * 16 - j * 0.5, alpha: j === 0 ? 1 : 0.22 * (4 - j) / 3 });
      }

  }
  // 预期返回的虚线箭头（蚂蚁线滚动），但爱心始终没有回来
  const rk = prog(t, 110.1, 111.3, easeInOutCubic);

    ctx.save();
    ctx.setLineDash([26, 20]); ctx.lineDashOffset = -t * 40;
    ctx.beginPath();
    for (let i = 0; i <= 40; i++) {
      const p = s4RetPt(rk * i / 40);
      if (i === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y);
    }
    ctx.lineWidth = 6; ctx.strokeStyle = rgba(PAL.cream, 0.7); ctx.lineCap = 'round'; ctx.stroke();
    ctx.restore();
    if (rk >= 1) {
      const p = s4RetPt(1), q = s4RetPt(0.97), a = Math.atan2(p.y - q.y, p.x - q.x), ak = easeOutBack(prog(t, 111.3, 111.55), 2);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(a); ctx.scale(ak, ak);
      ctx.beginPath(); ctx.moveTo(12, 0); ctx.lineTo(-22, -16); ctx.lineTo(-22, 16); ctx.closePath();
      ctx.fillStyle = rgba(PAL.cream, 0.8); ctx.fill();
      ctx.restore();
    }
  }
  // 头顶等待的三点
  if (t > 111.6) drawDots(ctx, S4G_MX, my - S4G_R - 50, t, { color: PAL.cream, r: 8, gap: 26, alpha: prog(t, 111.6, 111.9) });
}
// 歌词层：与下方歌词区相同的排版与 pop 入场，但“收不回来”四字向远处拉伸、变小（带残影）
function s4StretchLyric(ctx, t, tl, L) {
  const P = prepText(L.text), Lo = layoutChars(ctx, P, LYR_SIZE, LYR_MAXW, 800, FONT_MIX);
  const n = P.chars.length, i0 = L.text.indexOf('收不回来');
  const exitDur = Math.min(0.4, (L.end - L.start) * 0.15), exitStart = L.end - exitDur;

    const g = ctx.createLinearGradient(0, 780, 0, H);
    g.addColorStop(0, 'rgba(7,7,15,0)'); g.addColorStop(1, rgba(PAL.abyss, 0.5 * band));
    ctx.fillStyle = g; ctx.fillRect(0, 780, W, H - 780);
  }

  const st = prog(tl, L.start + 2.0, L.start + 3.3, easeInOutCubic);
  const xs = new Array(n);
  let x = W / 2 - Lo.total / 2;
  for (let i = 0; i < n; i++) { xs[i] = x + Lo.ws[i] / 2; x += Lo.ws[i]; }
  const vpx = x + 230, vpy = LYR_Y - 34;   // 远处的消失点
  for (let i = 0; i < n; i++) {
    const k = clamp01((tl - L.start - i * stagger) / 0.45);
    if (k <= 0) continue;
    let sc = easeOutBack(k, 2.2), a = clamp01(k * 4), cx = xs[i], cy = LYR_Y;
    const e = clamp01((tl - exitStart - i * (exitDur * 0.4 / n)) / (exitDur * 0.6));

    const hc = P.hl[i];

      // 拉伸拖尾：从原位置拉向字的细速度线（不叠字形，保证可读）
      const hw = Lo.ws[i] * sc * 0.5;
      if (cx - hw - bx > 8) {

        for (let s = -1; s <= 1; s++) {
          const oy = s * Lo.size * sc * 0.22;

        }
        ctx.globalAlpha = 1;
      }
    }
    drawGlyph(ctx, P.chars[i], cx, cy, sc, 0, a, hc || PAL.cream, Lo.font, Lo.size, false);
  }
}

<script>
// ===== src/scenes_b2.js =====
'use strict';
// =====================================================================
// scenes_b2.js — S4 副歌一 后段（1:53–2:06）+ 歌词分派 + 登记 SCENE_IMPL.S4
//   113–115 「So I」（大字）：硬切黑场，单束聚光，“我”胸口发出心跳光环（扑通-扑通）
//   115–119 「我不能只是be 你的朋友」（大字，抖动迸发）：“我”放大发抖、放射光芒，
//            胸前“朋友”徽章翘起、脱落、旋转着掉出画面
//   119–121 「（你说对不对）」：“我”冒出小气泡，气泡里的文字微微倾斜，“我”转头看向观众
//   121–126 「我不能只是做你的朋友」（大字）：全屏两行排版，“不能”珊瑚色放大并盖章抖动
// S4 由本场景自己绘制歌词（ownsLyrics），普通句仍调用 lyrics.js 的 drawBottomLyric / drawHeroLine。
// =====================================================================

// ---- 113–115 So I ----
// 心跳：每拍两下（间隔 0.2 秒），返回最近一下的冲击强度 0..1
function s4Heartbeat(t, t0) {
  const b0 = beatIndex(t);
  let hb = 0;
  for (let k = 0; k < 2; k++) {
    for (let d = 0; d < 2; d++) {
      const tb = beatTime(b0 - k, d * 0.2);
      if (tb < t0 || tb > t) continue;
      hb = Math.max(hb, Math.exp(-(t - tb) * 9) * (d ? 0.7 : 1));
    }
  }
  return hb;
}
function s4HeartRings(ctx, t, t0, x, y, a) {
  const b0 = beatIndex(t);
  for (let k = 0; k < 3; k++) {
    for (let d = 0; d < 2; d++) {
      const tb = beatTime(b0 - k, d * 0.2), age = t - tb;
      if (tb < t0 || age < 0 || age > 1.4) continue;
      const f = 1 - age / 1.4;
      ring(ctx, x, y, 40 + easeOutCubic(age / 1.4) * 520, 3 + 9 * f, rgba(PAL.heart, a * 0.8 * f * (d ? 0.6 : 1)));
    }
  }
}
function s4SoI(ctx, t) {
  fillSky(ctx, '#040409', '#0a0816');
  const r = 62, mx = 960, my = GROUND_Y - r, on = prog(t, 113.0, 113.1);
  ctx.fillStyle = '#08070f'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  drawSpotCone(ctx, t, mx, GROUND_Y, 120, 420, on, PAL.heaven);
  const c = meChest(mx, my, r, 1, 0);
  s4HeartRings(ctx, t, 113.0, c.x, c.y, on);
  const hb = s4Heartbeat(t, 113.0);
  drawMe(ctx, mx, my, { t: t, r: r, squash: 1 + 0.12 * hb, look: 0, lookY: -0.1, groundY: GROUND_Y, glow: 0.4 + 0.6 * hb });
  drawFriendBadge(ctx, c.x, meChest(mx, my, r, 1 + 0.12 * hb, 0).y, r * 0.4, 0, 0);
}

// ---- 115–121 徽章脱落 + 小气泡 ----
const S4I_DETACH = 116.9, S4I_R = 100;
function s4Peel(ctx, t) {
  const beat = beatPulse(t), burst = env(t, 115.0, 119.4, 0.3, 0.9);
  fillSky(ctx, mixColor('#040409', '#3a1240', burst * 0.9 + 0.25 * (t > 119 ? 1 : 0)), '#0a0816');
  const r = lerp(62, S4I_R, easeOutBack(prog(t, 115.0, 115.45), 1.8)), cx0 = 960, cy0 = GROUND_Y - r;
  // 放射光芒（迸发）
  if (burst > 0) {
    ctx.save(); ctx.translate(cx0, cy0); ctx.rotate(t * 0.4);
    for (let i = 0; i < 16; i++) {
      ctx.rotate(TAU / 16);
      ctx.globalAlpha = clamp01(0.16 * burst * (1 + 0.6 * beat));
      ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-70, -1300); ctx.lineTo(70, -1300); ctx.closePath();
      ctx.fillStyle = i % 2 ? PAL.me : PAL.heart; ctx.fill();
    }
    ctx.restore();
  }
  ctx.fillStyle = '#0c0a18'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);

      const tb = beatTime(b0 - k), age = t - tb;
      if (tb < 115.0 || age > 1.2) continue;

  const shake = t < 119 ? (0.4 + beat) * 7 * burst : 0;

  const follow = env(t, S4I_DETACH, 118.4, 0.15, 0.5);
  const toBubble = env(t, 119.1, 120.0, 0.3, 0.25), turn = prog(t, 120.0, 120.3, easeOutBack);
  const hop = t > 120.0 ? Math.sin(prog(t, 120.0, 120.35) * PI) * 22 : 0;
  drawMe(ctx, mx, my - hop, { t: t, r: r, look: 0.35 * follow + 0.75 * toBubble, lookY: 0.85 * follow - 0.55 * toBubble - 0.05 * turn,
    groundY: GROUND_Y, glow: 0.5 + 0.4 * beat * burst, squash: 1 + 0.06 * beat * burst,
    blink: t > 119.95 && t < 120.08 ? 1 : undefined });
  // 徽章：115.8–116.9 翘起（颤动），之后脱落、旋转下坠出画面
  const c = meChest(mx, my - hop, r, 1, 0), br = r * 0.4;
  if (t < S4I_DETACH) {

    const dt = t - S4I_DETACH, c0 = meChest(cx0, GROUND_Y - S4I_R, S4I_R, 1, 0);

}
// 歌词层：「（你说对不对）」画在“我”冒出的小气泡里，文字微倾
function s4BubbleLyric(ctx, t, tl, L) {
  const lt = tl - L.start, dur = L.end - L.start;
  const g = prog(lt, 0.05, 0.4), e = prog(lt, dur - 0.25, dur, easeInCubic);
  if (g <= 0 || e >= 1) return;
  const bx = 1090, by = 300, bw = 600, bh = 170, tipX = 1035, tipY = 600, sc = easeOutBack(g, 1.8) * (1 - e);
  ctx.save();
  ctx.translate(tipX, tipY); ctx.scale(sc, sc); ctx.translate(-tipX, -tipY);
  drawBubble(ctx, bx + 8, by + 10, bw, bh, tipX + 8, tipY + 10, { fill: 'rgba(7,7,15,0.35)', r: 70 });
  drawBubble(ctx, bx, by, bw, bh, tipX, tipY, { fill: PAL.cream, r: 70 });
  const P = prepText(L.text), Lo = layoutChars(ctx, P, 62, bw - 80, 800, FONT_MIX);
  ctx.translate(bx + bw / 2, by + bh / 2); ctx.rotate(-0.07);
  let x = -Lo.total / 2;
  for (let i = 0; i < P.chars.length; i++) {
    const w = Lo.ws[i], k = clamp01((lt - 0.25 - i * 0.06) / 0.35);
    if (k > 0) {
      drawGlyph(ctx, P.chars[i], x + w / 2, Math.sin(t * 3 + i * 0.8) * 3, easeOutBack(k, 2), 0, clamp01(k * 3),
        P.hl[i] || PAL.indigo, Lo.font, Lo.size, false);
    }

}

// ---- 121–126 全屏排版 ----
function s4Full(ctx, t) {
  const beat = beatPulse(t);
  fillSky(ctx, '#1d1240', '#0d0a24');
  // 斜向滚动色条
  ctx.save();
  ctx.globalAlpha = 0.07 + 0.07 * beat;
  ctx.fillStyle = PAL.me;
  const off = fract(t * 0.45) * 260;
  for (let i = -3; i < 12; i++) {
    const x = i * 260 + off;
    ctx.beginPath(); ctx.moveTo(x, -10); ctx.lineTo(x + 110, -10); ctx.lineTo(x - 190, H + 10); ctx.lineTo(x - 300, H + 10); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
  softGlow(ctx, 960, 470, 950, PAL.me, 0.12 + 0.2 * beat);
  drawBokeh(ctx, t, { count: 40, seed: 17, color: PAL.meGlow, alpha: 0.12, pulse: beat * 1.5, speed: 2 });
}
// 长投影大字（多层偏移暗色 + 主色；可选奶油白描边）
function s4LongGlyph(ctx, ch, x, y, sc, rot, a, col, font, size, outline) {
  if (a <= 0.002 || sc <= 0.001) return;
  ctx.save();
  ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.globalAlpha = clamp01(a);
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = '#0a0718';
  // 半透明（入场/退场）时不叠长投影，避免多层半透明字形叠出脏边
  if (a > 0.97) for (let k = 6; k >= 1; k--) ctx.fillText(ch, k * size * 0.012, k * size * 0.016);
  if (outline) { ctx.lineWidth = size * 0.05; ctx.strokeStyle = PAL.cream; ctx.lineJoin = 'round'; ctx.strokeText(ch, 0, 0); }
  ctx.fillStyle = col; ctx.fillText(ch, 0, 0);

}
function s4FullType(ctx, t, tl, L) {
  const lt = tl - L.start, dur = L.end - L.start, beat = beatPulse(t);
  const P = prepText(L.text), n = P.chars.length;
  const split = L.text.indexOf('做') > 0 ? L.text.indexOf('做') : Math.ceil(n / 2);
  const i0 = L.text.indexOf('不能');
  const S = 210, font = fontStr(S, 900, FONT_MIX), big = 1.45, gap = S * 0.08;
  const rows = [[0, split, 360], [split, n, 655]];
  const ex = prog(lt, dur - 0.4, dur, easeInCubic);
  for (let r = 0; r < 2; r++) {
    const a0 = rows[r][0], a1 = rows[r][1], y = rows[r][2];
    let tot = 0;
    for (let i = a0; i < a1; i++) tot += measureW(ctx, P.chars[i], font) * (i >= i0 && i < i0 + 2 ? big : 1) + gap;
    tot -= gap;
    let x = 960 - tot / 2;
    for (let i = a0; i < a1; i++) {
      const isBig = i0 >= 0 && i >= i0 && i < i0 + 2, w = measureW(ctx, P.chars[i], font) * (isBig ? big : 1);
      const cx = x + w / 2; x += w + gap;
      let sc = (isBig ? big : 1) * (1 + 0.025 * beat), a = 1, dx = 0, dy = 0, rot = 0;
      if (isBig) {   // “不能”：从 3 倍大砸下 + 持续抖动
        const k = clamp01((lt - 0.55 - (i - i0) * 0.12) / 0.2);
        if (k <= 0) continue;
        sc *= lerp(3, 1, easeOutCubic(k)); a = clamp01(k * 2.5);
        dx = Math.sin(t * 41 + i * 2.1) * 4 * (0.4 + beat); dy = Math.cos(t * 37 + i) * 4 * (0.4 + beat);
      } else if (r === 0) {
        const k = clamp01((lt - (i - a0) * 0.1) / 0.55);
        if (k <= 0) continue;
        dy = -(1 - easeOutBounce(k)) * 420; a = clamp01(k * 3); rot = (1 - k) * (hash01(i, 461) - 0.5) * 0.8;
      } else {
        const k = clamp01((lt - 0.95 - (i - a0) * 0.09) / 0.5);
        if (k <= 0) continue;
        dy = (1 - easeOutBack(k, 1.8)) * 300; a = clamp01(k * 3);
      }
      // 退场：逐字放大冲出画面
      const e = clamp01(ex * 1.6 - (i / n) * 0.6);
      sc *= 1 + 1.2 * e; a *= 1 - e;
      s4LongGlyph(ctx, P.chars[i], cx + dx, y + dy, sc, rot, a, P.hl[i] || PAL.cream, font, S, isBig);
    }
  }
  // “不能”盖章时的冲击环
  drawImpact(ctx, 960, 360, lt - 0.75, 160, PAL.me);
}

// ---- 歌词分派（S4 自己绘制歌词；时间都用 tl = t - LYRIC_OFFSET） ----
const S4_LYRIC_FX = {
  'I only want to be your friend': s4BubbleWords,
  '不是情人': function (ctx, t, tl, L) { drawHeroLine(ctx, t, tl, L, S4E_LAY); s4Strike(ctx, t, tl, L); },
  '但我给你的爱暂时收不回来': s4StretchLyric,
  'So I': function (ctx, t, tl, L) { drawHeroLine(ctx, t, tl, L, { x: 960, y: 300, size: 180 }); },
  '我不能只是be 你的朋友': function (ctx, t, tl, L) { drawHeroLine(ctx, t, tl, L, { x: 960, y: 235, size: 130 }); },
  '（你说对不对）': s4BubbleLyric,
  '我不能只是做你的朋友': s4FullType
};
function s4Lyrics(ctx, t, sc) {
  const L = findLyric(t);
  if (!L) return;
  const tl = t - LYRIC_OFFSET, fx = S4_LYRIC_FX[L.text];
  ctx.save();
  if (fx) fx(ctx, t, tl, L);
  else if (L.hero) drawHeroLine(ctx, t, tl, L, null);
  else drawBottomLyric(ctx, t, tl, L, sc);
  ctx.restore();
}

function drawS4(ctx, t, sc) {
  ctx.save();
  if (t < 90) s4Bubble(ctx, t);
  else if (t < 93) s4BadgeScene(ctx, t);
  else if (t < 95) s4Spot(ctx, t);
  else if (t < 100) s4Chest(ctx, t);
  else if (t < 103) s4NotLover(ctx, t);
  else if (t < 108) s4Letter(ctx, t);
  else if (t < 113) s4Boomerang(ctx, t);
  else if (t < 115) s4SoI(ctx, t);
  else if (t < 121) s4Peel(ctx, t);
  else s4Full(ctx, t);
  ctx.restore();
  // 段落转场（113 为硬切黑场，115/119 为连续镜头，不加转场）
  s4Trans(ctx, t, 90, PAL.you);
  s4Trans(ctx, t, 95, PAL.indigo);
  s4Trans(ctx, t, 100, PAL.heart);
  s4Trans(ctx, t, 103, PAL.meGlow);
  s4Trans(ctx, t, 108, PAL.indigo);
  s4Trans(ctx, t, 121, PAL.me);
  s4Trans(ctx, t, 126, PAL.me);   // 只有盖住的前半段落在 S4 内，揭示的后半段在 S5
  if (t < 113 || t >= 115) s4Vignette(ctx, t, 1);
  s4Lyrics(ctx, t, sc);
}
SCENE_IMPL.S4 = { ownsLyrics: true, draw: function (ctx, t, lt, sc) { drawS4(ctx, t, sc); } };
</script>
<script>
// ===== src/scenes_b3.js =====
'use strict';
// =====================================================================
// scenes_b3.js — S5 间奏 2:06–2:14（无歌词）：时间流逝蒙太奇
//   日历页一张张撕下翻飞；“我”沿小路行走（镜头跟随，世界向左滚动）；
//   城市楼群三层视差滚动；“你”的剪影偶尔出现在亮着的窗户里；小雨。
// 楼群按“槽位”程序化生成（hash01），可无限滚动，画面只由 t 决定。
// =====================================================================
const S5_T0 = 126, S5_PATH_Y = 850, S5_ME_X = 760, S5_ME_R = 56;

// 楼群视差层。o = { speed, slot, seed, minH, varH, col, base, win, start }
function s5Buildings(ctx, t, o) {
  const off = (t - S5_T0) * o.speed + o.start;
  const i0 = Math.floor(off / o.slot) - 1, i1 = Math.floor((off + W) / o.slot) + 1;
  for (let i = i0; i <= i1; i++) {
    const w = o.slot * (0.72 + 0.22 * hash01(i, o.seed)), h = o.minH + hash01(i, o.seed + 1) * o.varH;
    const x = i * o.slot - off + (o.slot - w) / 2, top = o.base - h;
    ctx.fillStyle = o.col; ctx.fillRect(x, top, w, h + 2);
    if (hash01(i, o.seed + 2) < 0.4) ctx.fillRect(x + w * 0.2, top - 16, w * 0.22, 16);
    if (!o.win) continue;
    const cols = Math.floor((w - 24) / 34), rows = Math.floor((h - 50) / 46);
    // “你”的窗：部分楼有一扇大窗，隔一段时间亮起，窗里是青绿色圆形剪影
    const youWin = hash01(i, o.seed + 3) < 0.35 && cols >= 3 && rows >= 3;
    const yc = Math.floor(cols / 2) - 1, yr = 1;
    const youOn = youWin && fract((t + hash01(i, o.seed + 5) * 4) / 2.6) < 0.62;
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        if (youWin && r >= yr && r <= yr + 1 && c >= yc && c <= yc + 1) continue;
        const id = i * 97 + r * 13 + c;
        if (hash01(id, o.seed + 4) > 0.3) continue;
        ctx.fillStyle = rgba(PAL.meGlow, 0.45 * (0.75 + 0.25 * Math.sin(t * 0.8 + id)));
        ctx.fillRect(x + 14 + c * 34, top + 26 + r * 46, 16, 24);
      }
    }
    if (youWin) {
      const wx = x + 14 + yc * 34 - 4, wy = top + 26 + yr * 46 - 4, ww = 58, wh = 74;
      ctx.fillStyle = youOn ? '#ffd08a' : '#2a3060'; ctx.fillRect(wx, wy, ww, wh);
      if (youOn) {
        softGlow(ctx, wx + ww / 2, wy + wh / 2, 90, PAL.meGlow, 0.35);
        circle(ctx, wx + ww / 2, wy + wh * 0.58, 20, '#1f6a71');
        ctx.fillStyle = '#1f6a71'; ctx.fillRect(wx + 8, wy + wh * 0.82, ww - 16, wh * 0.18);
      }
      ctx.fillStyle = o.col; ctx.fillRect(wx + ww / 2 - 2, wy, 4, wh); ctx.fillRect(wx, wy + wh / 2 - 2, ww, 4);
    }
  }
}
// 日历页：中心 (x, y)，idx 决定月份与日期；sx 为水平翻转压缩（翻飞时模拟背面）
function s5CalPage(ctx, x, y, w, h, idx, rot, sx, a) {
  if (a <= 0) return;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(sx, 1);
  ctx.globalAlpha = clamp01(a);
  const back = sx < 0;
  fillRoundRect(ctx, -w / 2, -h / 2, w, h, 14, back ? '#e9dcc4' : PAL.cream);
  if (!back) {
    ctx.save(); roundRectPath(ctx, -w / 2, -h / 2, w, h, 14); ctx.clip();
    ctx.fillStyle = PAL.me; ctx.fillRect(-w / 2, -h / 2, w, h * 0.28);
    ctx.restore();
    const month = (idx + 2) % 12 + 1, day = 1 + Math.floor(hash01(idx, 501) * 28);
    drawText(ctx, month + '月', 0, -h / 2 + h * 0.14, h * 0.15, PAL.cream, { weight: 800, family: FONT_CN, shadow: false, alpha: a });
    drawText(ctx, String(day), 0, h * 0.14, h * 0.42, PAL.indigo, { weight: 900, family: FONT_EN, shadow: false, alpha: a });
  }
  ctx.restore();
}
const S5_CAL_X = 1560, S5_CAL_Y = 270, S5_CAL_W = 250, S5_CAL_H = 270, S5_FLIP0 = 126.5, S5_FLIP = 0.55;
function s5Calendar(ctx, t) {
  const rise = easeOutBack(prog(t, 126.15, 126.55), 1.6);
  if (rise <= 0) return;
  const p = t < S5_FLIP0 ? -1 : Math.min(12, Math.floor((t - S5_FLIP0) / S5_FLIP));
  ctx.save();
  ctx.translate(S5_CAL_X, S5_CAL_Y); ctx.scale(rise, rise); ctx.translate(-S5_CAL_X, -S5_CAL_Y);
  fillRoundRect(ctx, S5_CAL_X - S5_CAL_W / 2 + 10, S5_CAL_Y - S5_CAL_H / 2 + 14, S5_CAL_W, S5_CAL_H, 14, 'rgba(7,7,15,0.35)');
  s5CalPage(ctx, S5_CAL_X, S5_CAL_Y, S5_CAL_W, S5_CAL_H, p + 1, 0, 1, 1);
  // 装订条与线圈
  fillRoundRect(ctx, S5_CAL_X - S5_CAL_W / 2 - 8, S5_CAL_Y - S5_CAL_H / 2 - 18, S5_CAL_W + 16, 26, 10, '#2e3466');
  for (let k = -1; k <= 1; k += 2) ring(ctx, S5_CAL_X + k * 70, S5_CAL_Y - S5_CAL_H / 2 - 6, 9, 5, PAL.grey);
  ctx.restore();
  // 撕下的页：向左上飞起后飘落，边飞边翻转
  for (let q = Math.max(0, p - 3); q <= p; q++) {
    const age = t - (S5_FLIP0 + q * S5_FLIP);
    if (age < 0 || age > 1.8) continue;
    const dir = hash01(q, 502) < 0.5 ? -1 : 1;
    const x = S5_CAL_X - age * (260 + 120 * hash01(q, 503)) + Math.sin(age * 6 + q) * 40;
    const y = S5_CAL_Y - 140 * age + 260 * age * age;
    s5CalPage(ctx, x, y, S5_CAL_W, S5_CAL_H, q, dir * (age * 1.6 + Math.sin(age * 5 + q) * 0.4), Math.cos(age * 7 + q * 0.5), 1 - age / 1.8);
  }
}
function s5Rain(ctx, t) {
  ctx.save();
  ctx.strokeStyle = 'rgba(191,227,255,0.35)'; ctx.lineWidth = 2; ctx.lineCap = 'round';
  ctx.beginPath();
  for (let i = 0; i < 130; i++) {
    const sp = 0.9 + 0.5 * hash01(i, 511), span = H + 120;
    const y = fract(hash01(i, 512) + t * sp * 1.2) * span - 60;
    const x = ((hash01(i, 513) * (W + 200) - t * 120 - y * 0.25) % (W + 200) + W + 200) % (W + 200) - 100;
    ctx.moveTo(x, y); ctx.lineTo(x - 9, y + 30);
  }
  ctx.stroke();
  // 地面溅起的小水圈
  for (let i = 0; i < 18; i++) {
    const ph = fract(t * 1.3 + hash01(i, 514)), x = hash01(i + Math.floor(t * 1.3 + hash01(i, 514)) * 19, 515) * W;
    const y = S5_PATH_Y - 30 + hash01(i, 516) * 200;
    ctx.globalAlpha = 0.4 * (1 - ph);
    ctx.beginPath(); ctx.ellipse(x, y, 4 + ph * 22, 2 + ph * 6, 0, 0, TAU); ctx.lineWidth = 2; ctx.stroke();
  }
  ctx.restore();
}
function drawS5(ctx, t) {
  fillSky(ctx, '#1b2240', '#3a4a7a');
  // 阴天云层缓慢漂移
  for (let i = 0; i < 6; i++) {
    const x = ((hash01(i, 521) * (W + 600) - (t - S5_T0) * 18) % (W + 600) + W + 600) % (W + 600) - 300;
    drawCloud(ctx, x, 90 + hash01(i, 522) * 160, 140 + hash01(i, 523) * 80, '#2b3563', 0.9);
  }
  s5Buildings(ctx, t, { speed: 30, slot: 150, seed: 531, minH: 220, varH: 230, col: '#2a3462', base: GROUND_Y, win: false, start: 0 });
  s5Buildings(ctx, t, { speed: 110, slot: 230, seed: 541, minH: 240, varH: 260, col: '#1a2048', base: GROUND_Y, win: true, start: 400 });
  // 地面 + 小路（虚线中线随步伐滚动）
  ctx.fillStyle = '#121734'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#2b3160'; ctx.fillRect(0, S5_PATH_Y - 30, W, 60);
  ctx.fillStyle = 'rgba(255,244,224,0.18)';
  const po = ((t - S5_T0) * 260) % 160;
  for (let x = -po; x < W; x += 160) ctx.fillRect(x, S5_PATH_Y - 3, 80, 6);
  // 雨中积水反光
  ctx.fillStyle = 'rgba(191,227,255,0.06)'; ctx.fillRect(0, S5_PATH_Y + 30, W, 8);
  // “我”沿小路走：每拍一步（上下颠 + 挤压 + 摆手），偶尔抬头看窗
  const ph = beatPos(t) - beatPos(S5_T0), bob = Math.abs(Math.sin(ph * PI)) * 14, sw = Math.sin(ph * PI) * 0.35;
  const up = Math.max(env(t, 128.3, 129.4, 0.3, 0.3), env(t, 131.1, 132.3, 0.3, 0.3));
  drawMe(ctx, S5_ME_X, S5_PATH_Y - S5_ME_R - bob, { t: t, r: S5_ME_R, squash: 1 + 0.06 * Math.cos(ph * TAU),
    look: 0.55 + 0.2 * up, lookY: -0.7 * up + 0.15 * (1 - up), groundY: S5_PATH_Y, glow: 0.45,
    hands: [{ a: PI * 0.62 + sw, len: 0.45 }, { a: PI * 0.38 + sw, len: 0.45 }] });
  // 前景快速掠过的路灯与矮树丛（最近一层视差）
  const fo = (t - S5_T0) * 420;
  for (let i = Math.floor(fo / 700) - 1; i <= Math.floor((fo + W) / 700) + 1; i++) {
    const x = i * 700 - fo + 300;
    ctx.fillStyle = '#0b0f24';
    ctx.beginPath(); ctx.arc(x + 260, H + 20, 150 + 40 * hash01(i, 551), PI, TAU); ctx.fill();
    fillRoundRect(ctx, x - 9, 470, 18, H - 470, 8, '#0b0f24');
    fillRoundRect(ctx, x - 9, 462, 90, 14, 7, '#0b0f24');
    softGlow(ctx, x + 70, 486, 120, PAL.meGlow, 0.35);
    circle(ctx, x + 70, 484, 11, '#ffe1a8');
  }
  s5Rain(ctx, t);
  s5Calendar(ctx, t);
  veil(ctx, '#1b2240', 0.12);
  s4Vignette(ctx, t, 0.3);
  s4Trans(ctx, t, S5_T0, PAL.me);   // 揭示：S4 末尾的珊瑚色斜块向右离开
}
SCENE_IMPL.S5 = { draw: function (ctx, t) { drawS5(ctx, t); } };
</script>
<script>
// ===== src/scenes_c.js =====
'use strict';
// =====================================================================
// scenes_c.js — S6 主歌二（2:14–2:58）共用件 + 前四段。
// 复用 S2/S3 母题，但用更冷的紫蓝夜色、更快的镜头切换、更强的变体：
//   134–137 「我猜」：多个问号环绕“我”旋转（前后分层），镜头推近
//   137–141 「你早就想要说明白」：一排“…”气泡依次弹出、并排打字不结束，“你”视线移开
//   141–143 「That's right」（大字）：大对勾 ✓ 一笔画出并盖章
//   143–147 「我觉得自己好失败」：爱心碎成许多三角碎片，带 glitch 飞散，画面降饱和
// 后续：scenes_c1.js（147–162）、scenes_c2.js（162–178，登记 SCENE_IMPL.S6）。
// 所有画面只由 t 决定（hash01 / 加载时固定随机表），无帧间状态。
// =====================================================================

const S6_COLD = '#8a7bff', S6_ICE = '#bcd0ff', S6_DEEP = '#120f33';

// ---- 共用：冷色夜晚街道（S0/S1 的街道换成紫蓝色调） ----
function s6Street(ctx, t) {
  drawStreet(ctx, t, { top: '#0e0c26', bot: '#2a2560', starA: 0.85, bld: '#1b1840', gnd: '#0b0a1f',
    rim: '#2f2a6a', win: 0.45, light: 0.8 });
  drawBokeh(ctx, t, { count: 26, seed: 601, color: S6_COLD, alpha: 0.09, pulse: beatPulse(t) * 0.6, speed: 1.3 });
}
// 圆形“开眼”转场：t0..t0+d 期间，黑幕中央开出的圆洞从 0 扩大到铺满
function s6Iris(ctx, t, t0, d, x, y) {
  const k = prog(t, t0, t0 + d, easeInOutCubic);
  if (k >= 1) return;
  const R = Math.max(0.5, k * 1500);
  ctx.beginPath(); ctx.rect(0, 0, W, H);
  ctx.moveTo(x + R, y); ctx.arc(x, y, R, 0, TAU, true);
  ctx.fillStyle = '#05040c'; ctx.fill('evenodd');
}
// glitch：RGB 色差 + 横向错位噪声带（复用 S3 的 VHS 工具，离屏缓冲每帧完整重写）
function s6Glitch(ctx, t, amt) {
  if (amt <= 0.02) return;
  rgbShift(ctx, 4 + 26 * amt);
  vhsBands(ctx, t, amt);
}

// =====================================================================
// 134–137 「我猜」：问号环绕旋转
// =====================================================================
function s6QMarks(ctx, t, cx, cy, front) {
  const cols = [PAL.cream, S6_COLD, PAL.meGlow, S6_ICE];
  const out = 1 - prog(t, 136.7, 137.0, easeInQuad);
  for (let i = 0; i < 7; i++) {
    const k = prog(t, 134.15 + i * 0.12, 134.6 + i * 0.12);
    if (k <= 0) continue;
    const a = i / 7 * TAU + (t - 134) * 1.9, s = Math.sin(a);
    if ((s > 0) !== front) continue;
    const pop = easeOutBack(k, 2.4) * out;
    if (pop <= 0.02) continue;
    const depth = 0.78 + 0.3 * (s + 1) / 2;
    const x = cx + Math.cos(a) * 205, y = cy + s * 70 - 30 * Math.cos(a) + Math.sin(t * 3 + i) * 8;
    drawQuestion(ctx, x, y, (58 + 28 * hash01(i, 611)) * depth * pop, cols[i % 4], front ? 1 : 0.6, Math.sin(t * 3 + i) * 0.3);
  }
}
function s6Guess(ctx, t) {
  const zk = prog(t, 134.3, 135.4, easeInOutCubic) * (1 - prog(t, 136.6, 137.0, easeInOutCubic));
  withCamera(ctx, lerp(960, ME_X + 60, zk), lerp(540, 620, zk), lerp(1, 1.3, zk), 0, function () {
    s6Street(ctx, t);
    const cx = ME_X, cy = ME_Y - 80;
    s6QMarks(ctx, t, cx, cy, false);
    const look = clamp(Math.sin((t - 134) * 5.5) * 2, -1, 1);
    drawMe(ctx, ME_X, ME_Y, { t: t, r: 60, look: look, lookY: -0.45, groundY: GROUND_Y, glow: 0.45,
      squash: 1 + 0.05 * beatPulse(t), rot: Math.sin((t - 134) * 5.5) * 0.06 });
    s6QMarks(ctx, t, cx, cy, true);
  });
  s6Iris(ctx, t, 134, 0.5, ME_X, ME_Y);   // 从 S5 硬切黑场后开眼
}

// =====================================================================
// 137–141 「你早就想要说明白」：一排“…”气泡
// =====================================================================
function s6Dots(ctx, t) {
  s6Street(ctx, t);
  const away = prog(t, 137.9, 138.4, easeInOutCubic);
  drawMe(ctx, ME_X, ME_Y, { t: t, r: 60, look: 0.55, lookY: -0.75, groundY: GROUND_Y, glow: 0.4 });
  const ux = lerp(1560, YOU_X, prog(t, 137.0, 137.35, easeOutCubic));
  drawYou(ctx, ux, YOU_Y, { t: t, r: 78, look: lerp(-0.8, 1, away), lookY: -0.3 * away, groundY: GROUND_Y });
  const hx = ux - 10, hy = YOU_Y - 90;
  for (let i = 0; i < 5; i++) {
    const t0 = 137.25 + i * 0.6, g = prog(t, t0, t0 + 0.35);
    const e = prog(t, 140.7 + i * 0.04, 140.95 + i * 0.04, easeInQuad);
    if (g <= 0 || e >= 1) continue;
    const bw = 270, bh = 130, bx = 205 + i * 310, by = 140 + (i % 2) * 70 + Math.sin(t * 2 + i) * 6;
    const cxb = bx + bw / 2, cyb = by + bh / 2, s = easeOutBack(g, 2) * (1 - e);
    // 尾巴指向“你”的头顶方向（短尾巴）
    const dx = hx - cxb, dy = hy - (by + bh), L = Math.hypot(dx, dy) || 1;
    const tx = cxb + dx / L * 70, ty = by + bh + Math.max(30, dy / L * 70);
    ctx.save();
    ctx.translate(cxb, by + bh); ctx.scale(s, s); ctx.translate(-cxb, -(by + bh));
    drawBubble(ctx, bx + 6, by + 8, bw, bh, tx + 6, ty + 8, { fill: 'rgba(7,7,15,0.3)' });
    drawBubble(ctx, bx, by, bw, bh, tx, ty, { fill: PAL.cream });
    drawDots(ctx, cxb, cyb + 4, t + i * 0.37, { color: PAL.indigo, r: 10, gap: 32 });
    ctx.restore();

}

// =====================================================================
// 141–143 「That's right」：大对勾一笔画出 + 盖章
// =====================================================================
const S6C_PTS = [780, 660, 920, 790, 1170, 500], S6C_CX = 970, S6C_CY = 640, S6C_STAMP = 141.8;
function s6CheckPath(ctx, k) {
  const P = S6C_PTS, l1 = Math.hypot(P[2] - P[0], P[3] - P[1]), l2 = Math.hypot(P[4] - P[2], P[5] - P[3]);
  const d = k * (l1 + l2);
  ctx.beginPath(); ctx.moveTo(P[0], P[1]);
  if (d <= l1) { ctx.lineTo(lerp(P[0], P[2], d / l1), lerp(P[1], P[3], d / l1)); return; }
  ctx.lineTo(P[2], P[3]);
  ctx.lineTo(lerp(P[2], P[4], (d - l1) / l2), lerp(P[3], P[5], (d - l1) / l2));

function s6Check(ctx, t) {
  const beat = beatPulse(t), since = t - S6C_STAMP, sh = since > 0 ? Math.exp(-since * 11) * 18 : 0;
  fillSky(ctx, '#1b1550', '#0a0920');
  softGlow(ctx, S6C_CX, S6C_CY, 900, S6_COLD, 0.16 + 0.12 * beat);
  ctx.save(); ctx.translate(S6C_CX, S6C_CY); ctx.rotate(t * 0.3);
  ctx.globalAlpha = 0.07 + (since > 0 ? 0.14 * Math.exp(-since * 3) : 0);
  for (let i = 0; i < 16; i++) {
    ctx.rotate(TAU / 16);
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(-60, -1300); ctx.lineTo(60, -1300); ctx.closePath();
    ctx.fillStyle = S6_ICE; ctx.fill();
  }
  ctx.restore();
  drawBokeh(ctx, t, { count: 30, seed: 613, color: S6_ICE, alpha: 0.1, pulse: beat, speed: 1.6 });
  ctx.fillStyle = '#0b0a1f'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.save();
  ctx.translate(Math.sin(t * 71) * sh, Math.cos(t * 59) * sh);
  // “我”在左侧，被盖章时吓得一缩
  const flinch = since > 0 ? Math.exp(-since * 6) : 0;
  drawMe(ctx, 300, GROUND_Y - 50, { t: t, r: 50, look: 0.9, lookY: -0.4, mood: 'sad', groundY: GROUND_Y,
    glow: 0.3, squash: 1 + 0.25 * flinch, blink: flinch > 0.6 ? 1 : undefined });

    ctx.save(); ctx.translate(14, 18); s6CheckPath(ctx, k); ctx.lineWidth = 72; ctx.strokeStyle = 'rgba(7,7,15,0.45)'; ctx.stroke(); ctx.restore();
    s6CheckPath(ctx, k); ctx.lineWidth = 72; ctx.strokeStyle = PAL.you; ctx.stroke();
    s6CheckPath(ctx, k); ctx.lineWidth = 16; ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.stroke();
  }
  // 盖章圆框：从大砸下，双线，略倾斜；外扩冲击环
  const ks = prog(t, S6C_STAMP, S6C_STAMP + 0.16);
  if (ks > 0) {
    ctx.save();
    ctx.translate(S6C_CX, S6C_CY); ctx.rotate(-0.12); const s = lerp(1.7, 1, easeOutCubic(ks)); ctx.scale(s, s);
    ctx.globalAlpha = clamp01(ks * 2) * 0.95;
    ring(ctx, 0, 0, 220, 16, PAL.me);
    ring(ctx, 0, 0, 194, 5, PAL.me);
    for (let i = 0; i < 12; i++) {
      const a = i / 12 * TAU;
      circle(ctx, Math.cos(a) * 207, Math.sin(a) * 207, 4, PAL.me);
    }
    ctx.restore();
    const ek = clamp01((since - 0.05) / 0.45);
    if (ek > 0 && ek < 1) ring(ctx, S6C_CX, S6C_CY, 220 + 80 * easeOutCubic(ek), 10 * (1 - ek), rgba(PAL.cream, 0.8 * (1 - ek)));
  }
  ctx.restore();
  veil(ctx, '#ffffff', since > 0 ? 0.35 * Math.exp(-since * 14) : 0);
}

// =====================================================================
// 143–147 「我觉得自己好失败」：爱心碎成三角碎片 + glitch
// =====================================================================
const S6D_X = 1060, S6D_Y = 420, S6D_S = 10, S6D_BREAK = 144.4;
// 碎片表（加载时生成）：在单位爱心内取抖动网格点，每点一片三角形
const S6D_SHARDS = (function () {
  const out = [];
  let c = 0;
  for (let gy = -11; gy <= 16; gy += 2.5) {
    for (let gx = -15; gx <= 15; gx += 2.5) {
      c++;
      const x = gx + (hash01(c, 621) - 0.5) * 1.2, y = gy + (hash01(c, 622) - 0.5) * 1.2;
      if (!s4InHeart(x, y)) continue;
      const a = Math.atan2(y - 2, x) + (hash01(c, 623) - 0.5) * 0.9;
      out.push({ x: x, y: y, a: a, sp: 380 + hash01(c, 624) * 720, size: 1.6 + hash01(c, 625) * 1.2,
        rot: hash01(c, 626) * TAU, spin: (hash01(c, 627) - 0.5) * 14, col: Math.floor(hash01(c, 628) * 3) });
    }

  return out;
})();
const S6D_COLS = [PAL.heart, '#ff86a8', '#d9467a'];
function s6Shatter(ctx, t) {
  const gray = prog(t, S6D_BREAK, 146.2), beat = beatPulse(t);
  fillSky(ctx, mixColor('#221c5a', '#1a1a2a', gray), mixColor('#0d0b26', '#0a0a12', gray));
  drawBokeh(ctx, t, { count: 22, seed: 631, color: S6_COLD, alpha: 0.08, pulse: beat * 0.5 });
  drawGround(ctx, '#0c0b1f', '#2a2560');
  const after = t > S6D_BREAK + 0.3;
  drawMe(ctx, 520, GROUND_Y - 60, { t: t, r: 60, look: 0.85, lookY: after ? 0.5 : -0.4, mood: after ? 'sad' : undefined,
    groundY: GROUND_Y, glow: lerp(0.5, 0.15, gray), squash: 1 + 0.12 * prog(t, S6D_BREAK, S6D_BREAK + 0.4, easeOutBack) });
  const dt = t - S6D_BREAK;
  if (dt < 0) {
    const pop = easeOutBack(prog(t, 143.0, 143.4), 2), shake = prog(t, 143.7, S6D_BREAK) * 7;
    drawHeartHalves(ctx, S6D_X + Math.sin(t * 63) * shake, S6D_Y + Math.cos(t * 57) * shake, S6D_S * pop,
      { crack: prog(t, 143.6, 144.2), fill: PAL.heart });
  } else {
    const fade = 1 - 0.65 * prog(dt, 1.2, 2.6);
    for (let i = 0; i < S6D_SHARDS.length; i++) {
      const s = S6D_SHARDS[i], d = s.sp * (1 - Math.exp(-2.4 * dt)) / 2.4;
      const x = S6D_X + s.x * S6D_S + Math.cos(s.a) * d, y = S6D_Y + s.y * S6D_S + Math.sin(s.a) * d + 90 * dt * dt;
      const r = s.size * S6D_S * (1 - 0.3 * prog(dt, 0, 2.5)), rot = s.rot + dt * s.spin;
      ctx.globalAlpha = fade;
      regularPolyPath(ctx, x, y, r, 3, rot);
      ctx.fillStyle = S6D_COLS[s.col]; ctx.fill();
    }
    ctx.globalAlpha = 1;
  }
  veil(ctx, '#ffffff', 0.5 * (1 - prog(t, S6D_BREAK, S6D_BREAK + 0.15)) * (dt >= 0 ? 1 : 0));
  desatScreen(ctx, gray * 0.6);
  const gl = Math.max(env(t, 143.85, 144.0, 0.02, 0.05), env(t, S6D_BREAK, S6D_BREAK + 0.35, 0.02, 0.2),
    env(t, 145.6, 145.72, 0.02, 0.04), env(t, 146.35, 146.5, 0.02, 0.05));
  s6Glitch(ctx, t, gl);
}

<script>
// ===== src/scenes_c1.js =====
'use strict';
// =====================================================================
// scenes_c1.js — S6 主歌二 中段（2:27–2:42）
//   147–151 「从天堂掉落到深渊」：俯视下坠，镜头螺旋旋转，隧道环越来越暗，深度读数飞涨（比 S2 更深更暗）
//   151–154 「多无奈」：“我”落在巨大空旷的黑色空间里，镜头拉远直到“我”极小
//   154–158 「我愿意改变 (what can I do?)」：快速换几何配饰（眼镜 / 礼帽 / 领结 / 派对帽 / 全套），每次弹出
//   158–162 「重新再来一遍 (just give me change)」：磁带快速倒带，磁带轮逆转，VHS 色差
// =====================================================================

// ---- 147–151 螺旋下坠 ----
const S6E_CX = 960, S6E_CY = 470;
function s6Spiral(ctx, t) {
  const lt = t - 147, k = prog(t, 147, 151), dark = smoothstep(0, 0.65, k);
  const g = ctx.createRadialGradient(S6E_CX, S6E_CY, 0, S6E_CX, S6E_CY, 1200);
  g.addColorStop(0, mixColor('#3a2f8a', '#000000', dark));
  g.addColorStop(0.45, mixColor('#8a80e0', '#07060f', dark));
  g.addColorStop(1, mixColor('#d8d2ff', '#151233', dark));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 镜头旋转角：越往下转得越快（角速度线性增加）
  const rot = 0.9 * lt + 0.35 * lt * lt, fall = 0.55 * lt + 0.12 * lt * lt;
  const ringCol = mixColor(S6_ICE, '#4a3f9a', k);
  ctx.lineJoin = 'round';
  for (let i = 0; i < 16; i++) {
    const z = fract(i / 16 + fall), r = 26 * Math.pow(50, z);
    ctx.save(); ctx.translate(S6E_CX, S6E_CY); ctx.rotate(rot + z * 2.6);
    regularPolyPath(ctx, 0, 0, r, 6, 0);
    ctx.lineWidth = 2 + r * 0.025; ctx.strokeStyle = rgba(ringCol, clamp01(z * 3) * (0.55 - 0.25 * k));
    ctx.stroke();
    ctx.restore();
  }
  // 径向速度线 + 微光（向外飞 = 我们在向下坠）
  for (let i = 0; i < 44; i++) {
    const z = fract(hash01(i, 641) + lt * (1.0 + 0.6 * k)), a = hash01(i, 642) * TAU + rot * 0.7;
    const r1 = 50 * Math.pow(26, z), r2 = r1 * (1.18 + 0.2 * k);
    const ca = Math.cos(a), sa = Math.sin(a);
    line(ctx, S6E_CX + ca * r1, S6E_CY + sa * r1, S6E_CX + ca * r2, S6E_CY + sa * r2, 1.5 + z * 4,
      rgba(i % 3 ? S6_ICE : PAL.meGlow, 0.5 * z * (1 - 0.5 * k)));
  }
  // “我”：在画面中央随镜头一起旋转，越来越小（越来越深）
  const mr = lerp(74, 42, easeInQuad(k));
  softGlow(ctx, S6E_CX, S6E_CY, mr * 3.2, PAL.meGlow, 0.45);
  ctx.save(); ctx.translate(S6E_CX, S6E_CY); ctx.rotate(rot * 1.15);
  drawMe(ctx, 0, 0, { t: t, r: mr, look: Math.sin(t * 4) * 0.4, lookY: -0.7, shadow: false, glow: 0.3,
    hands: [{ a: -2.4, len: 0.6 }, { a: -0.7, len: 0.6 }], squash: 1 + 0.05 * Math.sin(t * 9) });
  ctx.restore();
  // 深度读数（右上）与竖向刻度
  const depth = Math.round(9999 * easeInCubic(k));
  fillRoundRect(ctx, 1500, 80, 320, 96, 18, 'rgba(7,7,15,0.55)');
  drawText(ctx, 'DEPTH', 1530, 108, 22, S6_ICE, { align: 'left', family: FONT_EN, weight: 700, shadow: false });
  drawText(ctx, '-' + depth + 'm', 1795, 140, 46, depth > 5000 ? PAL.heart : PAL.cream, { align: 'right', family: FONT_EN, weight: 800, shadow: false });
  line(ctx, 1790, 220, 1790, 760, 4, 'rgba(188,208,255,0.35)');
  for (let j = 0; j <= 9; j++) line(ctx, 1772, 220 + j * 60, 1790, 220 + j * 60, 3, 'rgba(188,208,255,0.35)');
  const py = lerp(220, 760, easeInCubic(k));
  ctx.beginPath(); ctx.moveTo(1784, py); ctx.lineTo(1760, py - 12); ctx.lineTo(1760, py + 12); ctx.closePath();
  ctx.fillStyle = PAL.me; ctx.fill();
  veil(ctx, '#ffffff', 0.7 * (1 - prog(t, 147, 147.25)));   // 硬切进来时的白闪
}

// ---- 151–154 巨大黑色空间里的小小“我” ----
function s6Tiny(ctx, t) {
  fillSky(ctx, '#020206', '#05050c');
  for (let i = 0; i < 40; i++) {
    ctx.globalAlpha = 0.22 * starTwinkle(t, i);
    circle(ctx, hash01(i, 651) * W, hash01(i, 652) * 620, 1 + hash01(i, 653) * 1.3, S6_ICE);
  }
  ctx.globalAlpha = 1;
  const z = lerp(1, 0.2, prog(t, 151.3, 153.6, easeInOutCubic)), land = t - 151;
  withCamera(ctx, 960, 560, z, 0, function () {
    ctx.fillStyle = '#07070f'; ctx.fillRect(-6000, 620, 14000, 3200);
    ctx.fillStyle = 'rgba(138,123,255,0.22)'; ctx.fillRect(-6000, 620, 14000, 3 / z);
    softGlow(ctx, 960, 580, 240, S6_COLD, 0.16);
    // 落地灰尘
    if (land < 0.7) {
      const kk = land / 0.7;
      for (let i = 0; i < 6; i++) {
        const side = i < 3 ? -1 : 1, j = i % 3;
        ctx.globalAlpha = 0.5 * (1 - kk);
        circle(ctx, 960 + side * (60 + kk * (90 + j * 40)), 612 - Math.sin(kk * PI) * 10 * (j + 1), (12 - j * 2) * (1 - kk * 0.5), '#2a2a48');
      }
      ctx.globalAlpha = 1;
    }
    const sq = 1 + 0.45 * Math.exp(-7 * land) * Math.cos(land * 16);
    drawMe(ctx, 960, 560, { t: t, r: 60, squash: sq, mood: land > 0.5 ? 'sad' : undefined, look: -0.1, lookY: 0.5,
      glow: 0.22, groundY: 620 });
    // 头顶小乌云 + 雨
    const cs = easeOutBack(prog(t, 151.6, 152.0), 2);
    if (cs > 0) {
      drawCloud(ctx, 960 + Math.sin(t * 1.3) * 6, 405, 55 * cs, '#3a3d5a');
      for (let i = 0; i < 7; i++) {
        const ph = fract(t * 1.8 + hash01(i, 654)), x = 924 + i * 12, y = lerp(430, 496, ph);
        line(ctx, x, y, x, y + 12, 3, rgba(PAL.skyBlue, 0.7 * cs));
      }
    }
  });

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---- 154–158 换配饰 ----
const S6G_SW = [154.5, 155.2, 155.9, 156.6, 157.3];
const S6G_SET = [['glasses'], ['top'], ['bow'], ['party', 'glasses'], ['top', 'glasses', 'bow']];
const S6G_COL = [S6_COLD, PAL.you, PAL.heart, '#ffc94a', PAL.me];
const S6G_INK = '#1b1d33';
function s6Glasses(ctx, x, y, r, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (let side = -1; side <= 1; side += 2) {
    circle(ctx, side * r * 0.34, 0, r * 0.25, 'rgba(191,227,255,0.3)');
    ring(ctx, side * r * 0.34, 0, r * 0.25, r * 0.07, S6G_INK);
    line(ctx, side * r * 0.59, -r * 0.04, side * r * 0.86, -r * 0.1, r * 0.05, S6G_INK);
  }

}
function s6TopHat(ctx, x, y, r, s, rot) {
  ctx.save(); ctx.translate(x, y + r * 0.12); ctx.rotate(rot); ctx.scale(s, s);
  fillRoundRect(ctx, -r * 0.48, -r * 0.95, r * 0.96, r * 0.95, r * 0.08, S6G_INK);
  ctx.fillStyle = PAL.heart; ctx.fillRect(-r * 0.48, -r * 0.3, r * 0.96, r * 0.16);
  fillRoundRect(ctx, -r * 0.8, -r * 0.06, r * 1.6, r * 0.16, r * 0.08, S6G_INK);
  ctx.restore();
}
function s6Bow(ctx, x, y, r, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  for (let side = -1; side <= 1; side += 2) {
    ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(side * r * 0.4, -r * 0.22); ctx.lineTo(side * r * 0.4, r * 0.22); ctx.closePath();
    ctx.fillStyle = PAL.heart; ctx.fill(); ctx.lineWidth = r * 0.04; ctx.strokeStyle = '#a8264f'; ctx.stroke();
  }
  circle(ctx, 0, 0, r * 0.09, '#a8264f');
  ctx.restore();
}
function s6PartyHat(ctx, x, y, r, s) {
  ctx.save(); ctx.translate(x, y + r * 0.1); ctx.rotate(0.22); ctx.scale(s, s);
  ctx.beginPath(); ctx.moveTo(-r * 0.36, 0); ctx.lineTo(0, -r * 1.05); ctx.lineTo(r * 0.36, 0); ctx.closePath();
  ctx.fillStyle = '#ffc94a'; ctx.fill();
  ctx.save(); ctx.clip();
  for (let i = 0; i < 4; i++) { ctx.fillStyle = PAL.you; ctx.fillRect(-r, -r * (0.18 + i * 0.26), r * 2, r * 0.09); }
  ctx.restore();
  circle(ctx, 0, -r * 1.07, r * 0.12, PAL.cream);
  ctx.restore();
}
function s6Gear(ctx, t) {
  let idx = -1;
  for (let i = 0; i < S6G_SW.length; i++) if (t >= S6G_SW[i]) idx = i;
  const col = idx >= 0 ? S6G_COL[idx] : S6_COLD, ts = idx >= 0 ? S6G_SW[idx] : 154, since = t - ts, beat = beatPulse(t);
  fillSky(ctx, '#17134a', '#0b0a22');
  ctx.save(); ctx.globalAlpha = 0.08;
  for (let i = 0; i < 14; i++) {
    const a = i / 14 * TAU + t * 0.35;
    ctx.beginPath(); ctx.moveTo(960, 520);
    ctx.lineTo(960 + Math.cos(a - 0.1) * 1400, 520 + Math.sin(a - 0.1) * 1400);
    ctx.lineTo(960 + Math.cos(a + 0.1) * 1400, 520 + Math.sin(a + 0.1) * 1400);

  }

    for (let j = 0; j < 12; j++) {
      const a = j / 12 * TAU + idx, d = r * 1.1 + easeOutCubic(kk) * 260;
      circle(ctx, 960 + Math.cos(a) * d, gy - r + Math.sin(a) * d, 9 * (1 - kk), j % 2 ? col : PAL.cream);
    }
  }
  const sq = 1 + (idx >= 0 ? 0.22 * Math.exp(-since * 9) * Math.cos(since * 20) : 0.03 * beat);
  const happy = idx === 4 && since > 0.3;
  drawMe(ctx, 960, gy - r, { t: t, r: r, squash: sq, look: Math.sin(t * 1.7) * 0.3, lookY: -0.1, glow: 0.55,
    groundY: gy, mood: happy ? 'happy' : undefined, blink: happy ? 0 : undefined });
  if (idx < 0) return;
  // 配饰锚点（考虑以脚底为锚点的挤压：竖直方向 1/sq）
  const sy = 1 / sq, cy = gy - r * sy, top = gy - 2 * r * sy, pop = easeOutElastic(clamp01(since / 0.6));
  const set = S6G_SET[idx];
  for (let i = 0; i < set.length; i++) {
    const s = pop;
    if (set[i] === 'glasses') s6Glasses(ctx, 960, cy - r * 0.12 * sy, r, s);
    else if (set[i] === 'top') s6TopHat(ctx, 960, top, r, s, -0.1 + Math.sin(t * 2) * 0.04);
    else if (set[i] === 'bow') s6Bow(ctx, 960, cy + r * 0.66 * sy, r, s);

}

// ---- 158–162 磁带倒带 ----
function s6Reel(ctx, x, y, pack, ang) {
  circle(ctx, x, y, pack, '#4a2e22');
  ring(ctx, x, y, pack - 4, 2, 'rgba(255,255,255,0.12)');
  ctx.save(); ctx.translate(x, y); ctx.rotate(ang);
  // 高速旋转的残影扇区
  ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, pack - 6, 0, 1.1); ctx.closePath();
  ctx.fillStyle = 'rgba(255,255,255,0.07)'; ctx.fill();
  circle(ctx, 0, 0, 42, PAL.cream);
  for (let i = 0; i < 6; i++) {
    ctx.save(); ctx.rotate(i / 6 * TAU); ctx.fillStyle = S6_DEEP; ctx.fillRect(-5, -28, 10, 14); ctx.restore();
  }
  circle(ctx, 0, 0, 13, S6_DEEP);
  ctx.restore();
}
function s6Tape(ctx, t) {
  const lt = t - 158, k = prog(t, 158.2, 161.8, easeInOutSine), fr = Math.floor(t * 30);
  fillSky(ctx, S6_DEEP, '#06050f');
  // 倒带速度线（向左飞）
  for (let i = 0; i < 30; i++) {
    const sp = 2400 * (0.6 + hash01(i, 671)), span = W + 600;
    const x = ((hash01(i, 672) * span - lt * sp) % span + span) % span - 300, y = hash01(i, 673) * H;
    line(ctx, x, y, x + 160 + hash01(i, 674) * 160, y, 3, rgba(S6_ICE, 0.16));
  }

<script>
// ===== src/scenes_c2.js =====
'use strict';
// =====================================================================
// scenes_c2.js — S6 主歌二 后段（2:42–2:58）+ 登记 SCENE_IMPL.S6
//   162–167 「我无法只是 只是做你的朋友」：歌词里两处“只是”做回声叠影（多层渐隐复制，s6EchoGhosts），
//            “我”向“你”喊出一圈圈回声弧，身后拖着渐隐的回声残影
//   167–171 「感情已那么深」：“我”脚下长出粉色树根，扎进地下剖面（分层土壤）

// =====================================================================

// ---- 162–167 回声 ----
function s6Echo(ctx, t) {

    ctx.lineWidth = 3 + 7 * f; ctx.strokeStyle = rgba(S6_COLD, 0.8 * f); ctx.stroke();

      alpha: ghost * 0.24 * (4 - j) / 3 });

// 歌词底层：在“只是”两字后面画多层渐隐复制（位置与 lyrics.js 下方歌词区的排版一致，正文随后由 lyrics.js 绘制）
function s6EchoGhosts(ctx, t) {
  const L = findLyric(t);
  if (!L || L.text !== '我无法只是 只是做你的朋友') return;
  const tl = t - LYRIC_OFFSET, P = prepText(L.text), Lo = layoutChars(ctx, P, LYR_SIZE, LYR_MAXW, 800, FONT_MIX);
  const n = P.chars.length, stagger = Math.min(0.09, 1.3 / n);   // 与 S6 的 type 入场一致
  const exitDur = Math.min(0.4, (L.end - L.start) * 0.15), ex = clamp01((tl - (L.end - exitDur)) / exitDur);
  let x = W / 2 - Lo.total / 2, from = 0;
  const marks = [];
  for (;;) { const i = L.text.indexOf('只是', from); if (i < 0) break; marks.push(i, i + 1); from = i + 2; }
  for (let i = 0; i < n; i++) {
    const w = Lo.ws[i], cx = x + w / 2; x += w;
    if (marks.indexOf(i) < 0) continue;
    const ek = prog(tl, L.start + i * stagger + 0.35, L.start + i * stagger + 0.9, easeOutCubic);
    if (ek <= 0) continue;
    const wave = 0.5 + 0.5 * Math.sin(tl * 4 - i * 0.5);

}

// ---- 167–171 粉色树根 ----
const S6J_GY = 470;
// 树根分段表（加载时用固定种子生成）：每段 {x1,y1,x2,y2,w,t0,t1}，t0/t1 归一化到 0..1 的生长时刻
const S6J_ROOTS = (function () {
  const rnd = mulberry32(667), segs = [];
  function grow(x, y, a, len, w, t0, depth) {
    const steps = 6 + Math.floor(rnd() * 4);
    for (let i = 0; i < steps; i++) {
      a = lerp(a + (rnd() - 0.5) * 0.55, PI / 2, 0.08);
      const nx = x + Math.cos(a) * len, ny = y + Math.sin(a) * len, t1 = t0 + 0.05 + rnd() * 0.02;
      segs.push({ x1: x, y1: y, x2: nx, y2: ny, w: w, t0: t0, t1: t1 });
      if (depth < 2 && rnd() < 0.22) grow(nx, ny, a + (rnd() < 0.5 ? -1 : 1) * (0.5 + rnd() * 0.6), len * 0.78, w * 0.62, t1, depth + 1);
      x = nx; y = ny; t0 = t1; w *= 0.9;
    }
  }
  for (let r = 0; r < 5; r++) grow(960 + (r - 2) * 14, S6J_GY + 2, PI / 2 + (r - 2) * 0.42, 46, 13, rnd() * 0.08, 0);
  let mx = 0;
  for (let i = 0; i < segs.length; i++) mx = Math.max(mx, segs[i].t1);
  for (let i = 0; i < segs.length; i++) { segs[i].t0 /= mx; segs[i].t1 /= mx; }

})();
const S6J_SOIL = ['#2a1f3d', '#231a35', '#1b142b', '#130e20', '#0c0916'];
function s6Roots(ctx, t) {
  const beat = beatPulse(t), z = lerp(1.08, 1, prog(t, 167, 171, easeOutCubic));
  withCamera(ctx, 960, 560, z, 0, function () {
    const g = ctx.createLinearGradient(0, 0, 0, S6J_GY);

    drawStars(ctx, t, 0.7);
    softGlow(ctx, 1500, 160, 120, S6_ICE, 0.35); circle(ctx, 1500, 160, 44, S6_ICE);
    // 分层土壤（波浪形分界）
    for (let b = 0; b < S6J_SOIL.length; b++) {
      const y0 = S6J_GY + b * 125;
      ctx.beginPath(); ctx.moveTo(-100, H + 100);
      for (let x = -100; x <= W + 100; x += 60) ctx.lineTo(x, y0 + (b ? Math.sin(x * 0.006 + b * 1.7) * 18 : 0));
      ctx.lineTo(W + 100, H + 100); ctx.closePath(); ctx.fillStyle = S6J_SOIL[b]; ctx.fill();

      ctx.beginPath(); ctx.ellipse(hash01(i, 681) * W, S6J_GY + 40 + hash01(i, 682) * 560, 10 + hash01(i, 683) * 18, 6 + hash01(i, 684) * 8, hash01(i, 685), 0, TAU);
      ctx.fillStyle = 'rgba(255,244,224,0.06)'; ctx.fill();
    }

    ctx.lineCap = 'round';

      const f = clamp01((k - s.t0) / (s.t1 - s.t0)), x2 = lerp(s.x1, s.x2, f), y2 = lerp(s.y1, s.y2, f);

function s6PullSep(t) { return lerp(110, 560, easeInOutCubic(prog(t, 171.2, 174.3))); }

function s6Arm(ctx, x1, y1, x2, y2, amp, t, seed, col) {

const S6L_FREEZE = 174.6;

function drawS6(ctx, t) {
  ctx.save();
  if (t < 137) s6Guess(ctx, t);
  else if (t < 141) s6Dots(ctx, t);
  else if (t < 143) s6Check(ctx, t);
  else if (t < 147) s6Shatter(ctx, t);

SCENE_IMPL.S6 = {
  draw: function (ctx, t) { drawS6(ctx, t); },
  // 「That's right」放在上方，避开下方的对勾与盖章

// 视觉强化（全部用真实时间 t 计算）：

const S7_OFF = 92, S7_OFF0 = 93;
const S7_CUTS = [182, 187, 192, 195, 200, 205, 207, 211];   // 段落边界（附近不做反色闪帧）

function s7Base(ctx, t) {
  const t4 = t - S7_OFF;
  if (t < 182) s4Bubble(ctx, t - S7_OFF0);
  else if (t < 185) s4BadgeScene(ctx, t4);
  else if (t < 187) s4Spot(ctx, t4);
  else if (t < 192) s4Chest(ctx, t4);
  else if (t < 195) s4NotLover(ctx, t4);
  else if (t < 200) s4Letter(ctx, t4);
  else if (t < 205) s4Boomerang(ctx, t4);
  else if (t < 207) s4SoI(ctx, t4);

}
function s7Quiet(t) { return (t >= 185 && t < 187) || (t >= 205 && t < 207); }   // 暗场聚光段，强化减弱

//   render(t) 纯函数式渲染（逻辑 1920×1080，等比缩放 + 黑边 + devicePixelRatio）
//   时钟：未加载音频用 performance.now；加载音频后播放时以 audio.currentTime 为准
//   控制：播放/暂停(空格)、←/→ ±5 秒、F 全屏、H 隐藏 UI、进度条拖动、
//         加载音频、录制视频（captureStream(60) + MediaRecorder → webm）
//   URL 参数：?t=95 跳转；&pause=1 保持暂停；&ui=0 隐藏控制浮层
//             带 t 参数时在加载时同步渲染该帧（不等 rAF），便于无头截图
// =====================================================================

// ---- 占位场景（scenes_*.js 未登记的场景使用） ----
const PLACEHOLDER_TINT = {
  S0: ['#07070f', '#141a33'], S1: ['#141a33', '#262b5a'], S2: ['#262b5a', '#07070f'],
  S3: ['#1d2350', '#3a2f6b'], S4: ['#3a1f4a', '#141a33'], S5: ['#1b2240', '#2b3460'],
  S6: ['#2a2358', '#0d0f22'], S7: ['#4a1f45', '#141a33'], S8: ['#2b1840', '#0d1030'],
  S9: ['#141a33', '#07070f']
};
function fmtTime(t) {
  const s = Math.max(0, Math.floor(t + 1e-6));
  return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
}
function drawPlaceholderScene(ctx, t, lt, sc) {
  const c = PLACEHOLDER_TINT[sc.id] || [PAL.night, PAL.indigo];
  fillSky(ctx, c[0], c[1]);
  const beat = beatPulse(t) * beatGainAt(t);
  drawBokeh(ctx, t, { count: 28, seed: 7, color: PAL.meGlow, alpha: 0.12, pulse: beat });
  ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(0, 760, W, H - 760);
  drawText(ctx, sc.id + ' · ' + sc.title + '（占位）', SAFE.x, SAFE.y + 30, 40, PAL.cream, { align: 'left', alpha: 0.75 });
  drawText(ctx, fmtTime(t) + ' / ' + fmtTime(TOTAL), SAFE.x, SAFE.y + 84, 28, PAL.cream, { align: 'left', alpha: 0.5, weight: 600, family: FONT_EN });
  const k = prog(t, sc.start, sc.end);
  fillRoundRect(ctx, SAFE.x, SAFE.y + 112, 420, 8, 4, 'rgba(255,244,224,0.15)');
  if (k > 0) fillRoundRect(ctx, SAFE.x, SAFE.y + 112, Math.max(8, 420 * k), 8, 4, PAL.me);
  const bob = Math.sin(t * 2.4) * 8;
  drawMe(ctx, 760, 700 + bob * 0.3, { t: t, r: 60, look: Math.sin(t * 0.7), squash: 1 + 0.06 * beat, groundY: 760, glow: 0.5 + 0.4 * beat });
  drawYou(ctx, 1160, 682, { t: t, r: 78, look: -0.6, groundY: 760 });
  drawHeart(ctx, 960, 640 + bob, 26 * (1 + 0.15 * beat), { fill: PAL.heart });
}

// ---- 播放器（包在 IIFE 中，避免与场景文件的全局名冲突；对外只暴露 window.MG） ----
(function () {
// ---- 元素与状态 ----
const canvas = document.getElementById('mg');
const ctx = canvas.getContext('2d', { alpha: false });
const ui = {
  root: document.getElementById('ui'), play: document.getElementById('btnPlay'),
  time: document.getElementById('timeLabel'), bar: document.getElementById('bar'),
  fill: document.getElementById('barFill'), knob: document.getElementById('barKnob'),
  btnAudio: document.getElementById('btnAudio'), file: document.getElementById('audioFile'),
  btnRec: document.getElementById('btnRec'), btnFs: document.getElementById('btnFs'),
  badge: document.getElementById('recBadge'), toast: document.getElementById('toast')
};
const P = {
  t: 0, playing: false, base: 0, dirty: true, bw: W, bh: H,
  audio: null, audioURL: null, audioReady: false, audioEnded: false, audioCtx: null, srcNode: null, recDest: null,
  recording: null, dragging: false, wasPlaying: false,
  uiOff: false, uiForcedHidden: false, uiIdleHidden: false, idleTimer: 0,
  lastLabel: '', lastPct: -1, lastBadge: ''
};
const _reported = new Set();
function reportOnce(err) {
  const msg = '[render] ' + (err && err.stack ? err.stack : String(err));
  if (_reported.has(msg)) return;
  _reported.add(msg);
  if (window.__reportError) window.__reportError(msg);
}

// ---- 渲染 ----
// t = 原曲时间；场景与歌词按分镜时间 τ 绘制（timeline.js 的 SYNC 表负责换算），
// 节拍函数内部再用 songTime(τ) 换回原曲时间，保证节拍速度恒定。
function renderFrame(c, t) {
  const tau = clamp(storyTime(t), 0, TOTAL);
  const sc = findScene(tau);
  c.save(); sc.draw(c, tau, tau - sc.start, sc); c.restore();
  c.save(); drawLyrics(c, tau, sc); c.restore();
}
function render(t) {
  const tt = clamp(t, 0, TOTAL);
  ctx.setTransform(P.bw / W, 0, 0, P.bh / H, 0, 0);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, 0, W, H); ctx.clip();
  try { renderFrame(ctx, tt); } catch (err) { reportOnce(err); }
  ctx.restore();
}
// 等比缩放 + 居中黑边；录制时 backing store 固定 1920×1080
function resize() {
  const iw = window.innerWidth || W, ih = window.innerHeight || H;
  const s = Math.min(iw / W, ih / H);
  const cw = Math.max(1, Math.round(W * s)), ch = Math.max(1, Math.round(H * s));
  canvas.style.width = cw + 'px'; canvas.style.height = ch + 'px';
  canvas.style.left = Math.round((iw - cw) / 2) + 'px'; canvas.style.top = Math.round((ih - ch) / 2) + 'px';
  const dpr = window.devicePixelRatio || 1;
  const bw = P.recording ? W : Math.round(cw * dpr), bh = P.recording ? H : Math.round(ch * dpr);
  if (canvas.width !== bw || canvas.height !== bh) { canvas.width = bw; canvas.height = bh; }
  P.bw = bw; P.bh = bh; P.dirty = true;
}

// ---- 时钟 ----
function nowS() { return performance.now() / 1000; }
function clockTime() {
  if (!P.playing) return P.t;
  if (P.audioReady && !P.audioEnded) return P.audio.currentTime;
  return nowS() - P.base;
}
function play() {
  if (P.playing) return;
  let t = P.t;
  if (t >= TOTAL - 0.001) t = 0;
  P.t = t; P.base = nowS() - t; P.playing = true; P.audioEnded = false;
  if (P.audioReady) {
    try { P.audio.currentTime = t; } catch (e) { /* 忽略 */ }
    const pr = P.audio.play();
    if (pr && pr.catch) pr.catch(function (err) { toast('音频无法播放：' + err.message); });
  }
  P.dirty = true; updatePlayBtn();
}
function pause() {
  if (!P.playing) return;
  P.t = clamp(clockTime(), 0, TOTAL);
  P.playing = false;
  if (P.audio) P.audio.pause();
  P.dirty = true; updatePlayBtn();
}
function togglePlay() { if (P.playing) pause(); else play(); }
function seek(t) {
  const tt = clamp(t, 0, TOTAL);
  P.t = tt; P.base = nowS() - tt;
  if (P.audioReady) { try { P.audio.currentTime = tt; } catch (e) { /* 忽略 */ } }
  render(tt); updateUI(tt); P.dirty = false;
}

// ---- 主循环 ----
function tick() {
  let t = clockTime();
  if (t >= TOTAL) {
    t = TOTAL;
    if (P.playing) {
      P.playing = false; P.t = TOTAL;
      if (P.audio) P.audio.pause();
      updatePlayBtn();
      P.dirty = true;
      if (P.recording) stopRecording();
    }
  }
  if (P.playing || P.dirty) {
    if (P.playing) P.t = t;
    render(P.t); updateUI(P.t); P.dirty = false;
  }
  if (P.recording) updateRecBadge(P.t);
  requestAnimationFrame(tick);
}

// ---- UI ----
function updatePlayBtn() {
  ui.play.textContent = P.playing ? '❚❚' : '▶';
  ui.play.setAttribute('aria-label', P.playing ? '暂停' : '播放');
}
function updateUI(t) {
  const label = fmtTime(t) + ' / ' + fmtTime(TOTAL);
  if (label !== P.lastLabel) {
    P.lastLabel = label; ui.time.textContent = label;
    ui.bar.setAttribute('aria-valuenow', String(Math.floor(t)));
    ui.bar.setAttribute('aria-valuetext', label);
  }
  const pct = Math.round(t / TOTAL * 10000) / 100;
  if (pct !== P.lastPct) { P.lastPct = pct; ui.fill.style.width = pct + '%'; ui.knob.style.left = pct + '%'; }
}
function applyUIVisibility() {
  ui.root.classList.toggle('off', P.uiOff);
  const hide = P.uiForcedHidden || P.uiIdleHidden || !!P.recording;
  ui.root.classList.toggle('hidden', hide);
  document.body.classList.toggle('cursor-hidden', (hide || P.uiOff) && P.playing);
}
// 有操作时显示 UI，静止 2.5 秒后自动隐藏
function poke() {
  P.uiIdleHidden = false;
  clearTimeout(P.idleTimer);
  P.idleTimer = setTimeout(function () {
    if (!P.dragging && !ui.root.contains(document.activeElement)) { P.uiIdleHidden = true; applyUIVisibility(); }
    else poke();
  }, 2500);
  applyUIVisibility();
}
function toggleUI() {
  if (P.uiOff) { P.uiOff = false; P.uiForcedHidden = false; }
  else P.uiForcedHidden = !P.uiForcedHidden;
  if (!P.uiForcedHidden) poke(); else applyUIVisibility();
}
let _toastTimer = 0;
function toast(msg) {
  ui.toast.textContent = msg; ui.toast.hidden = false;
  clearTimeout(_toastTimer);
  _toastTimer = setTimeout(function () { ui.toast.hidden = true; }, 4500);
}
function toggleFullscreen() {
  if (document.fullscreenElement) { if (document.exitFullscreen) document.exitFullscreen().catch(function () {}); }
  else if (document.documentElement.requestFullscreen) {
    document.documentElement.requestFullscreen().catch(function (err) { toast('无法进入全屏：' + err.message); });
  }
}
function barTime(clientX) {
  const r = ui.bar.getBoundingClientRect();
  return clamp((clientX - r.left) / Math.max(1, r.width), 0, 1) * TOTAL;
}

// ---- 音频 ----
function loadAudio(file) {
  const wasPlaying = P.playing;
  pause();
  const t = P.t;
  if (!P.audio) {
    // 只创建一个 audio 元素（createMediaElementSource 每个元素只能调用一次）
    P.audio = new Audio();
    P.audio.preload = 'auto';
    P.audio.addEventListener('ended', function () {
      if (!P.playing) return;
      // 录制中音频提前结束（短于 257 秒）：切回内部时钟继续走到 257 秒，由 tick() 停止录制，
      // 这样导出的视频仍包含片尾定格；普通播放保持原行为（停在音频结束处）
      if (P.recording && P.audio.currentTime < TOTAL) { P.audioEnded = true; P.base = nowS() - P.audio.currentTime; }
      else pause();
    });
  }
  if (P.audioURL) URL.revokeObjectURL(P.audioURL);
  P.audioReady = false;
  P.audioURL = URL.createObjectURL(file);
  const a = P.audio;
  const onMeta = function () {
    a.removeEventListener('loadedmetadata', onMeta); a.removeEventListener('error', onErr);
    P.audioReady = true;
    try { a.currentTime = Math.min(t, a.duration || t); } catch (e) { /* 忽略 */ }
    ui.btnAudio.textContent = '音频：' + file.name; ui.btnAudio.title = file.name;
    toast('已加载音频（' + fmtTime(a.duration || 0) + '），播放时钟已切换为音频时间');
    if (wasPlaying) play();
  };
  const onErr = function () {
    a.removeEventListener('loadedmetadata', onMeta); a.removeEventListener('error', onErr);
    toast('音频加载失败，请换一个文件（支持浏览器可播放的 mp3 / m4a / ogg / wav 等）');
  };
  a.addEventListener('loadedmetadata', onMeta);
  a.addEventListener('error', onErr);
  a.src = P.audioURL;
}

// ---- 录制 ----
function pickMime(hasAudio) {
  const list = hasAudio
    ? ['video/webm;codecs=vp9,opus', 'video/webm;codecs=vp8,opus', 'video/webm']
    : ['video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  for (let i = 0; i < list.length; i++) if (MediaRecorder.isTypeSupported(list[i])) return list[i];
  return '';
}
function startRecording() {
  if (P.recording) return;
  if (typeof MediaRecorder === 'undefined' || typeof canvas.captureStream !== 'function') {
    toast('当前浏览器不支持录制（缺少 MediaRecorder 或 canvas.captureStream），请使用最新版 Chrome / Edge。');
    return;
  }
  pause();
  P.recording = { rec: null, stream: null, title: document.title, stopping: false };
  resize(); seek(0); // backing store 切到 1920×1080，从 0 秒开始
  const stream = canvas.captureStream(60);
  let hasAudio = false;
  if (P.audioReady) {
    try {
      if (!P.audioCtx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        P.audioCtx = new AC();
        P.srcNode = P.audioCtx.createMediaElementSource(P.audio);
        P.srcNode.connect(P.audioCtx.destination);
        P.recDest = P.audioCtx.createMediaStreamDestination();
        P.srcNode.connect(P.recDest);
      }
      P.audioCtx.resume();
      P.recDest.stream.getAudioTracks().forEach(function (tr) { stream.addTrack(tr); });
      hasAudio = true;
    } catch (err) { toast('音轨合入失败，将只录制画面：' + err.message); }
  }
  const mime = pickMime(hasAudio);
  let rec;
  try {
    rec = new MediaRecorder(stream, mime ? { mimeType: mime, videoBitsPerSecond: 12000000 } : { videoBitsPerSecond: 12000000 });
  } catch (err) {
    stream.getVideoTracks().forEach(function (tr) { tr.stop(); });
    P.recording = null; resize(); applyUIVisibility();
    toast('无法启动录制：' + err.message);
    return;
  }
  const chunks = [];
  rec.ondataavailable = function (e) { if (e.data && e.data.size) chunks.push(e.data); };
  rec.onstop = function () {
    const blob = new Blob(chunks, { type: mime || 'video/webm' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = '普通朋友_陶喆_MG.webm';
    document.body.appendChild(link); link.click(); link.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 60000);
    endRecordingUI();
    toast('录制完成，已下载 webm（' + (blob.size / 1048576).toFixed(1) + ' MB）');
  };
  P.recording.rec = rec; P.recording.stream = stream;
  ui.badge.hidden = false; ui.btnRec.classList.add('recording'); ui.btnRec.textContent = '录制中…';
  applyUIVisibility();
  rec.start(500);
  play();
}
function stopRecording() {
  const R = P.recording;
  if (!R || R.stopping) return;
  R.stopping = true;
  pause();
  // 稍等片刻确保最后一帧被采集
  setTimeout(function () {
    try { if (R.rec && R.rec.state !== 'inactive') R.rec.stop(); else endRecordingUI(); } catch (e) { endRecordingUI(); }
    if (R.stream) R.stream.getVideoTracks().forEach(function (tr) { tr.stop(); });
  }, 300);
}
function endRecordingUI() {
  const R = P.recording;
  if (R) document.title = R.title;
  P.recording = null; P.lastBadge = '';
  ui.badge.hidden = true; ui.btnRec.classList.remove('recording'); ui.btnRec.textContent = '录制视频';
  resize(); poke();
}
function updateRecBadge(t) {
  const pct = Math.floor(t / TOTAL * 100);
  const s = '● REC ' + pct + '%  ' + fmtTime(t) + ' / ' + fmtTime(TOTAL) + '  · Esc 结束';
  if (s === P.lastBadge) return;
  P.lastBadge = s; ui.badge.textContent = s;
  document.title = '录制中 ' + pct + '% · ' + P.recording.title;
}

// ---- 事件绑定 ----
function bindEvents() {
  window.addEventListener('resize', function () { resize(); render(P.t); });
  window.addEventListener('pointermove', poke);
  window.addEventListener('pointerdown', poke);
  ui.play.addEventListener('click', togglePlay);
  ui.btnFs.addEventListener('click', toggleFullscreen);
  ui.btnAudio.addEventListener('click', function () { ui.file.click(); });
  ui.file.addEventListener('change', function () {
    const f = ui.file.files && ui.file.files[0];
    if (f) loadAudio(f);
    ui.file.value = '';
  });
  ui.btnRec.addEventListener('click', function () { if (P.recording) stopRecording(); else startRecording(); });
  ui.bar.addEventListener('pointerdown', function (e) {
    if (P.recording) return;
    P.dragging = true; P.wasPlaying = P.playing; pause();
    ui.bar.setPointerCapture(e.pointerId);
    seek(barTime(e.clientX)); e.preventDefault();
  });
  ui.bar.addEventListener('pointermove', function (e) { if (P.dragging) seek(barTime(e.clientX)); });
  const endDrag = function () { if (!P.dragging) return; P.dragging = false; if (P.wasPlaying) play(); poke(); };
  ui.bar.addEventListener('pointerup', endDrag);
  ui.bar.addEventListener('pointercancel', endDrag);
  window.addEventListener('keydown', function (e) {
    if (P.recording) { if (e.key === 'Escape') stopRecording(); if (e.code === 'Space') e.preventDefault(); return; }
    const tag = e.target && e.target.tagName;
    switch (e.code) {
      case 'Space': if (tag === 'BUTTON') return; e.preventDefault(); togglePlay(); break;
      case 'ArrowLeft': e.preventDefault(); seek(clockTime() - 5); break;
      case 'ArrowRight': e.preventDefault(); seek(clockTime() + 5); break;
      case 'KeyF': toggleFullscreen(); break;
      case 'KeyH': toggleUI(); return;
      default: return;
    }
    if (!P.uiForcedHidden) poke();
  });
}

// ---- 启动 ----
function parseParams() {
  const q = new URLSearchParams(location.search), o = { t: undefined };
  if (q.has('t')) { const v = parseFloat(q.get('t')); if (isFinite(v)) o.t = clamp(v, 0, TOTAL); }
  o.pause = q.get('pause') === '1';
  o.uiOff = q.get('ui') === '0';
  return o;
}
function init() {
  const prm = parseParams();
  P.uiOff = prm.uiOff;
  resize();
  P.t = prm.t !== undefined ? prm.t : 0;
  render(P.t); // 同步渲染首帧（无头截图依赖这一点）
  updateUI(P.t); P.dirty = false;
  updatePlayBtn();
  bindEvents();
  if (prm.t !== undefined && prm.pause) { P.uiIdleHidden = true; applyUIVisibility(); }
  else poke();
  if (!prm.pause) play();
  requestAnimationFrame(tick);
}
// 供调试/验证使用
window.MG = { render: render, seek: seek, play: play, pause: pause, time: function () { return P.t; } };
init();
})();
</script>
</body>
