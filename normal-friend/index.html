<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>普通朋友 · 陶喆 · MG 动画</title>
<style>
/* style.css — 页面与控制浮层样式（动画本身全部画在 canvas 上） */
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  background: #000; overflow: hidden;
  font-family: "Segoe UI", "Helvetica Neue", Arial, "Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif;
  color: #fff4e0;
}
body.cursor-hidden { cursor: none; }
#stage { position: fixed; inset: 0; }
#mg { position: absolute; display: block; background: #000; }

.ui {
  position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%);
  width: min(1100px, calc(100% - 32px)); box-sizing: border-box;
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 14px; border-radius: 14px;
  background: rgba(20, 26, 51, 0.82); border: 1px solid rgba(255, 244, 224, 0.18);
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.45);
  transition: opacity 0.35s ease, transform 0.35s ease;
  z-index: 10;
}
.ui.hidden { opacity: 0; pointer-events: none; transform: translateX(-50%) translateY(12px); }
.ui.off { display: none; }

.btn {
  appearance: none; border: 1px solid rgba(255, 244, 224, 0.3); border-radius: 9px;
  background: #262b5a; color: #fff4e0; font: inherit; font-size: 14px;
  padding: 7px 12px; cursor: pointer; white-space: nowrap; max-width: 220px;
  overflow: hidden; text-overflow: ellipsis;
}
.btn:hover { background: #343a78; }
.btn:focus-visible, .bar:focus-visible { outline: 2px solid #ffb36b; outline-offset: 2px; }
.btn-icon { width: 40px; padding: 7px 0; font-size: 16px; }
.btn.recording { background: #b3263f; }

.time { font-variant-numeric: tabular-nums; font-size: 14px; min-width: 104px; }
.bar {
  position: relative; flex: 1 1 260px; height: 10px; border-radius: 5px;
  background: rgba(255, 244, 224, 0.2); cursor: pointer; touch-action: none;
}
.bar-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; border-radius: 5px; background: #ff7a59; }
.bar-knob {
  position: absolute; top: 50%; left: 0; width: 16px; height: 16px; margin: -8px 0 0 -8px;
  border-radius: 50%; background: #fff4e0; box-shadow: 0 0 0 3px rgba(255, 122, 89, 0.6);
}
.hint { font-size: 12px; opacity: 0.7; white-space: nowrap; }

.rec-badge {
  position: fixed; top: 10px; right: 12px; z-index: 11;
  font-size: 12px; padding: 4px 8px; border-radius: 6px;
  background: rgba(0, 0, 0, 0.55); color: #ff8fa6; pointer-events: none;
}
.toast {
  position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 12;
  max-width: min(640px, calc(100% - 40px)); padding: 10px 16px; border-radius: 10px;
  background: rgba(20, 26, 51, 0.92); border: 1px solid rgba(255, 244, 224, 0.25);
  font-size: 14px; line-height: 1.5;
}
@media (prefers-reduced-motion: reduce) { .ui { transition: none; } }
</style>
<script>
// 错误捕获：最先执行，任何后续脚本的错误都写入隐藏的 pre#__errors，供无头验证读取
(function () {
  function report(msg) {
    var el = document.getElementById('__errors');
    if (el) el.textContent += msg + '\n';
    else (window.__pendingErrors = window.__pendingErrors || []).push(msg);
  }
  window.__reportError = report;
  window.onerror = function (msg, src, line, col, err) {
    report('[error] ' + msg + ' @' + (line || 0) + ':' + (col || 0) + (err && err.stack ? '\n' + err.stack : ''));
  };
  window.addEventListener('unhandledrejection', function (ev) {
    var r = ev.reason;
    report('[unhandledrejection] ' + (r && r.stack ? r.stack : String(r)));
  });
})();
</script>
</head>
<body>
<pre id="__errors" hidden></pre>
<script>
if (window.__pendingErrors) document.getElementById('__errors').textContent += window.__pendingErrors.join('\n') + '\n';
</script>
<div id="stage">
  <canvas id="mg" role="img" aria-label="歌词 MG 动画：《普通朋友》，演唱：陶喆"></canvas>
</div>
<div id="recBadge" class="rec-badge" hidden aria-live="polite"></div>
<div id="ui" class="ui" role="toolbar" aria-label="播放控制">
  <button id="btnPlay" class="btn btn-icon" type="button" aria-label="播放">▶</button>
  <span id="timeLabel" class="time" aria-live="off">00:00 / 04:17</span>
  <div id="bar" class="bar" role="slider" tabindex="0" aria-label="播放进度"
       aria-valuemin="0" aria-valuemax="257" aria-valuenow="0" aria-valuetext="00:00 / 04:17">
    <div id="barFill" class="bar-fill"></div>
    <div id="barKnob" class="bar-knob"></div>
  </div>
  <button id="btnAudio" class="btn" type="button">加载音频</button>
  <input id="audioFile" type="file" accept="audio/*" hidden>
  <button id="btnRec" class="btn" type="button">录制视频</button>
  <button id="btnFs" class="btn" type="button" aria-label="全屏">全屏</button>
  <span class="hint">空格 播放/暂停 · ←/→ 5 秒 · F 全屏 · H 隐藏</span>
</div>
<div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
<script>
// ===== src/core.js =====
'use strict';
// =====================================================================
// core.js — 通用工具：常量/调色板、缓动、插值、区间进度、种子随机、
//           颜色、基础绘图、文字测量缓存、节拍脉冲、背景散景粒子、转场。
// 所有函数都是纯函数（只依赖参数和 t），不在帧间累积状态。
// =====================================================================

// ---- 逻辑画布与安全区（四周 5% 边距） ----
const W = 1920, H = 1080;
const SAFE = { x: W * 0.05, y: H * 0.05, w: W * 0.9, h: H * 0.9, r: W * 0.95, b: H * 0.95 };
const PI = Math.PI, TAU = Math.PI * 2;

// ---- 字体 ----
const FONT_CN = '"Microsoft YaHei", "PingFang SC", "Noto Sans SC", sans-serif';
const FONT_EN = '"Segoe UI", "Helvetica Neue", Arial';
// 英文字形用 Segoe UI，中文字形自动回退到雅黑等中文字体
const FONT_MIX = FONT_EN + ', ' + FONT_CN;

// ---- 调色板 ----
const PAL = {
  night: '#141a33',   // 夜空深蓝
  indigo: '#262b5a',  // 靛蓝
  me: '#ff7a59',      // “我” 珊瑚橙
  meGlow: '#ffb36b',  // “我” 光晕
  you: '#3ec1c9',     // “你” 青绿
  heart: '#ff5c8a',   // 爱心粉
  cream: '#fff4e0',   // 文字奶油白
  abyss: '#07070f',   // 深渊
  heaven: '#ffe9c7',  // 天堂暖白
  skyBlue: '#bfe3ff', // 天蓝
  dusk: '#b8577a',    // 玫瑰色黄昏
  grey: '#9aa3c7',    // 降饱和灰蓝
  violet: '#3a2f6b'   // 主歌二紫蓝夜色
};

// ---- 基础数学 ----
function clamp(x, a, b) { return x < a ? a : (x > b ? b : x); }
function clamp01(x) { return x < 0 ? 0 : (x > 1 ? 1 : x); }
function lerp(a, b, k) { return a + (b - a) * k; }
function invLerp(a, b, x) { return b === a ? 0 : (x - a) / (b - a); }
function remap(x, a, b, c, d) { return lerp(c, d, clamp01(invLerp(a, b, x))); }
function smoothstep(a, b, x) { const k = clamp01((x - a) / (b - a)); return k * k * (3 - 2 * k); }
function fract(x) { return x - Math.floor(x); }
function pingpong(x) { const f = fract(x * 0.5) * 2; return f > 1 ? 2 - f : f; }

// ---- 缓动函数（输入输出 0..1） ----
function easeLinear(x) { return x; }
function easeInQuad(x) { return x * x; }
function easeOutQuad(x) { return 1 - (1 - x) * (1 - x); }
function easeInOutQuad(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function easeInCubic(x) { return x * x * x; }
function easeOutCubic(x) { return 1 - Math.pow(1 - x, 3); }
function easeInOutCubic(x) { return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
function easeInOutSine(x) { return -(Math.cos(PI * x) - 1) / 2; }
function easeOutSine(x) { return Math.sin(x * PI / 2); }
function easeInExpo(x) { return x === 0 ? 0 : Math.pow(2, 10 * x - 10); }
function easeOutExpo(x) { return x === 1 ? 1 : 1 - Math.pow(2, -10 * x); }
function easeOutBack(x, s) {
  const c1 = s === undefined ? 1.70158 : s, c3 = c1 + 1;
  return 1 + c3 * Math.pow(x - 1, 3) + c1 * Math.pow(x - 1, 2);
}
function easeInBack(x, s) {
  const c1 = s === undefined ? 1.70158 : s, c3 = c1 + 1;
  return c3 * x * x * x - c1 * x * x;
}
function easeOutElastic(x) {
  if (x <= 0) return 0;
  if (x >= 1) return 1;
  return Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (TAU / 3)) + 1;
}
function easeOutBounce(x) {
  const n1 = 7.5625, d1 = 2.75;
  if (x < 1 / d1) return n1 * x * x;
  if (x < 2 / d1) { x -= 1.5 / d1; return n1 * x * x + 0.75; }
  if (x < 2.5 / d1) { x -= 2.25 / d1; return n1 * x * x + 0.9375; }
  x -= 2.625 / d1; return n1 * x * x + 0.984375;
}
const Ease = {
  linear: easeLinear, inQuad: easeInQuad, outQuad: easeOutQuad, inOutQuad: easeInOutQuad,
  inCubic: easeInCubic, outCubic: easeOutCubic, inOutCubic: easeInOutCubic,
  inOutSine: easeInOutSine, outSine: easeOutSine, inExpo: easeInExpo, outExpo: easeOutExpo,
  outBack: easeOutBack, inBack: easeInBack, outElastic: easeOutElastic, outBounce: easeOutBounce
};

// 区间进度：t 在 [a,b] 内映射到 0..1（可选缓动）
function prog(t, a, b, ease) {
  const k = clamp01((t - a) / (b - a));
  return ease ? ease(k) : k;
}
// 包络：在 [a,b] 内显示，入场 fi 秒淡入，出场 fo 秒淡出，返回 0..1
function env(t, a, b, fi, fo) {
  if (t < a || t > b) return 0;
  const i = fi > 0 ? clamp01((t - a) / fi) : 1;
  const o = fo > 0 ? clamp01((b - t) / fo) : 1;
  return Math.min(i, o);
}

// ---- 种子随机 ----
// mulberry32：有状态 PRNG，只在加载时用于生成固定随机表
function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let r = Math.imul(a ^ (a >>> 15), 1 | a);
    r = (r + Math.imul(r ^ (r >>> 7), 61 | r)) ^ r;
    return ((r ^ (r >>> 14)) >>> 0) / 4294967296;
  };
}
// 无状态哈希随机：同样的 (n, seed) 永远得到同样的 0..1 值，可在每帧调用
function hash01(n, seed) {
  let h = Math.imul((n | 0) ^ 0x9e3779b9, 0x85ebca6b) ^ Math.imul(((seed | 0) + 0x632be5ab) | 0, 0xc2b2ae35);
  h ^= h >>> 16; h = Math.imul(h, 0x7feb352d);
  h ^= h >>> 15; h = Math.imul(h, 0x846ca68b);
  h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function hashRange(n, seed, a, b) { return a + (b - a) * hash01(n, seed); }
// 生成固定随机表（加载时一次性调用）
function makeRandTable(seed, n) {
  const r = mulberry32(seed), out = new Float32Array(n);
  for (let i = 0; i < n; i++) out[i] = r();
  return out;
}

// ---- 颜色 ----
const _rgbCache = new Map();
function hexToRgb(hex) {
  let c = _rgbCache.get(hex);
  if (c) return c;
  let h = hex.charAt(0) === '#' ? hex.slice(1) : hex;
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  const v = parseInt(h, 16);
  c = [(v >> 16) & 255, (v >> 8) & 255, v & 255];
  _rgbCache.set(hex, c);
  return c;
}
const _rgbaCache = new Map();
function rgba(hex, a) {
  const q = Math.round(clamp01(a) * 255);
  const key = hex + '|' + q;
  let s = _rgbaCache.get(key);
  if (s) return s;
  const c = hexToRgb(hex);
  s = 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (q / 255).toFixed(3) + ')';
  if (_rgbaCache.size > 4000) _rgbaCache.clear();
  _rgbaCache.set(key, s);
  return s;
}
function mixColor(h1, h2, k) {
  const a = hexToRgb(h1), b = hexToRgb(h2), m = clamp01(k);
  const r = Math.round(lerp(a[0], b[0], m)), g = Math.round(lerp(a[1], b[1], m)), bl = Math.round(lerp(a[2], b[2], m));
  return '#' + ((1 << 24) | (r << 16) | (g << 8) | bl).toString(16).slice(1);
}
// 降饱和：k=1 时完全灰度
function desat(hex, k) {
  const c = hexToRgb(hex), l = Math.round(c[0] * 0.3 + c[1] * 0.59 + c[2] * 0.11);
  const g = '#' + ((1 << 24) | (l << 16) | (l << 8) | l).toString(16).slice(1);
  return mixColor(hex, g, k);
}

// ---- 基础绘图 ----
function circle(ctx, x, y, r, fill) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.fillStyle = fill; ctx.fill();
}
function ring(ctx, x, y, r, lw, stroke) {
  ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.stroke();
}
function roundRectPath(ctx, x, y, w, h, r) {
  const rr = Math.max(0, Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2));
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function fillRoundRect(ctx, x, y, w, h, r, fill) { roundRectPath(ctx, x, y, w, h, r); ctx.fillStyle = fill; ctx.fill(); }
function regularPolyPath(ctx, x, y, r, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n; i++) {
    const a = rot + i * TAU / n;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function starPath(ctx, x, y, ro, ri, n, rot) {
  ctx.beginPath();
  for (let i = 0; i < n * 2; i++) {
    const a = rot + i * PI / n, r = (i & 1) ? ri : ro;
    if (i === 0) ctx.moveTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
    else ctx.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r);
  }
  ctx.closePath();
}
function line(ctx, x1, y1, x2, y2, lw, stroke) {
  ctx.beginPath(); ctx.moveTo(x1, y1); ctx.lineTo(x2, y2);
  ctx.lineWidth = lw; ctx.strokeStyle = stroke; ctx.lineCap = 'round'; ctx.stroke();
}
// 柔光（径向渐变，代替 shadowBlur）
function softGlow(ctx, x, y, r, hex, a) {
  if (a <= 0 || r <= 0) return;
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, rgba(hex, a));
  g.addColorStop(0.45, rgba(hex, a * 0.35));
  g.addColorStop(1, rgba(hex, 0));
  ctx.fillStyle = g;
  ctx.fillRect(x - r, y - r, r * 2, r * 2);
}
// 地面柔和投影（扁椭圆）
function groundShadow(ctx, x, y, rx, ry, a) {
  ctx.save();
  ctx.translate(x, y); ctx.scale(1, ry / rx);
  const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
  g.addColorStop(0, 'rgba(0,0,0,' + (0.45 * a).toFixed(3) + ')');
  g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(0, 0, rx, 0, TAU); ctx.fill();
  ctx.restore();
}
// 竖向渐变全屏背景
function fillSky(ctx, top, bottom) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, top); g.addColorStop(1, bottom);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}

// ---- 文字：字体串缓存 + 测量缓存 ----
const _fontCache = new Map();
function fontStr(size, weight, family) {
  const key = size + '|' + (weight || 700) + '|' + (family || FONT_MIX);
  let f = _fontCache.get(key);
  if (!f) { f = (weight || 700) + ' ' + Math.round(size) + 'px ' + (family || FONT_MIX); _fontCache.set(key, f); }
  return f;
}
const _measureCache = new Map();
function measureW(ctx, text, font) {
  const key = font + '\u0001' + text;
  let w = _measureCache.get(key);
  if (w === undefined) {
    ctx.save(); ctx.font = font; w = ctx.measureText(text).width; ctx.restore();
    if (_measureCache.size > 6000) _measureCache.clear();
    _measureCache.set(key, w);
  }
  return w;
}
// 简单文字绘制（居中），带偏移投影以增强可读性（不用 shadowBlur）
function drawText(ctx, text, x, y, size, color, o) {
  const opt = o || {};
  ctx.font = fontStr(size, opt.weight, opt.family);
  ctx.textAlign = opt.align || 'center';
  ctx.textBaseline = opt.baseline || 'middle';
  ctx.globalAlpha = opt.alpha === undefined ? 1 : opt.alpha;
  if (opt.shadow !== false) {
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillText(text, x + size * 0.05, y + size * 0.06);
  }
  ctx.fillStyle = color;
  ctx.fillText(text, x, y);
  ctx.globalAlpha = 1;
}

// ---- 节拍 ----
// BPM / BEAT_OFFSET / songTime / storyTime 定义在 timeline.js（运行时读取）。
// 场景传入的 t 是分镜时间；节拍按原曲真实时间计算，所以先用 songTime 换算，
// 这样分镜被拉伸/压缩时节拍速度仍恒定为 BPM。
function beatSpb() { return 60 / (typeof BPM === 'number' ? BPM : 90); }
function beatOff() { return typeof BEAT_OFFSET === 'number' ? BEAT_OFFSET : 0; }
function beatPos(t) {
  const s = typeof songTime === 'function' ? songTime(t) : t;
  return (s - beatOff()) / beatSpb();
}
// 第 b 拍（可带原曲秒偏移 dt）对应的分镜时间
function beatTime(b, dt) {
  const s = b * beatSpb() + beatOff() + (dt || 0);
  return typeof storyTime === 'function' ? storyTime(s) : s;
}
function beatIndex(t) { return Math.floor(beatPos(t)); }
function beatPhase(t) { return fract(beatPos(t)); }
// 每拍开头为 1，按指数衰减到 0
function beatPulse(t, sharp) { return Math.exp(-beatPhase(t) * (sharp || 6)); }

// ---- 背景散景粒子（无状态：位置由 t 和索引哈希决定） ----
// o: { count, seed, color, alpha, speed, minR, maxR, drift }
function drawBokeh(ctx, t, o) {
  const n = o.count || 30, seed = o.seed || 1, sp = o.speed === undefined ? 1 : o.speed;
  const minR = o.minR || 6, maxR = o.maxR || 40, baseA = o.alpha === undefined ? 0.18 : o.alpha;
  const pulse = o.pulse || 0;
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i = 0; i < n; i++) {
    const r = lerp(minR, maxR, hash01(i, seed + 3));
    const vx = (hash01(i, seed + 5) - 0.5) * 30 * sp;
    const vy = -(8 + hash01(i, seed + 7) * 24) * sp;
    const span = W + maxR * 4, spanY = H + maxR * 4;
    let x = hash01(i, seed) * span + vx * t;
    let y = hash01(i, seed + 1) * spanY + vy * t;
    x = ((x % span) + span) % span - maxR * 2;
    y = ((y % spanY) + spanY) % spanY - maxR * 2;
    const tw = 0.6 + 0.4 * Math.sin(t * (0.6 + hash01(i, seed + 9)) + i);
    const a = baseA * tw * (1 + pulse * 0.6);
    ctx.globalAlpha = clamp01(a);
    circle(ctx, x, y, r * (1 + pulse * 0.15), o.color || PAL.cream);
  }
  ctx.restore();
}

// ---- 转场 / 镜头 ----
// 圆形遮罩：只在圆内执行 fn
function withCircleClip(ctx, x, y, r, fn) {
  ctx.save(); ctx.beginPath(); ctx.arc(x, y, Math.max(0, r), 0, TAU); ctx.clip(); fn(); ctx.restore();
}
// 斜向擦除：k 从 0→1，用色块从左到右斜着盖满画面
function diagWipe(ctx, k, color, slant) {
  if (k <= 0) return;
  const s = slant === undefined ? 300 : slant, x = lerp(-s, W + s, k);
  ctx.beginPath();
  ctx.moveTo(-10, -10); ctx.lineTo(x + s, -10); ctx.lineTo(x - s, H + 10); ctx.lineTo(-10, H + 10);
  ctx.closePath(); ctx.fillStyle = color; ctx.fill();
}

  const n = xs.length - 1;

  while (hi - lo > 1) { const mid = (lo + hi) >> 1; if (xs[mid] <= x) lo = mid; else hi = mid; }

//                 小手、爱心、对话气泡、打字点、云朵、问号。

// 眨眼量：0 = 睁眼，1 = 完全闭眼。由 t 与种子决定，周期 3.2–4.7 秒。
function blinkAmt(t, seed) {
  const s = seed || 1;
  const period = 3.2 + hash01(s, 7) * 1.5;
  const ph = ((t + hash01(s, 3) * period) % period + period) % period;
  return ph < 0.16 ? Math.sin(ph / 0.16 * PI) : 0;
}

// 眼睛：o = { look: -1..1（左右看）, lookY: -1..1, blink: 0..1, mood: 'normal'|'sad'|'happy', eyeColor }
function drawEyes(ctx, x, y, r, o) {
  const look = o.look || 0, lookY = o.lookY || 0, blink = clamp01(o.blink || 0);
  const mood = o.mood || 'normal', col = o.eyeColor || '#1b1d33';
  const ex = r * 0.34, ey = -r * 0.12, er = r * 0.15;
  const dx = look * r * 0.2, dy = lookY * r * 0.14;
  for (let s = -1; s <= 1; s += 2) {
    const cx = x + s * ex + dx, cy = y + ey + dy;
    ctx.fillStyle = col; ctx.strokeStyle = col; // 每只眼重设（高光会改 fillStyle）
    if (mood === 'happy') {
      ctx.beginPath(); ctx.lineWidth = er * 0.7; ctx.lineCap = 'round';
      ctx.arc(cx, cy + er * 0.4, er, PI * 1.1, PI * 1.9); ctx.stroke();
      continue;
    }
    const h = er * (1 - blink * 0.92);
    ctx.beginPath(); ctx.ellipse(cx, cy, er, Math.max(0.6, h), 0, 0, TAU); ctx.fill();
    if (mood === 'sad') {
      // 下垂眉：内端高、外端低（八字眉）
      ctx.beginPath(); ctx.lineWidth = er * 0.45; ctx.lineCap = 'round';

  }
}

  switch (shape) {
    case 'roundSquare': roundRectPath(ctx, x - r * 0.9, y - r * 0.9, r * 1.8, r * 1.8, r * 0.35); break;
    case 'triangle': regularPolyPath(ctx, x, y + r * 0.15, r * 1.15, 3, -PI / 2); break;
    case 'star': starPath(ctx, x, y + r * 0.05, r * 1.15, r * 0.55, 5, -PI / 2); break;
    default: ctx.beginPath(); ctx.arc(x, y, r, 0, TAU);
  }
}

// 通用角色。o = {
//   r, color, glowColor, glow(0..1), squash(1=无形变；>1 压扁变宽), rot,
//   look, lookY, blink, mood, shape, hands:[{a, len}], shadow(bool), groundY, alpha }
function drawCharacter(ctx, x, y, o) {
  const r = o.r || 60, sq = o.squash || 1, col = o.color || PAL.me;
  const a = o.alpha === undefined ? 1 : o.alpha;
  if (a <= 0) return;
  ctx.save();
  ctx.globalAlpha = a;
  if (o.shadow !== false) {
    const gy = o.groundY === undefined ? y + r : o.groundY;
    const hgt = Math.max(0, gy - (y + r));
    groundShadow(ctx, x, gy + 4, r * 1.1 * sq / (1 + hgt / 300), r * 0.22, a / (1 + hgt / 200));
  }
  if (o.glow > 0) softGlow(ctx, x, y, r * 2.6, o.glowColor || PAL.meGlow, 0.55 * o.glow);
  ctx.translate(x, y + r); // 以脚底为挤压锚点
  ctx.rotate(o.rot || 0);
  ctx.scale(sq, 1 / sq);
  ctx.translate(0, -r);
  if (o.hands) {
    for (let i = 0; i < o.hands.length; i++) drawHand(ctx, 0, 0, r, o.hands[i].a, o.hands[i].len, col);
  }
  bodyPath(ctx, 0, 0, r, o.shape);
  ctx.fillStyle = col; ctx.fill();
  // 扁平高光（左上月牙）与暗部
  ctx.save(); ctx.clip();
  circle(ctx, -r * 0.35, -r * 0.4, r * 0.55, 'rgba(255,255,255,0.16)');
  circle(ctx, r * 0.45, r * 0.6, r * 0.8, 'rgba(0,0,0,0.12)');
  ctx.restore();
  drawEyes(ctx, 0, 0, r, o);
  ctx.restore();
}

// “我”：珊瑚橙小圆角色，默认带柔光
function drawMe(ctx, x, y, o) {
  const opt = o || {};
  const glow = opt.glow === undefined ? 0.6 : opt.glow;
  drawCharacter(ctx, x, y, {
    r: opt.r || 60, color: opt.color || PAL.me, glowColor: PAL.meGlow, glow: glow,
    squash: opt.squash, rot: opt.rot, look: opt.look, lookY: opt.lookY,
    blink: opt.blink === undefined ? blinkAmt(opt.t || 0, 11) : opt.blink,
    mood: opt.mood, shape: opt.shape, hands: opt.hands, shadow: opt.shadow,
    groundY: opt.groundY, alpha: opt.alpha
  });
}

// “你”：稍大的青绿圆角色
function drawYou(ctx, x, y, o) {
  const opt = o || {};
  drawCharacter(ctx, x, y, {
    r: opt.r || 78, color: opt.color || PAL.you, glowColor: PAL.you, glow: opt.glow || 0,
    squash: opt.squash, rot: opt.rot, look: opt.look, lookY: opt.lookY,
    blink: opt.blink === undefined ? blinkAmt(opt.t || 0, 23) : opt.blink,
    mood: opt.mood, shape: opt.shape, hands: opt.hands, shadow: opt.shadow,
    groundY: opt.groundY, alpha: opt.alpha
  });
}

// 爱心路径：中心 (x, y)，s 为半宽
function heartPath(ctx, x, y, s) {
  ctx.beginPath();
  ctx.moveTo(x, y + s * 0.9);
  ctx.bezierCurveTo(x - s * 1.25, y + s * 0.05, x - s * 0.95, y - s * 0.95, x, y - s * 0.4);
  ctx.bezierCurveTo(x + s * 0.95, y - s * 0.95, x + s * 1.25, y + s * 0.05, x, y + s * 0.9);
  ctx.closePath();
}
// o = { fill, stroke, lw, rot, alpha }
function drawHeart(ctx, x, y, s, o) {
  const opt = o || {};
  if (s <= 0) return;
  ctx.save();
  ctx.globalAlpha = opt.alpha === undefined ? 1 : opt.alpha;
  ctx.translate(x, y); ctx.rotate(opt.rot || 0);
  heartPath(ctx, 0, 0, s);
  if (opt.fill !== null) { ctx.fillStyle = opt.fill || PAL.heart; ctx.fill(); }
  if (opt.stroke) { ctx.lineWidth = opt.lw || 4; ctx.strokeStyle = opt.stroke; ctx.lineJoin = 'round'; ctx.stroke(); }
  ctx.restore();
}

// 对话气泡：左上 (x, y)，宽高 w/h，尾巴尖端 (tx, ty)。o = { fill, stroke, lw, r, alpha }
function drawBubble(ctx, x, y, w, h, tx, ty, o) {
  const opt = o || {};
  const r = opt.r === undefined ? Math.min(w, h) * 0.3 : opt.r;
  ctx.save();
  ctx.globalAlpha = opt.alpha === undefined ? 1 : opt.alpha;
  const cx = x + w / 2, cy = y + h / 2;
  const bw = Math.min(w * 0.18, 60);
  const bx = clamp(tx, x + r + bw / 2, x + w - r - bw / 2);
  const by = ty > cy ? y + h - 1 : y + 1;
  roundRectPath(ctx, x, y, w, h, r);
  ctx.moveTo(bx - bw / 2, by); ctx.lineTo(tx, ty); ctx.lineTo(bx + bw / 2, by);
  ctx.fillStyle = opt.fill || PAL.cream; ctx.fill();
  if (opt.stroke) { ctx.lineWidth = opt.lw || 4; ctx.strokeStyle = opt.stroke; ctx.stroke(); }
  ctx.restore();
  return { cx: cx, cy: cy };
}

// 打字 / 加载中三点：t 驱动依次跳动
function drawDots(ctx, x, y, t, o) {
  const opt = o || {};
  const gap = opt.gap || 26, r = opt.r || 8, col = opt.color || '#262b5a';
  for (let i = 0; i < 3; i++) {
    const ph = fract(t * (opt.speed || 1.6) - i * 0.18);
    const j = ph < 0.4 ? Math.sin(ph / 0.4 * PI) : 0;
    ctx.globalAlpha = (opt.alpha === undefined ? 1 : opt.alpha) * (0.45 + 0.55 * j);
    circle(ctx, x + (i - 1) * gap, y - j * r * 1.3, r, col);
  }
  ctx.globalAlpha = 1;
}

// 扁平云朵：中心 (x, y)，s 为尺度
function drawCloud(ctx, x, y, s, color, alpha) {
  ctx.save();
  ctx.globalAlpha = alpha === undefined ? 1 : alpha;
  ctx.fillStyle = color || '#ffffff';
  ctx.beginPath();
  ctx.arc(x - s * 0.55, y + s * 0.1, s * 0.42, 0, TAU);
  ctx.arc(x, y - s * 0.12, s * 0.58, 0, TAU);
  ctx.arc(x + s * 0.58, y + s * 0.12, s * 0.38, 0, TAU);
  ctx.fill();
  fillRoundRect(ctx, x - s * 0.95, y + s * 0.05, s * 1.9, s * 0.45, s * 0.22, color || '#ffffff');
  ctx.restore();
}

// 问号符号（几何文字）
function drawQuestion(ctx, x, y, size, color, alpha, rot) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot || 0);
  drawText(ctx, '?', 0, 0, size, color || PAL.cream, { alpha: alpha === undefined ? 1 : alpha, family: FONT_EN, weight: 800 });
  ctx.restore();
}

// 几何路灯：底座 (x, groundY)，高度 h，亮度 light 0..1
function drawLamp(ctx, x, groundY, h, light) {
  const topY = groundY - h;
  if (light > 0) {
    // 光锥
    ctx.save();
    ctx.globalAlpha = 0.18 * light;
    ctx.beginPath();
    ctx.moveTo(x + 70, topY + 20); ctx.lineTo(x + 70 - 260, groundY); ctx.lineTo(x + 70 + 260, groundY);
    ctx.closePath(); ctx.fillStyle = PAL.meGlow; ctx.fill();
    ctx.restore();
    softGlow(ctx, x + 70, topY + 18, 140, PAL.meGlow, 0.7 * light);
  }
  fillRoundRect(ctx, x - 7, topY, 14, h, 6, '#2e3466');
  fillRoundRect(ctx, x - 7, topY - 4, 82, 12, 6, '#2e3466');
  fillRoundRect(ctx, x + 44, topY + 4, 52, 18, 8, '#3a4280');
  circle(ctx, x + 70, topY + 24, 12, light > 0 ? mixColor('#555a7a', PAL.heaven, light) : '#555a7a');
  fillRoundRect(ctx, x - 24, groundY - 14, 48, 14, 5, '#2e3466');
}
</script>
<script>
// ===== src/lyrics.js =====
'use strict';
// =====================================================================
// lyrics.js — 歌词渲染：
//   1) 下三分之一歌词区：逐字错峰入场（pop 弹出 / rise 上滑 / type 打字机，
//      按场景变化）→ 停留 → 退场；括号英文作为下方小一号副行。
//   2) hero 句：画面中央大号 kinetic typography（下方不重复显示）。
//   3) 关键词高亮：颜色 + 放大 + 随节拍抖动。
// 同一时刻只取一条歌词（findLyric），且每句退场在 end 前完成，因此不会重叠。
// =====================================================================

// 关键词 → 高亮色（长词在前，先匹配的优先）
const LYRIC_KEYWORDS = [
  ['不是情人', PAL.heart], ['收不回来', PAL.meGlow], ['等待', PAL.meGlow], ['依赖', PAL.heart],
  ['失败', PAL.grey], ['深渊', '#8a8fff'], ['无奈', PAL.grey], ['改变', PAL.you],
  ['放手', PAL.heart], ['坦白', PAL.meGlow], ['friend', PAL.you], ['朋友', PAL.you],
  ['不能', PAL.me], ['耶', PAL.me], ['爱', PAL.heart]
];

// 各场景下方歌词的入场方式
const LYRIC_ANIM = { S1: 'rise', S2: 'type', S3: 'pop', S4: 'pop', S6: 'type', S7: 'pop', S8: 'rise' };

// 中央大字的动效风格（按歌词原文索引）
const HERO_STYLE = {
  '等待': 'breath',
  '这是爱': 'pulse',
  '从天堂掉落到深渊': 'fall',
  'I only want to be your friend': 'stamp',
  '不是情人': 'stamp',
  'So I': 'pulse',
  '我不能只是be 你的朋友': 'shake',
  '我不能只是做你的朋友': 'drop',
  "That's right": 'stamp',
  '我不能只是做 你的 friend': 'shake'
};

// 节拍强度：副歌与结尾更强
const BEAT_GAIN = { S4: 1, S7: 1.2, S8: 1.2 };
function beatGainAt(t) { const g = BEAT_GAIN[findScene(t).id]; return g === undefined ? 0.5 : g; }

// 歌词区布局常量（逻辑像素）
const LYR_Y = 905, LYR_SUB_Y = 980, LYR_SIZE = 66, LYR_SUB_SIZE = 36, LYR_MAXW = W * 0.86;
const HERO_X = W / 2, HERO_Y = 430, HERO_SIZE = 150, HERO_MAXW = W * 0.84;

function isCJK(ch) { const c = ch.charCodeAt(0); return c >= 0x2e80; }
function isLatin(ch) { return /[A-Za-z']/.test(ch); }

// ---- 每句的预处理缓存（字符、高亮、分词），只计算一次 ----
const _prepCache = new Map();
function computeHighlights(text, n) {
  const hl = new Array(n).fill(null);
  for (let k = 0; k < LYRIC_KEYWORDS.length; k++) {
    const kw = LYRIC_KEYWORDS[k][0], col = LYRIC_KEYWORDS[k][1];
    let from = 0;
    for (;;) {
      const i = text.indexOf(kw, from);
      if (i < 0) break;
      let free = true;
      for (let j = 0; j < kw.length; j++) if (hl[i + j]) free = false;
      if (free) for (let j = 0; j < kw.length; j++) hl[i + j] = col;
      from = i + kw.length;
    }
  }
  return hl;
}
// 分词单元：连续英文字母为一个单元（含其后空格），每个中文字符为一个单元
function computeUnits(chars) {
  const u = new Array(chars.length);
  let cur = -1, prevLatin = false;
  for (let i = 0; i < chars.length; i++) {
    const ch = chars[i];
    if (ch === ' ') { u[i] = Math.max(cur, 0); prevLatin = false; continue; }
    const lat = isLatin(ch);
    if (!(lat && prevLatin)) cur++;
    u[i] = cur; prevLatin = lat;
  }
  return { map: u, count: cur + 1 };
}
function prepText(text) {
  let P = _prepCache.get(text);
  if (P) return P;
  // 文字均为 BMP 字符，Array.from 下标与字符串下标一致
  const chars = Array.from(text);
  P = { chars: chars, hl: computeHighlights(text, chars.length), units: computeUnits(chars), layouts: new Map() };
  _prepCache.set(text, P);
  return P;
}
// 按字号计算每个字符的宽度（缓存）；超宽时自动缩小字号
function layoutChars(ctx, P, size, maxW, weight, family) {
  const key = size + '|' + maxW + '|' + weight;
  let Lo = P.layouts.get(key);
  if (Lo) return Lo;
  let s = size;
  for (let pass = 0; pass < 2; pass++) {
    const f = fontStr(s, weight, family), ws = new Array(P.chars.length);
    let total = 0;
    for (let i = 0; i < P.chars.length; i++) {
      const ch = P.chars[i];
      ws[i] = measureW(ctx, ch, f) * (P.hl[i] ? 1.1 : 1) + (isCJK(ch) ? s * 0.06 : 0);
      // 汉字后紧跟 j（如“是just”）：j 的弯钩向左出头会压到前一个汉字 → 给前一个汉字加宽
      if (i > 0 && ch === 'j' && isCJK(P.chars[i - 1])) { ws[i - 1] += s * 0.2; total += s * 0.2; }
      total += ws[i];
    }
    Lo = { size: s, ws: ws, total: total, font: f };
    if (total <= maxW) break;
    s = s * maxW / total;
  }
  P.layouts.set(key, Lo);
  return Lo;
}

// 画单个字符（带偏移投影；高亮可选描边）
function drawGlyph(ctx, ch, x, y, sc, rot, alpha, color, font, size, outline) {
  if (alpha <= 0.002 || sc <= 0.001) return;
  ctx.save();
  ctx.translate(x, y); if (rot) ctx.rotate(rot); ctx.scale(sc, sc);
  ctx.globalAlpha = clamp01(alpha);
  ctx.font = font; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillStyle = 'rgba(7,7,15,0.45)';
  ctx.fillText(ch, size * 0.05, size * 0.07);
  if (outline) {
    ctx.lineWidth = Math.max(2, size * 0.06); ctx.strokeStyle = PAL.cream; ctx.lineJoin = 'round';
    ctx.strokeText(ch, 0, 0);
  }
  ctx.fillStyle = color;
  ctx.fillText(ch, 0, 0);
  ctx.restore();
}

// ---- 下方歌词区：一行逐字动画 ----
function drawCharsRow(ctx, t, tl, P, Lo, y, t0, t1, style, gain) {
  const n = P.chars.length;
  const stagger = style === 'type' ? Math.min(0.09, 1.3 / n) : Math.min(0.055, 0.6 / n);
  const dur = 0.45;
  const exitDur = Math.min(0.4, (t1 - t0) * 0.15), exitStart = t1 - exitDur;
  const beat = beatPulse(t) * gain;
  let x = W / 2 - Lo.total / 2, lastX = -1;
  for (let i = 0; i < n; i++) {
    const w = Lo.ws[i], cx = x + w / 2; x += w;
    const ch = P.chars[i];
    if (ch === ' ') continue;
    const k = clamp01((tl - t0 - i * stagger) / dur);
    if (k <= 0) continue;
    lastX = cx + w / 2;
    let a = 1, sc = 1, dy = 0, dx = 0;
    if (style === 'pop') { sc = easeOutBack(k, 2.2); a = clamp01(k * 4); }
    else if (style === 'type') { a = clamp01(k * 6); sc = 1 + 0.35 * (1 - easeOutCubic(clamp01(k * 2.5))); }
    else { dy = (1 - easeOutCubic(k)) * 46; a = easeOutQuad(k); }
    const e = clamp01((tl - exitStart - i * (exitDur * 0.4 / n)) / (exitDur * 0.6));
    a *= 1 - e; dy -= e * 24;
    const hc = P.hl[i];
    if (hc) {
      sc *= 1.1 + 0.07 * beat;
      dx = Math.sin(t * 31 + i * 1.7) * 2.2 * (0.3 + beat);
      dy += Math.cos(t * 27 + i * 2.3) * 1.8 * (0.3 + beat);
    }
    drawGlyph(ctx, ch, cx + dx, y + dy, sc, 0, a, hc || PAL.cream, Lo.font, Lo.size, false);
  }
  // 打字机光标
  if (style === 'type' && lastX > 0 && tl - t0 < n * stagger + 0.6 && fract(tl * 2.5) < 0.6) {
    ctx.fillStyle = PAL.cream;
    ctx.fillRect(lastX + 6, y - Lo.size * 0.42, Math.max(3, Lo.size * 0.06), Lo.size * 0.84);
  }
}

function drawBottomLyric(ctx, t, tl, L, sc) {
  const style = LYRIC_ANIM[sc.id] || 'rise', gain = beatGainAt(t);
  const P = prepText(L.text);
  const Lo = layoutChars(ctx, P, LYR_SIZE, LYR_MAXW, 800, FONT_MIX);
  // 底部柔和压暗带，保证可读性
  const exitDur = Math.min(0.4, (L.end - L.start) * 0.15);
  const band = env(tl, L.start, L.end, 0.3, exitDur);
  if (band > 0) {
    const g = ctx.createLinearGradient(0, 780, 0, H);
    g.addColorStop(0, 'rgba(7,7,15,0)');
    g.addColorStop(1, rgba(PAL.abyss, 0.5 * band));
    ctx.fillStyle = g; ctx.fillRect(0, 780, W, H - 780);
  }
  drawCharsRow(ctx, t, tl, P, Lo, LYR_Y, L.start, L.end, style, gain);
  if (L.sub) {
    const PS = prepText(L.sub);
    const LoS = layoutChars(ctx, PS, LYR_SUB_SIZE, LYR_MAXW, 600, FONT_EN);
    drawCharsRow(ctx, t, tl, PS, LoS, LYR_SUB_Y, L.start + 0.35, L.end, 'rise', gain * 0.5);
  }
}

// ---- 中央大字 kinetic typography ----
// lay = { x, y, size, maxW } 可由场景 heroLayout 覆盖
function drawHeroLine(ctx, t, tl, L, lay) {
  const style = HERO_STYLE[L.text] || 'drop';
  const P = prepText(L.text);
  const size = Math.round((lay && lay.size) || HERO_SIZE);
  const maxW = (lay && lay.maxW) || HERO_MAXW;
  const cxL = (lay && lay.x !== undefined) ? lay.x : HERO_X;
  const cyL = (lay && lay.y !== undefined) ? lay.y : HERO_Y;
  const Lo = layoutChars(ctx, P, size, maxW, 900, FONT_MIX);
  const n = P.chars.length, s = Lo.size, gain = beatGainAt(t), beat = beatPulse(t) * gain;
  const lt = tl - L.start, dur = L.end - L.start;
  const exitDur = Math.min(0.35, dur * 0.18), e = clamp01((tl - (L.end - exitDur)) / exitDur);
  // 呼吸字距（breath），保证不超出 maxW
  let track = 0;
  if (style === 'breath') {
    const room = Math.max(0, (maxW - Lo.total) / Math.max(1, n - 1));
    track = Math.min(room, s * (0.15 + 0.35 * (0.5 + 0.5 * Math.sin(lt * 2.2))));
  }
  const totalW = Lo.total + track * (n - 1);
  // 盖章冲击：每个单元落下时整行抖动
  const U = P.units, ustag = Math.min(0.32, dur * 0.45 / Math.max(1, U.count));
  let shake = 0;
  if (style === 'stamp') {
    for (let u = 0; u < U.count; u++) {
      const since = lt - (u * ustag + 0.22);
      if (since > 0) shake += Math.exp(-since * 14) * s * 0.06;
    }
  }
  const shx = Math.sin(t * 73) * shake, shy = Math.cos(t * 61) * shake;
  const cstag = Math.min(0.08, dur * 0.35 / n);
  let x = cxL - totalW / 2;
  for (let i = 0; i < n; i++) {
    const w = Lo.ws[i], cx = x + w / 2; x += w + track;
    const ch = P.chars[i];
    if (ch === ' ') continue;
    const hc = P.hl[i];
    let a = 1, sc = 1, dx = 0, dy = 0, rot = 0;
    if (style === 'stamp') {
      const k = clamp01((lt - U.map[i] * ustag) / 0.22);
      if (k <= 0) continue;
      sc = lerp(2.4, 1, easeOutCubic(k)); a = clamp01(k * 2);
    } else {
      const k = clamp01((lt - i * cstag) / 0.55);
      if (k <= 0) continue;
      if (style === 'drop') { dy = -(1 - easeOutBounce(k)) * 320; a = clamp01(k * 3); rot = (1 - k) * (hash01(i, 5) - 0.5) * 0.8; }
      else if (style === 'pulse') { sc = easeOutBack(k, 2.4) * (1 + 0.1 * beat); a = clamp01(k * 3); }
      else if (style === 'shake') {
        sc = easeOutElastic(k); a = clamp01(k * 3);
        dx = Math.sin(t * 40 + i * 2.1) * s * 0.025 * (0.4 + beat);
        dy = Math.cos(t * 47 + i * 1.3) * s * 0.025 * (0.4 + beat);
      } else if (style === 'fall') {
        dy = -(1 - easeOutCubic(k)) * 200 + lt * 14; a = clamp01(k * 2);
      } else { dy = (1 - easeOutCubic(k)) * 60; a = easeOutQuad(k); } // breath
    }
    if (hc) { sc *= 1.08 + 0.06 * beat; }
    sc *= 1 + 0.15 * e; a *= 1 - e;
    // 下坠速度线
    if (style === 'fall' && a > 0.05) {
      for (let j = 0; j < 3; j++) {
        const ph = fract(lt * 1.8 + hash01(i * 3 + j, 9));
        const lx = cx + (hash01(i * 3 + j, 4) - 0.5) * w;
        const ly = cyL + dy - s * 0.6 - ph * s * 1.4;
        ctx.globalAlpha = 0.5 * a * (1 - ph);
        line(ctx, lx, ly, lx, ly - s * 0.5, 3, PAL.cream);
      }
      ctx.globalAlpha = 1;
    }
    drawGlyph(ctx, ch, cx + dx + shx, cyL + dy + shy, sc, rot, a, hc || PAL.cream, Lo.font, s, !!hc && style === 'stamp');
  }
}

// ---- 入口：由 player.js 在场景之后调用 ----
function drawLyrics(ctx, t, sc) {
  const impl = SCENE_IMPL[sc.id];
  if (impl && impl.ownsLyrics) return;
  const L = findLyric(t);
  if (!L) return;
  const tl = t - LYRIC_OFFSET;
  ctx.save();
  if (L.hero) {
    if (!(impl && impl.ownsHero)) drawHeroLine(ctx, t, tl, L, impl && impl.heroLayout ? impl.heroLayout(t, L) : null);
  } else {
    drawBottomLyric(ctx, t, tl, L, sc);
  }
  ctx.restore();
}

<script>
// ===== src/scenes_a.js =====
'use strict';
// =====================================================================
// scenes_a.js — S0–S3 共用布景（夜晚街道、星空、几何楼群、地面、路灯、
//               时钟、参数化大爱心、降饱和）+ S0 片头（0:00–0:14）。
// 所有画面只由 t 决定：随机量全部来自 hash01（无状态种子哈希）。
// 后续场景文件可复用：GROUND_Y、LAMP_X、ME_X/ME_Y、YOU_X/YOU_Y、drawStreet、
//   drawStars、drawClockFace、heartShapePath、drawHeartHalves、desatScreen。
// =====================================================================

// ---- 共用布局 ----
const GROUND_Y = 800;                             // 地面线
const LAMP_X = 640, LAMP_H = 430;                 // 路灯底座 x、高度
const ME_X = LAMP_X + 70, ME_Y = GROUND_Y - 60;   // “我”站在路灯光下（r=60）
const YOU_X = 1250, YOU_Y = GROUND_Y - 78;        // “你”（r=78）
const STAR_N = 90, STAR_SEED = 41;

// ---- 星星（S0 片名粒子最终落到这些位置） ----
function starX(i) { return hash01(i, STAR_SEED) * W; }
function starY(i) { return 50 + hash01(i, STAR_SEED + 1) * 470; }
function starRadius(i) { return 1.2 + hash01(i, STAR_SEED + 2) * 2.4; }
function starTwinkle(t, i) { return 0.55 + 0.45 * Math.sin(t * (1.2 + hash01(i, STAR_SEED + 3) * 2.5) + i * 1.7); }
function drawStars(ctx, t, a) {
  if (a <= 0.01) return;
  for (let i = 0; i < STAR_N; i++) {
    ctx.globalAlpha = clamp01(a * starTwinkle(t, i));
    circle(ctx, starX(i), starY(i), starRadius(i), PAL.cream);
  }
  ctx.globalAlpha = 1;
}

// ---- 几何楼群（常量表，加载时生成一次） ----
const SKYLINE = (function () {
  const out = [];
  let x = -30, i = 0;
  while (x < W + 30) {
    const w = 110 + hash01(i, 61) * 150, h = 150 + hash01(i, 62) * 290;
    out.push({ x: x, w: w, h: h, i: i });
    x += w + 10 + hash01(i, 63) * 40; i++;
  }
  return out;
})();
// rise 0..1：楼群从地面错峰升起；col：楼体颜色；win：窗灯亮度
function drawSkyline(ctx, t, rise, col, win) {
  for (let b = 0; b < SKYLINE.length; b++) {
    const B = SKYLINE[b];
    const k = clamp01(rise * 1.6 - hash01(B.i, 64) * 0.6);
    if (k <= 0) continue;
    const hh = B.h * easeOutBack(k, 1.4), top = GROUND_Y - hh;
    ctx.fillStyle = col;
    ctx.fillRect(B.x, top, B.w, hh + 2);
    if (hash01(B.i, 65) < 0.5) ctx.fillRect(B.x + B.w * 0.3, top - 18, B.w * 0.25, 18);
    if (win <= 0) continue;
    const cols = Math.floor((B.w - 20) / 30), rows = Math.floor((B.h - 30) / 40);
    for (let r = 0; r < rows; r++) {
      const wy = top + 22 + r * 40;
      if (wy > GROUND_Y - 30) break;
      for (let c = 0; c < cols; c++) {
        const id = B.i * 400 + r * 20 + c;
        if (hash01(id, 66) > 0.32) continue;
        const fl = 0.75 + 0.25 * Math.sin(t * (0.5 + hash01(id, 67)) + id);
        ctx.fillStyle = rgba(PAL.meGlow, win * 0.5 * fl);
        ctx.fillRect(B.x + 14 + c * 30, wy, 12, 18);
      }
    }
  }
}
function drawGround(ctx, col, rim) {
  ctx.fillStyle = col; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = rim; ctx.fillRect(0, GROUND_Y, W, 5);
  ctx.fillStyle = 'rgba(255,244,224,0.06)';
  for (let x = 40; x < W; x += 160) ctx.fillRect(x, GROUND_Y + 60, 80, 6);
}
// 路灯：grow 0..1 从地面弹性长出；light 0..1 亮度
function drawStreetLamp(ctx, grow, light) {
  if (grow <= 0) return;
  ctx.save();
  ctx.translate(LAMP_X, GROUND_Y); ctx.scale(1, easeOutBack(clamp01(grow), 1.6)); ctx.translate(-LAMP_X, -GROUND_Y);
  drawLamp(ctx, LAMP_X, GROUND_Y, LAMP_H, light);
  ctx.restore();
}
// 夜晚街道。o = { top, bot, starA, rise, bld, gnd, rim, win, lampGrow, light, back(), mid() }
//   back() 在星星之后、楼群之前绘制（太阳/月亮）；mid() 在地面之后、路灯之前绘制（时钟）
function drawStreet(ctx, t, o) {
  fillSky(ctx, o.top || PAL.night, o.bot || PAL.indigo);
  drawStars(ctx, t, o.starA === undefined ? 1 : o.starA);
  if (o.back) o.back();
  drawSkyline(ctx, t, o.rise === undefined ? 1 : o.rise, o.bld || '#1c2246', o.win === undefined ? 1 : o.win);
  drawGround(ctx, o.gnd || '#0f1329', o.rim || '#2a3060');
  if (o.mid) o.mid();
  drawStreetLamp(ctx, o.lampGrow === undefined ? 1 : o.lampGrow, o.light === undefined ? 1 : o.light);
}
// ---- 圆形时钟：minuteAng 为分针角度（弧度，0 = 12 点）；blur 为飞转残影（正 = 顺时针） ----
function drawClockFace(ctx, x, y, r, minuteAng, a, col, blur) {
  if (a <= 0 || r <= 0) return;
  const k = r / 230;
  ctx.save();
  ctx.globalAlpha = clamp01(a);
  circle(ctx, x, y, r, rgba(PAL.indigo, 0.6));
  ring(ctx, x, y, r, 10 * k, rgba(col, 0.6));
  for (let i = 0; i < 12; i++) {
    const an = i / 12 * TAU, big = i % 3 === 0, r1 = r * (big ? 0.76 : 0.84), r2 = r * 0.92;
    line(ctx, x + Math.cos(an) * r1, y + Math.sin(an) * r1, x + Math.cos(an) * r2, y + Math.sin(an) * r2,
      (big ? 8 : 4) * k, rgba(col, 0.6));
  }
  const ma = minuteAng - PI / 2, ha = minuteAng / 12 - PI / 2;
  if (blur) {
    const b = clamp(blur, -1, 1);
    ctx.beginPath(); ctx.moveTo(x, y);
    if (b > 0) ctx.arc(x, y, r * 0.8, ma - 1.2 * b, ma); else ctx.arc(x, y, r * 0.8, ma, ma - 1.2 * b);
    ctx.closePath(); ctx.fillStyle = rgba(PAL.me, 0.28 * Math.abs(b)); ctx.fill();
  }
  line(ctx, x, y, x + Math.cos(ha) * r * 0.5, y + Math.sin(ha) * r * 0.5, 12 * k, col);
  line(ctx, x, y, x + Math.cos(ma) * r * 0.78, y + Math.sin(ma) * r * 0.78, 7 * k, PAL.me);
  circle(ctx, x, y, 12 * k, col);
  ctx.restore();
}

// ---- 参数化大爱心（经典心形曲线，96 点；y 向下为正，顶部凹口 y=-5，底尖 y=17） ----
const HEART_N = 96;
const HEART_PTS = (function () {
  const a = new Float32Array(HEART_N * 2);
  for (let i = 0; i < HEART_N; i++) {
    const th = PI + i / HEART_N * TAU, s = Math.sin(th);
    a[i * 2] = 16 * s * s * s;
    a[i * 2 + 1] = -(13 * Math.cos(th) - 5 * Math.cos(2 * th) - 2 * Math.cos(3 * th) - Math.cos(4 * th));
  }
  return a;
})();
const HEART_CX = 985, HEART_CY = 470, HEART_S = 10.5;   // S1 末尾大爱心的位置与尺度
function heartShapePath(ctx, cx, cy, s) {
  ctx.beginPath();
  for (let i = 0; i < HEART_N; i++) {
    const x = cx + HEART_PTS[i * 2] * s, y = cy + HEART_PTS[i * 2 + 1] * s;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.closePath();
}
// 锯齿裂纹（单位爱心坐标，x,y 交替）：从凹口上方穿到底尖下方
const HEART_CRACK = [0, -9, 0, -5, 2.4, -1.5, -1.9, 1.8, 2.7, 4.8, -2.1, 7.8, 1.7, 10.8, -1.1, 13.8, 0, 17, 0, 21];
function crackPolyline(ctx, s, k) {
  const n = HEART_CRACK.length / 2, upto = k * (n - 1);
  ctx.beginPath(); ctx.moveTo(HEART_CRACK[0] * s, HEART_CRACK[1] * s);
  for (let i = 1; i < n; i++) {
    if (i <= upto) { ctx.lineTo(HEART_CRACK[i * 2] * s, HEART_CRACK[i * 2 + 1] * s); continue; }
    const f = upto - (i - 1);
    if (f > 0) {
      ctx.lineTo(lerp(HEART_CRACK[i * 2 - 2], HEART_CRACK[i * 2], f) * s, lerp(HEART_CRACK[i * 2 - 1], HEART_CRACK[i * 2 + 1], f) * s);
    }
    break;
  }
}
// 爱心（可裂开）。o = { sep: 两半分开距离, crack: 裂纹绘制进度 0..1, fill, scale }
function drawHeartHalves(ctx, cx, cy, s, o) {
  const sep = o.sep || 0, crack = o.crack || 0, fill = o.fill || PAL.heart;
  const ink = 'rgba(20,16,40,0.85)';
  if (sep <= 0.01) {
    ctx.save(); ctx.translate(cx, cy);
    heartShapePath(ctx, 0, 0, s); ctx.fillStyle = fill; ctx.fill();
    circle(ctx, -7 * s, -6 * s, 2.6 * s, 'rgba(255,255,255,0.22)');
    if (crack > 0) {
      ctx.save(); heartShapePath(ctx, 0, 0, s); ctx.clip();   // 裂纹只画在心形内
      crackPolyline(ctx, s, crack); ctx.lineWidth = 7; ctx.strokeStyle = ink; ctx.lineJoin = 'miter'; ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
    return;
  }
  for (let side = -1; side <= 1; side += 2) {
    ctx.save();
    ctx.translate(cx + side * sep, cy + sep * 0.25);
    ctx.translate(0, 17 * s); ctx.rotate(side * sep / 700); ctx.translate(0, -17 * s);
    // 以裂纹为界裁出半边
    ctx.beginPath(); ctx.moveTo(HEART_CRACK[0] * s, HEART_CRACK[1] * s);
    for (let i = 1; i < HEART_CRACK.length / 2; i++) ctx.lineTo(HEART_CRACK[i * 2] * s, HEART_CRACK[i * 2 + 1] * s);
    ctx.lineTo(side * 30 * s, 21 * s); ctx.lineTo(side * 30 * s, -9 * s); ctx.closePath();
    ctx.clip();
    heartShapePath(ctx, 0, 0, s); ctx.fillStyle = fill; ctx.fill();
    if (side < 0) circle(ctx, -7 * s, -6 * s, 2.6 * s, 'rgba(255,255,255,0.22)');
    heartShapePath(ctx, 0, 0, s); ctx.clip();
    crackPolyline(ctx, s, 1); ctx.lineWidth = 8; ctx.strokeStyle = ink; ctx.stroke();
    ctx.restore();
  }
}
// 全屏降饱和（只影响已画内容；歌词在场景之后绘制，不受影响）
function desatScreen(ctx, k) {
  if (k <= 0) return;
  ctx.save();
  ctx.globalCompositeOperation = 'saturation'; ctx.globalAlpha = clamp01(k);
  ctx.fillStyle = '#808080'; ctx.fillRect(0, 0, W, H);
  ctx.restore();
}
// 四角闪光
function drawSparkle(ctx, x, y, s, col, a) {
  if (a <= 0 || s <= 0) return;
  ctx.globalAlpha = clamp01(a);
  starPath(ctx, x, y, s, s * 0.32, 4, -PI / 2); ctx.fillStyle = col; ctx.fill();
  ctx.globalAlpha = 1;
}
// 节拍同心波纹：每拍从 (x, y) 发出一圈，最近 5 拍可见；t0 之前的拍不发
function drawBeatRipples(ctx, t, x, y, t0, a, col) {
  if (a <= 0) return;
  const b0 = beatIndex(t);
  for (let k = 0; k < 5; k++) {
    const tb = beatTime(b0 - k);
    if (tb < t0) break;
    const age = t - tb, f = 1 - age / 3.2;
    if (f <= 0) continue;
    ring(ctx, x, y, 34 + easeOutCubic(clamp01(age / 3.2)) * 900, 2 + 5 * f, rgba(col, a * 0.75 * f));
  }
}

// =====================================================================
// S0 片头 0:00–0:14：黑屏 → 珊瑚点弹出 + 节拍波纹 → 片名/副标题错峰落下 →
//   10.0 秒片名碎成粒子 → 粒子飞成星星 → 镜头揭示夜晚街道与路灯，点落地变成“我”
// =====================================================================
const S0_TITLE = '普通朋友';           // 歌名
const S0_SUB = '陶喆';                  // 演唱者
const S0_SUB_HI = S0_SUB.indexOf('陶喆');   // 从这里开始高亮
const S0_TY = 500, S0_SY = 685, S0_TSIZE = 180, S0_SSIZE = 64;
const S0_SHATTER = 10.0, S0_STAR_DONE = 12.3;
let _s0Lay = null;   // 文字测量缓存（只与字体有关，与 t 无关）
function s0Row(ctx, text, size, weight, family, track, y) {
  const chars = Array.from(text), font = fontStr(size, weight, family), ws = [], xs = [];
  let total = 0;
  for (let i = 0; i < chars.length; i++) { ws.push(measureW(ctx, chars[i], font)); total += ws[i]; }
  total += track * (chars.length - 1);
  let x = W / 2 - total / 2;
  for (let i = 0; i < chars.length; i++) { xs.push(x + ws[i] / 2); x += ws[i] + track; }
  return { chars: chars, ws: ws, xs: xs, y: y, font: font, size: size, w: total };
}
function s0Layout(ctx) {
  if (!_s0Lay) {
    _s0Lay = {
      title: s0Row(ctx, S0_TITLE, S0_TSIZE, 900, FONT_CN, 26, S0_TY),
      sub: s0Row(ctx, S0_SUB, S0_SSIZE, 700, FONT_CN, 22, S0_SY)
    };
  }
  return _s0Lay;
}
// “普通”奶油白，“朋友”青绿（与全片 friend / 朋友 的高亮色一致）
function s0TitleColor(i) { return i >= 2 ? PAL.you : PAL.cream; }
// 珊瑚点的位置：中央弹出 → 上移到片名上方 → 11.6–13.0 弧线落到路灯下
function s0DotPos(t) {
  let x = 960, y = lerp(540, 330, prog(t, 1.8, 2.6, easeInOutCubic)), r = 26;
  const k = prog(t, 11.6, 13.0);
  if (k > 0) {
    const e = easeInOutCubic(k);
    x = lerp(960, ME_X, e);
    y = lerp(330, ME_Y, easeInQuad(k)) - Math.sin(k * PI) * 140;
    r = lerp(26, 60, e);
  }
  return { x: x, y: y, r: r, k: k };
}
// 片名 + 副标题：逐字错峰落下（弹跳），碎裂前颤抖
function s0Title(ctx, t, lay) {
  if (t < 2.3 || t >= S0_SHATTER + 0.08) return;
  const fade = 1 - prog(t, S0_SHATTER, S0_SHATTER + 0.08);
  const shake = prog(t, 9.2, S0_SHATTER, easeInQuad) * 8, beat = beatPulse(t) * 0.5;
  const T = lay.title;
  for (let i = 0; i < T.chars.length; i++) {
    const t0 = 2.3 + i * 0.16, k = prog(t, t0, t0 + 0.75);
    if (k <= 0) continue;
    const dy = -(1 - easeOutBounce(k)) * 300, rot = (1 - k) * (hash01(i, 81) - 0.5) * 0.9;
    const sx = Math.sin(t * 61 + i * 2.1) * shake, sy = Math.cos(t * 53 + i * 1.3) * shake;
    drawGlyph(ctx, T.chars[i], T.xs[i] + sx, S0_TY + dy + sy, 1 + 0.035 * beat, rot, clamp01(k * 3) * fade,
      s0TitleColor(i), T.font, S0_TSIZE, false);
  }
  const u = prog(t, 3.3, 4.1, easeOutCubic);
  if (u > 0) {
    const hw = T.w * 0.36;
    ctx.globalAlpha = fade; fillRoundRect(ctx, 960 - hw * u, S0_TY + 120, 2 * hw * u, 8, 4, PAL.me); ctx.globalAlpha = 1;
  }
  const S = lay.sub;
  for (let j = 0; j < S.chars.length; j++) {
    if (S.chars[j] === ' ') continue;
    const t0 = 3.6 + j * 0.1, k = prog(t, t0, t0 + 0.6);
    if (k <= 0) continue;
    const dy = -(1 - easeOutBounce(k)) * 140;
    const sx = Math.sin(t * 57 + j) * shake * 0.6;
    drawGlyph(ctx, S.chars[j], S.xs[j] + sx, S0_SY + dy, 1, 0, clamp01(k * 3) * fade,
      j >= S0_SUB_HI ? PAL.meGlow : PAL.cream, S.font, S0_SSIZE, false);
  }
}
// 环绕片名的几何小件：错峰弹出、自转，碎裂时向外炸开
function s0Decor(ctx, t) {
  const cols = [PAL.me, PAL.you, PAL.heart, PAL.meGlow];
  const ex = prog(t, S0_SHATTER, S0_SHATTER + 0.7, easeOutCubic);
  if (ex >= 1) return;
  for (let i = 0; i < 8; i++) {
    const t0 = 4.2 + i * 0.16, k = prog(t, t0, t0 + 0.6);
    if (k <= 0) continue;
    const ang = i / 8 * TAU + 0.3, f = 0.85 + 0.15 * hash01(i, 91);
    const x = 960 + Math.cos(ang) * (720 * f + ex * 500);
    const y = 520 + Math.sin(ang) * (300 * f + ex * 500) + Math.sin(t * 1.3 + i) * 10;
    const sc = easeOutBack(k, 2.5) * (1 + 0.12 * beatPulse(t)), col = cols[i % 4];
    ctx.save();
    ctx.translate(x, y); ctx.rotate(t * 0.6 * (i % 2 ? 1 : -1) + i); ctx.scale(sc, sc);
    ctx.globalAlpha = 0.85 * (1 - ex);
    if (i % 3 === 0) { regularPolyPath(ctx, 0, 0, 22, 3, 0); ctx.fillStyle = col; ctx.fill(); }
    else if (i % 3 === 1) ring(ctx, 0, 0, 18, 6, col);
    else { ctx.fillStyle = col; ctx.fillRect(-15, -15, 30, 30); }
    ctx.restore();
  }
}
// 碎裂粒子：从片名字形处炸开（指数阻尼），10.5–12.3 秒缓动到星星位置，之后由 drawStars 接管
function s0Particles(ctx, t, lay) {
  const dt = t - S0_SHATTER;
  if (dt < 0) return;
  const m = prog(t, 10.5, S0_STAR_DONE, easeInOutCubic);
  const fly = (1 - Math.exp(-3.2 * dt)) / 3.2;
  for (let i = 0; i < STAR_N; i++) {
    let ox, oy, col;
    if (i < 60) {
      const c = i % lay.title.chars.length;
      ox = lay.title.xs[c] + (hash01(i, 71) - 0.5) * lay.title.ws[c];
      oy = S0_TY + (hash01(i, 72) - 0.5) * S0_TSIZE * 0.8; col = s0TitleColor(c);
    } else {
      const c = Math.floor(hash01(i, 73) * lay.sub.chars.length);
      ox = lay.sub.xs[c]; oy = S0_SY + (hash01(i, 74) - 0.5) * 30; col = PAL.cream;
    }
    const ang = hash01(i, 75) * TAU, sp = 260 + hash01(i, 76) * 640;
    const bx = ox + Math.cos(ang) * sp * fly, by = oy + Math.sin(ang) * sp * fly - 60 * dt;
    ctx.globalAlpha = clamp01(lerp(1, starTwinkle(t, i), m));
    circle(ctx, lerp(bx, starX(i), m), lerp(by, starY(i), m), lerp(5 - hash01(i, 77) * 2, starRadius(i), m),
      m > 0.6 ? PAL.cream : col);
  }
  ctx.globalAlpha = 1;
}
function s0Flash(ctx, t) {
  const k = prog(t, S0_SHATTER, S0_SHATTER + 0.6);
  if (k <= 0 || k >= 1) return;
  ring(ctx, 960, 560, 40 + easeOutCubic(k) * 1100, 30 * (1 - k), rgba(PAL.cream, 0.8 * (1 - k)));
  veil(ctx, PAL.cream, 0.35 * (1 - prog(t, S0_SHATTER, S0_SHATTER + 0.2)));
}
function s0LampLight(t) {
  if (t < 12.6) return 0;
  if (t < 13.1) return hash01(Math.floor(t * 14), 95) < 0.5 ? 0.15 : 0.9;   // 通电闪烁
  return 1;
}
// 镜头揭示街道：从 1.5 倍推近的上空缓缓拉回全景，楼群错峰升起，路灯长出并闪亮
function s0Street(ctx, t) {
  const e = prog(t, 10.9, 12.9, easeInOutCubic);
  withCamera(ctx, lerp(ME_X, 960, e), lerp(430, 540, e), lerp(1.5, 1, e), 0, function () {
    drawSkyline(ctx, t, prog(t, 11.0, 12.6), '#1c2246', prog(t, 12.3, 13.0));
    ctx.globalAlpha = prog(t, 10.9, 11.5);
    drawGround(ctx, '#0f1329', '#2a3060');
    ctx.globalAlpha = 1;
    drawStreetLamp(ctx, prog(t, 11.9, 12.6), s0LampLight(t));
  });
}
// 珊瑚点 → “我”
function s0Dot(ctx, t, d) {
  if (t < 0.6) return;
  const beat = beatPulse(t);
  if (t < 11.6) {
    const pop = easeOutElastic(prog(t, 0.6, 1.5));
    const r = d.r * pop * (1 + 0.12 * beat * (t < S0_SHATTER ? 1 : 0.3));
    softGlow(ctx, d.x, d.y, r * 4, PAL.meGlow, 0.5 + 0.3 * beat);
    circle(ctx, d.x, d.y, r, PAL.me);
    circle(ctx, d.x - r * 0.3, d.y - r * 0.35, r * 0.35, 'rgba(255,255,255,0.25)');
    return;
  }
  const land = t - 13.0;
  if (land < 0) {
    drawMe(ctx, d.x, d.y, { t: t, r: d.r, blink: 1 - prog(t, 11.7, 12.1), shadow: false, glow: 0.7,

    groundY: GROUND_Y, glow: 0.6 + 0.3 * beat });
}
function drawS0(ctx, t) {

  if (t >= S0_STAR_DONE) drawStars(ctx, t, 1); else s0Particles(ctx, t, lay);

  drawBeatRipples(ctx, t, d.x, d.y, 0.8, env(t, 0.8, S0_SHATTER + 0.4, 0.2, 0.4), PAL.me);

SCENE_IMPL.S0 = { draw: function (ctx, t) { drawS0(ctx, t); } };

<script>
// ===== src/scenes_a1.js =====
'use strict';
// =====================================================================
// scenes_a1.js — S1 等待 0:14–0:37
//   14–18 大字「等待」：路灯下的“我”，背后淡入大圆形时钟
//   18–23 昼夜交替（太阳/月亮划过）、落叶→下雨→下雪，头顶“加载中”三点，时钟飞转
//   23–28 “你”从右侧滑入，“我”向“你”倾斜，两人之间粉色细线正弦摆动
//   28–33 问号浮起，依次破裂变成小爱心/闪光
//   33–37 大字「这是爱」：细线卷成大爱心并填满粉色，随节拍心跳，背景转玫瑰色黄昏
// =====================================================================
const S1_DAY0 = 18, S1_DAY1 = 23;

// 昼夜信息：f = 日相 0..1（前半白天/后半夜晚），day = 白天程度，e = 昼夜段包络
function s1DayInfo(t) {
  const e = env(t, S1_DAY0, S1_DAY1, 0.5, 0.5);
  const f = fract(prog(t, S1_DAY0, S1_DAY1) * 2 - 1e-6);
  return { f: f, e: e, day: clamp01(Math.sin(f * TAU) * 1.8) * e };
}
function s1SunMoon(ctx, t, info) {
  if (info.e <= 0 || t < S1_DAY0) return;
  const up = info.f < 0.5, u = up ? info.f / 0.5 : (info.f - 0.5) / 0.5;
  const x = lerp(-120, W + 120, u), y = 700 - Math.sin(u * PI) * 560;
  ctx.save();
  ctx.globalAlpha = info.e;
  if (up) {
    softGlow(ctx, x, y, 240, '#ffd36b', 0.6);
    for (let i = 0; i < 10; i++) {
      const a = i / 10 * TAU + t * 1.5;
      line(ctx, x + Math.cos(a) * 82, y + Math.sin(a) * 82, x + Math.cos(a) * 112, y + Math.sin(a) * 112, 8, '#ffd36b');
    }
    circle(ctx, x, y, 64, '#ffd36b');
  } else {
    softGlow(ctx, x, y, 170, PAL.cream, 0.35);
    circle(ctx, x, y, 52, PAL.cream);
    circle(ctx, x - 14, y - 12, 10, 'rgba(38,43,90,0.18)');
    circle(ctx, x + 16, y + 14, 7, 'rgba(38,43,90,0.18)');
  }
  ctx.restore();
}
// 四季：落叶 → 下雨 → 下雪（位置全部由 t 与索引哈希决定）
function s1Seasons(ctx, t) {
  const leafA = env(t, 18.0, 19.9, 0.3, 0.4), rainA = env(t, 19.6, 21.5, 0.3, 0.4), snowA = env(t, 21.2, 23.3, 0.3, 0.5);
  const leafCols = ['#ff9a4a', '#e8673c', '#ffc35a'];
  if (leafA > 0) {
    for (let i = 0; i < 26; i++) {
      const sp = 120 + hash01(i, 102) * 90;
      const y = fract(hash01(i, 101) + t * sp / 1200) * 1200 - 80;
      const x = hash01(i, 103) * W + Math.sin(t * 2 + i) * 60;
      ctx.save(); ctx.translate(x, y); ctx.rotate(t * 2.4 + i); ctx.globalAlpha = leafA;
      ctx.beginPath(); ctx.ellipse(0, 0, 16, 7, 0, 0, TAU); ctx.fillStyle = leafCols[i % 3]; ctx.fill();
      ctx.restore();
    }
  }
  if (rainA > 0) {
    for (let i = 0; i < 70; i++) {
      const y = fract(hash01(i, 111) + t * 1.6) * 1250 - 100;
      const x = hash01(i, 112) * (W + 200) - 100 - y * 0.15;
      line(ctx, x, y, x - 8, y + 34, 2.5, rgba(PAL.skyBlue, 0.55 * rainA));
    }
  }
  if (snowA > 0) {
    for (let i = 0; i < 70; i++) {
      const y = fract(hash01(i, 121) + t * 0.18) * 1150 - 50;
      const x = hash01(i, 122) * W + Math.sin(t * 1.5 + i) * 30;
      ctx.globalAlpha = snowA * 0.9;
      circle(ctx, x, y, 2 + hash01(i, 123) * 4, PAL.cream);
    }
    ctx.globalAlpha = 1;
  }
}
// 粉色细线：A→B 之间正弦摆动；33–34.5 秒卷成大爱心（逐点插值到心形曲线），之后填色并随节拍跳动
function s1Thread(ctx, t, ax, ay, bx, by) {
  const reveal = prog(t, 24.2, 25.2, easeOutCubic);
  if (reveal <= 0) return;
  const m = prog(t, 33.0, 34.5, easeInOutCubic);
  const fillK = prog(t, 34.2, 34.9, easeOutCubic), beat = beatPulse(t);
  const hb = 1 + 0.08 * beat * fillK;
  const dx = bx - ax, dy = by - ay, len = Math.hypot(dx, dy) || 1, nx = -dy / len, ny = dx / len;
  const amp = 20 * (1 - m), N = HEART_N, cnt = m > 0 ? N : Math.max(2, Math.round(N * reveal));
  if (fillK > 0) softGlow(ctx, HEART_CX, HEART_CY, 340, PAL.heart, 0.4 * fillK * (0.75 + 0.25 * beat));
  ctx.beginPath();
  for (let i = 0; i <= cnt; i++) {
    const s = i / N, w = Math.sin(s * PI) * Math.sin(s * PI * 3 - t * 3.2) * amp;
    const px = ax + dx * s + nx * w, py = ay + dy * s + ny * w;
    const j = i % N;
    const hx = HEART_CX + HEART_PTS[j * 2] * HEART_S * hb, hy = HEART_CY + HEART_PTS[j * 2 + 1] * HEART_S * hb;
    const x = lerp(px, hx, m), y = lerp(py, hy, m);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  if (fillK > 0) { ctx.closePath(); ctx.fillStyle = rgba(PAL.heart, fillK); ctx.fill(); }
  ctx.lineWidth = lerp(4, 8, m); ctx.strokeStyle = PAL.heart; ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.stroke();
  if (fillK > 0) circle(ctx, HEART_CX - 7 * HEART_S * hb, HEART_CY - 6 * HEART_S * hb, 2.6 * HEART_S * fillK, 'rgba(255,255,255,0.22)');
}
// 问号依次浮起 → 破裂（圆环 + 碎线）→ 变成小爱心 / 闪光上飘
function s1Questions(ctx, t) {
  if (t < 28 || t > 33.5) return;
  const fadeAll = 1 - prog(t, 32.9, 33.4);
  for (let i = 0; i < 6; i++) {
    const ta = 28.1 + i * 0.3, tp = 29.5 + i * 0.5;
    if (t < ta) continue;
    const ang = -PI * 0.9 + i * (PI * 0.8 / 5), rad = 150 + (i % 2) * 45;
    const bx = ME_X + Math.cos(ang) * rad, by = ME_Y - 30 + Math.sin(ang) * rad * 0.9;
    if (t < tp) {
      const k = prog(t, ta, ta + 0.45), s = easeOutBack(k, 2.4) * (1 + 0.18 * prog(t, tp - 0.25, tp));
      drawQuestion(ctx, bx, by - (t - ta) * 12, 64 * s, PAL.cream, clamp01(k * 2) * fadeAll, Math.sin(t * 3 + i) * 0.2);
      continue;
    }
    const dt = t - tp, y0 = by - (tp - ta) * 12;
    if (dt < 0.4) {
      const kk = dt / 0.4;
      ring(ctx, bx, y0, 20 + kk * 50, 4 * (1 - kk), rgba(PAL.cream, 1 - kk));
      for (let j = 0; j < 6; j++) {
        const a = j / 6 * TAU + i, r1 = 24 + kk * 40, r2 = r1 + 16 * (1 - kk);
        line(ctx, bx + Math.cos(a) * r1, y0 + Math.sin(a) * r1, bx + Math.cos(a) * r2, y0 + Math.sin(a) * r2, 3, rgba(PAL.meGlow, 1 - kk));
      }
    }
    const hy = y0 - dt * 26, sc = easeOutBack(prog(t, tp, tp + 0.4), 2.2);
    if (i % 2 === 0) drawHeart(ctx, bx, hy, 24 * sc, { fill: PAL.heart, alpha: fadeAll, rot: Math.sin(t * 2 + i) * 0.2 });
    else drawSparkle(ctx, bx, hy, 26 * sc * (0.85 + 0.15 * Math.sin(t * 6 + i)), PAL.meGlow, fadeAll);
  }
}
// 时钟：14.2 秒弹出，18–23 秒飞转（约 7 圈），24.6 秒前淡出
function s1Clock(ctx, t) {
  const a = env(t, 14.2, 24.6, 1.0, 1.0) * 0.9;
  if (a <= 0) return;
  const r = 230 * easeOutBack(prog(t, 14.2, 15.2), 1.8);
  const ang = 0.6 * (t - 14) + 44 * easeInOutCubic(prog(t, S1_DAY0, S1_DAY1));
  drawClockFace(ctx, ME_X + 30, 520, r, ang, a, PAL.cream, env(t, 18.3, 22.7, 0.8, 0.8));
}
// “你”从右侧滑入（速度线 + 停稳时挤压回弹）
function s1You(ctx, t) {
  if (t < 23) return;
  const k = prog(t, 23.0, 24.3), x = lerp(2120, YOU_X, easeOutCubic(k)), land = t - 24.3;
  if (k < 1) {
    for (let i = 0; i < 4; i++) {
      const ly = YOU_Y - 40 + i * 26, l = 160 * (1 - k) * (0.6 + 0.4 * hash01(i, 131));
      line(ctx, x + 90 + i * 10, ly, x + 90 + i * 10 + l, ly, 5, rgba(PAL.you, 0.5 * (1 - k)));
    }
  }
  const sq = land > 0 ? 1 + 0.18 * Math.exp(-6 * land) * Math.cos(land * 14) : 0.92;
  const lk = prog(t, 33.2, 34, easeInOutCubic);
  drawYou(ctx, x, YOU_Y, { t: t, r: 78, look: lerp(-0.8, -0.5, lk), lookY: -0.5 * lk, squash: sq,
    rot: k < 1 ? -0.1 * (1 - k) : 0, groundY: GROUND_Y, mood: t > 34.6 ? 'happy' : undefined });
}
function s1Me(ctx, t) {
  const beat = beatPulse(t), lean = 0.16 * prog(t, 23.9, 24.8, easeOutBack);
  let look = -0.25, lookY = lerp(-0.7, 0, prog(t, 17.4, 18.2, easeInOutCubic));
  if (t >= 18 && t < 23) look = lerp(-0.25, Math.sin(t * 0.8) * 0.25, prog(t, 18, 18.6));
  if (t >= 23) look = lerp(look, 0.85, prog(t, 23.2, 23.7, easeInOutCubic));
  if (t >= 28 && t < 33) { look = Math.sin(t * 2.2) * 0.9; lookY = -0.5; }
  if (t >= 33) { look = 0.9; lookY = -0.6; }
  drawMe(ctx, ME_X, ME_Y, { t: t, r: 60, rot: lean, look: look, lookY: lookY,
    squash: 1 + Math.sin(t * 2.2) * 0.025 + 0.05 * beat, glow: 0.55 + 0.3 * beat,
    mood: t > 34.6 ? 'happy' : undefined, groundY: GROUND_Y });
  const da = env(t, 18.2, 23.0, 0.3, 0.3);
  if (da > 0) drawDots(ctx, ME_X, ME_Y - 108, t, { color: PAL.cream, alpha: da, r: 9, gap: 28 });
  return lean;
}
function drawS1(ctx, t) {
  const info = s1DayInfo(t), d = info.day, dusk = prog(t, 33.4, 35.6, easeInOutSine);
  const top = mixColor(mixColor(PAL.night, '#5fa8ee', d), '#4a2452', dusk);
  const bot = mixColor(mixColor(PAL.indigo, PAL.skyBlue, d), PAL.dusk, dusk);
  drawStreet(ctx, t, {
    top: top, bot: bot, starA: (1 - d) * (1 - dusk * 0.7),
    bld: mixColor(mixColor('#1c2246', '#5d74a8', d), '#3a2346', dusk),
    gnd: mixColor(mixColor('#0f1329', '#34466b', d), '#2a1a33', dusk),
    win: 1 - d, light: 1 - 0.8 * d,
    back: function () { s1SunMoon(ctx, t, info); },
    mid: function () { s1Clock(ctx, t); }
  });
  drawBokeh(ctx, t, { count: 24, seed: 13, color: mixColor(PAL.meGlow, PAL.heart, dusk), alpha: 0.08, pulse: beatPulse(t) * 0.5 });
  s1Seasons(ctx, t);
  const lean = s1Me(ctx, t);
  s1You(ctx, t);
  s1Thread(ctx, t, ME_X + 55 + lean * 60, ME_Y - 4, YOU_X - 72, YOU_Y + 6);
  s1Questions(ctx, t);
}
SCENE_IMPL.S1 = {
  draw: function (ctx, t) { drawS1(ctx, t); },
  // 大字放在上方，避开时钟、路灯和爱心
  heroLayout: function () { return { x: 960, y: 190, size: 160, maxW: W * 0.6 }; }
};

<script>
// ===== src/scenes_a2.js =====
'use strict';
// =====================================================================
// scenes_a2.js — S2 我猜 / 失败 / 深渊 0:37–0:59
//   37–40 爱心定格，“我”头顶大问号，镜头推近，眼睛左右张望
//   40–45 “你”头上气泡，“…”打字一直不结束；“你”视线移开
//   45–50 锯齿裂纹画过爱心，裂成两半慢慢分开，画面降饱和
//   50–55 大字「从天堂掉落到深渊」：竖向俯冲（天堂 → 天蓝 → 深蓝 → 深渊），速度线、微光、深度刻度
//   55–59 “我”在深渊底部落地挤压，头顶小乌云下雨，眼睛下垂
// drawDive(ctx, td, rev) 也被 S3 的 VHS 倒带复用（rev = true 时速度线反向）。
// =====================================================================
const DIVE_T0 = 50, DIVE_T1 = 55, DIVE_WH = 5400;   // 下坠时段与世界高度（逻辑像素）

// ---- 37–50 街道段 ----
function s2Street(ctx, t) {
  const cool = prog(t, 37, 39.5, easeInOutSine);
  const zk = prog(t, 37.2, 38.6, easeInOutCubic) * (1 - prog(t, 40.0, 40.8, easeInOutCubic));
  withCamera(ctx, lerp(960, ME_X + 80, zk), lerp(540, 600, zk), lerp(1, 1.4, zk), 0, function () {
    drawStreet(ctx, t, {
      top: mixColor('#4a2452', '#1b1f45', cool), bot: mixColor(PAL.dusk, PAL.indigo, cool),
      starA: 0.3 + 0.5 * cool, bld: mixColor('#3a2346', '#1c2246', cool), gnd: mixColor('#2a1a33', '#0f1329', cool)
    });
    // 定格的爱心：37 秒一道白色描边闪过（“冻住”），45 秒起裂开
    const crack = prog(t, 45.2, 46.0), sep = 150 * prog(t, 46.0, 49.6, easeInOutCubic);
    drawHeartHalves(ctx, HEART_CX, HEART_CY, HEART_S, { sep: sep, crack: crack, fill: PAL.heart });
    const fz = 1 - prog(t, 37.0, 37.5);
    if (fz > 0) { heartShapePath(ctx, HEART_CX, HEART_CY, HEART_S * (1 + 0.06 * (1 - fz))); ctx.lineWidth = 8; ctx.strokeStyle = rgba(PAL.cream, fz); ctx.stroke(); }
    s2Me(ctx, t);
    s2You(ctx, t);
  });

}
function s2Me(ctx, t) {
  let look = 0.8, lookY = 0;
  if (t < 40) look = clamp(Math.sin((t - 37) * 4.2) * 2.5, -1, 1);
  else if (t >= 45) { look = lerp(0.8, 0.2, prog(t, 45, 45.6)); lookY = lerp(0, 0.5, prog(t, 46, 46.8)); }
  const sad = t > 46.3;
  drawMe(ctx, ME_X, ME_Y, { t: t, r: 60, rot: 0.16 * (1 - prog(t, 37, 37.6, easeInOutCubic)), look: look, lookY: lookY,
    mood: sad ? 'sad' : undefined, squash: 1 + 0.08 * prog(t, 46.3, 47, easeOutBack), glow: lerp(0.55, 0.2, prog(t, 45.5, 48)),
    groundY: GROUND_Y });
  const qs = easeOutBack(prog(t, 37.15, 37.6), 2.5) * (1 - prog(t, 39.9, 40.2, easeInBack));
  if (qs > 0) drawQuestion(ctx, ME_X, ME_Y - 150 + Math.sin(t * 3) * 6, 120 * qs, PAL.meGlow, 1, Math.sin(t * 2.5) * 0.15);
}
function s2You(ctx, t) {
  const away = prog(t, 41.4, 42.0, easeInOutCubic);
  drawYou(ctx, YOU_X, YOU_Y, { t: t, r: 78, look: lerp(-0.8, 1, away), lookY: -0.25 * away, groundY: GROUND_Y });
  const bs = easeOutBack(prog(t, 40.2, 40.7), 2) * (1 - prog(t, 44.8, 45.1, easeInQuad));
  if (bs <= 0) return;

  ctx.save();
  ctx.translate(tx, ty); ctx.scale(bs, bs); ctx.translate(-tx, -ty);
  drawBubble(ctx, YOU_X - 90, YOU_Y - 292, 300, 140, tx, ty, { fill: PAL.cream });
  drawDots(ctx, YOU_X + 60, YOU_Y - 222, t, { color: PAL.indigo, r: 11, gap: 36 });   // 打字中…永远不结束
  ctx.restore();
}
// ---- 50–55 下坠 ----
function diveCam(k) { return (DIVE_WH - H) * (0.62 * k * k + 0.38 * k); }
function diveVel(k) { return (DIVE_WH - H) * (1.24 * k + 0.38) / (DIVE_T1 - DIVE_T0); }
// 光门：圆拱门 + 旋转光芒
function diveGate(ctx, t, x, y) {
  if (y > H + 400 || y < -500) return;
  ctx.save();
  ctx.globalAlpha = 0.18;
  for (let i = 0; i < 12; i++) {
    const a = i / 12 * TAU + t * 0.3;
    ctx.beginPath(); ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(a - 0.08) * 900, y + Math.sin(a - 0.08) * 900);
    ctx.lineTo(x + Math.cos(a + 0.08) * 900, y + Math.sin(a + 0.08) * 900);
    ctx.closePath(); ctx.fillStyle = '#ffffff'; ctx.fill();
  }
  ctx.restore();
  softGlow(ctx, x, y + 40, 420, '#fff6dc', 0.9);
  ctx.beginPath();
  ctx.moveTo(x - 110, y + 170); ctx.lineTo(x - 110, y); ctx.arc(x, y, 110, PI, 0); ctx.lineTo(x + 110, y + 170);
  ctx.closePath(); ctx.fillStyle = '#fffaf0'; ctx.fill();
  ctx.lineWidth = 14; ctx.strokeStyle = '#ffd38a'; ctx.stroke();
}
// 云层：三层视差（f = 1.3 的一层在“我”前面绘制）
function diveClouds(ctx, camY, front) {
  for (let i = 0; i < 18; i++) {
    const f = [0.8, 1, 1.3][i % 3];
    if ((f > 1.2) !== front) continue;
    const wy = 520 + hash01(i, 151) * 1700, y = wy - camY * f;
    if (y < -200 || y > H + 200) continue;
    const s = 110 + hash01(i, 152) * 130;
    let cx = hash01(i, 153) * W;
    if (front && Math.abs(cx - 480) < 300) cx += 640;   // 前景云避开“我”的下坠通道
    drawCloud(ctx, cx, y, s * (front ? 1.1 : 1), front ? '#ffffff' : '#f4f8ff', front ? 0.7 : 0.85);
  }
}
// 速度线与微光粒子：由 camY 驱动（倒放时自动反向）
function diveStreaks(ctx, camY, v, k) {
  const len = clamp(Math.abs(v) * 0.09, 40, 300), col = mixColor('#8fa3e0', PAL.cream, k), span = H + 400;
  for (let i = 0; i < 36; i++) {
    const sp = 1.2 + hash01(i, 161) * 0.9;
    const y = ((hash01(i, 162) * span - camY * sp) % span + span) % span - 200;
    const x = hash01(i, 163) * W;
    line(ctx, x, y, x, y + len * sp * 0.7, 3, rgba(col, 0.25 + 0.2 * hash01(i, 164)));
  }
  for (let i = 0; i < 30; i++) {
    const sp = 0.9 + hash01(i, 171) * 0.6;
    const y = ((hash01(i, 172) * span - camY * sp) % span + span) % span - 200;

}
// 侧边深度刻度：每 120 世界像素一格 = 50m，当前读数跟随“我”
function diveGauge(ctx, camY, meY, k) {

  const gc = mixColor(PAL.indigo, PAL.cream, smoothstep(0.25, 0.5, k));   // 亮背景用深色刻度

  ctx.beginPath(); ctx.moveTo(1776, meY - 10); ctx.lineTo(1794, meY); ctx.lineTo(1776, meY + 10); ctx.fillStyle = PAL.me; ctx.fill();

// 竖向俯冲。td ∈ [50, 55] 为下坠内时间；rev = true 用于倒带（“我”向上升）
function drawDive(ctx, td, rev) {

  g.addColorStop(0.52, '#4a5aa0'); g.addColorStop(0.68, PAL.indigo); g.addColorStop(0.84, PAL.night);

  if (plate > 0) {

}
// ---- 55–59 深渊落地 ----
function s2RainCloud(ctx, t, s) {

}
function s2Abyss(ctx, t) {
  const dt = t - DIVE_T1;

  ctx.fillStyle = PAL.skyBlue; ctx.fill(); ctx.restore();

  ctx.fillStyle = '#0c0d1c'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y);
  ctx.fillStyle = '#23254a'; ctx.fillRect(0, GROUND_Y, W, 4);

    glow: 0.25, groundY: GROUND_Y });

  const cs = easeOutBack(prog(t, 55.7, 56.3), 2);
  const cy = s2RainCloud(ctx, t, cs);

    for (let i = 0; i < 9; i++) {
      const ph = fract(t * 1.8 + hash01(i, 181)), x = 960 - 50 + i * 12.5;

}
function drawS2(ctx, t) {
  if (t < DIVE_T0) s2Street(ctx, t);
  else if (t < DIVE_T1) {
    drawDive(ctx, t, false);

SCENE_IMPL.S2 = {
  draw: function (ctx, t) { drawS2(ctx, t); },
  // 「从天堂掉落到深渊」放在右侧，避开左侧下坠的“我”和最右的深度刻度
  heroLayout: function () { return { x: 1160, y: 430, size: 110, maxW: 860 }; }
};

<script>
// ===== src/scenes_a3.js =====
'use strict';
// =====================================================================
// scenes_a3.js — S3 前半（0:59–1:14）
//   59–64 「我愿意改变 (what can I do?)」：圆 → 圆角方 → 三角 → 星形 → 圆，每次弹性弹出并变色
//   64–69 「重新再来一遍 (just give me change)」：VHS 倒带（扫描线、RGB 色差、◀◀ REWIND），
//          “我”从深渊升回 → 爱心合拢 → 时钟逆转
//   69–74 「我无法只是普通朋友」：拍立得相框 “朋友 / FRIENDS”，“我”顶相框边缘，边框像橡皮筋被撑变形

const S3_SHAPES = ['circle', 'roundSquare', 'triangle', 'star', 'circle'];
const S3_COLS = [PAL.me, '#ffc94a', '#8a7bff', PAL.heart, PAL.me];
const S3_SWITCH = [59, 60.0, 61.0, 62.0, 63.0];

// ---- 59–64 变形 ----
function s3Change(ctx, t) {
  const br = prog(t, 59, 60.5, easeInOutSine);
  fillSky(ctx, mixColor(PAL.abyss, '#1d2350', br), mixColor('#0d0e20', '#3a2f6b', br));
  let idx = 0;
  for (let i = 0; i < S3_SWITCH.length; i++) if (t >= S3_SWITCH[i]) idx = i;
  const ts = S3_SWITCH[idx], col = S3_COLS[idx], beat = beatPulse(t);

    const a = i / 14 * TAU + t * 0.15;

    ctx.lineTo(960 + Math.cos(a - 0.1) * 1400, 520 + Math.sin(a - 0.1) * 1400);
    ctx.lineTo(960 + Math.cos(a + 0.1) * 1400, 520 + Math.sin(a + 0.1) * 1400);
    ctx.closePath(); ctx.fillStyle = col; ctx.fill();
  }
  ctx.restore();
  drawBokeh(ctx, t, { count: 24, seed: 37, color: col, alpha: 0.08 * br, pulse: beat * 0.5 });

  if (ga > 0) { ctx.globalAlpha = ga; ctx.fillStyle = '#0c0d1c'; ctx.fillRect(0, GROUND_Y, W, H - GROUND_Y); ctx.globalAlpha = 1; }

  if (t < 59.4) s2RainCloud(ctx, t, 1 - easeInBack(prog(t, 59, 59.4)));

  const y = lerp(ME_Y, 520, easeOutBack(rise)), r0 = lerp(60, 100, easeOutCubic(rise));
  let sc = idx > 0 ? 0.55 + 0.45 * easeOutElastic(prog(t, ts, ts + 0.8)) : 1;
  const nx = idx < 4 ? S3_SWITCH[idx + 1] : 99;
  sc *= 1 - 0.12 * prog(t, nx - 0.15, nx, easeInQuad);   // 换形前预备收缩
  if (idx > 0 && t - ts < 0.6) {
    const kk = (t - ts) / 0.6;
    ring(ctx, 960, y, r0 * 1.2 + kk * 220, 10 * (1 - kk), rgba(col, 1 - kk));
    for (let j = 0; j < 10; j++) {
      const a = j / 10 * TAU + idx, d = r0 * 1.1 + easeOutCubic(kk) * 240;

    }

  drawCharacter(ctx, 960, y, { r: r0 * sc, color: col, glowColor: col, glow: 0.6,
    shape: S3_SHAPES[idx], rot: (1 - prog(t, ts, ts + 0.6, easeOutCubic)) * 0.6 * (idx % 2 ? 1 : -1),
    look: Math.sin(t * 1.7) * 0.4, blink: blinkAmt(t, 11), mood: idx === 4 && t > 63.3 ? 'happy' : undefined,
    groundY: lerp(GROUND_Y, 700, rise), squash: 1 + 0.04 * beat });
}

// ---- VHS 效果 ----
// 复用的离屏缓冲：每帧完整重写，不保存任何跨帧画面状态
let _vhsBuf = null, _vhsTmp = null;
function vhsBuffers(w, h) {
  if (!_vhsBuf || _vhsBuf.width !== w || _vhsBuf.height !== h) {
    _vhsBuf = document.createElement('canvas'); _vhsBuf.width = w; _vhsBuf.height = h;

}
// RGB 色差：把当前画面拆成 R/G/B 三个通道（multiply 纯色），R 左移、B 右移后用 lighter 叠回
function rgbShift(ctx, d) {

  const bc = buf.getContext('2d'), tc = tmp.getContext('2d');

  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, w, h);
  ctx.globalCompositeOperation = 'lighter';

    tc.globalCompositeOperation = 'copy'; tc.drawImage(buf, 0, 0);
    tc.globalCompositeOperation = 'multiply'; tc.fillStyle = chans[i]; tc.fillRect(0, 0, w, h);

}
// 跟踪噪声带：从缓冲里截取横带，水平错位贴回
function vhsBands(ctx, t, burst) {

  const n = burst > 0.2 ? 4 : 1, fr = Math.floor(t * 30);
  ctx.save();
  ctx.setTransform(1, 0, 0, 1, 0, 0);

}
function pad2(n) { return (n < 10 ? '0' : '') + n; }
// VHS 叠层：色差 → 噪声带 → 扫描线 → 噪点 → HUD（◀◀ REWIND、倒退的时间码、逆转小钟）
function drawVHS(ctx, t, t0, t1) {
  const fr = Math.floor(t * 30), burst = Math.max(env(t, t0, t0 + 0.3, 0.02, 0.2), env(t, 66.15, 66.55, 0.05, 0.15));
  rgbShift(ctx, 5 + 5 * hash01(fr, 141) + 20 * burst);
  vhsBands(ctx, t, burst);
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  for (let y = 0; y < H; y += 4) ctx.fillRect(0, y, W, 2);
  for (let i = 0; i < 70 + burst * 120; i++) {
    ctx.fillStyle = rgba('#ffffff', 0.12 + 0.3 * hash01(fr * 131 + i, 144));
    ctx.fillRect(hash01(fr * 97 + i, 142) * W, hash01(fr * 89 + i, 143) * H, 2 + hash01(i, 145) * 10, 2);
  }

  // 时间码从 0:55 倒退到 0:37

  drawText(ctx, 'SP  00:' + pad2(s) + ':' + pad2(ff), SAFE.r - 20, SAFE.y + 50, 40, '#ffffff', { align: 'right', family: FONT_EN, weight: 700 });
  drawClockFace(ctx, SAFE.r - 380, SAFE.y + 50, 34, -(t - t0) * 14, 0.9, '#ffffff', -0.8);
}
// ---- 64–69 倒带 ----
function s3Rewind(ctx, t) {
  if (t < 66.3) {
    // 倒放下坠：“我”从深渊底部升起
    drawDive(ctx, lerp(54.95, 50.6, prog(t, 64.0, 66.3, easeInOutSine)), true);
  } else {
    // 倒放 S2：裂开的爱心合拢、“我”从沮丧恢复、大钟逆转
    const k = prog(t, 66.4, 68.3, easeInOutCubic);
    drawStreet(ctx, t, { top: '#1b1f45', bot: PAL.indigo, starA: 0.7,
      mid: function () { drawClockFace(ctx, ME_X + 30, 520, 230, -(t - 66.3) * 9, 0.75, PAL.cream, -1); } });
    drawHeartHalves(ctx, HEART_CX, HEART_CY, HEART_S, { sep: 150 * (1 - k), crack: 1 - prog(t, 67.9, 68.5), fill: PAL.heart });
    drawMe(ctx, ME_X, ME_Y, { t: t, r: 60, look: 0.8, mood: k < 0.5 ? 'sad' : undefined, rot: 0.16 * k, groundY: GROUND_Y });
    drawYou(ctx, YOU_X, YOU_Y, { t: t, r: 78, look: lerp(1, -0.8, k), groundY: GROUND_Y });

// ---- 69–74 拍立得 ----
// 矩形路径，左边向外鼓出 bulge（二次曲线，鼓包峰值落在 peakY）
function polaroidRect(ctx, x0, y0, x1, y1, bulge, peakY) {
  const cy = 2 * peakY - (y0 + y1) / 2;
  ctx.moveTo(x0, y0); ctx.lineTo(x1, y0); ctx.lineTo(x1, y1); ctx.lineTo(x0, y1);
  ctx.quadraticCurveTo(x0 - 2 * bulge, cy, x0, y0);
  ctx.closePath();
}
// 鼓包量：70.1 秒开始顶，随节拍一下下顶，72.4–73.3 用力顶并颤抖
function s3Bulge(t) {
  const push = prog(t, 70.1, 70.7, easeOutCubic);
  const hard = prog(t, 72.4, 73.3, easeInOutSine) * (1 - 0.6 * prog(t, 73.6, 74, easeInQuad));

function s3Polaroid(ctx, t) {

  drawBokeh(ctx, t, { count: 24, seed: 57, color: PAL.meGlow, alpha: 0.09, pulse: beatPulse(t) * 0.5 });

  ctx.beginPath(); polaroidRect(ctx, -362, -273, 398, 317, b, POL_PEAK + 22); ctx.fillStyle = 'rgba(0,0,0,0.35)'; ctx.fill();
  ctx.beginPath(); polaroidRect(ctx, -380, -295, 380, 295, b, POL_PEAK); polaroidRect(ctx, -350, -265, 350, 175, b, POL_PEAK);
  ctx.fillStyle = '#fbf6ec'; ctx.fill('evenodd');
  // 照片内容
  ctx.save();
  ctx.beginPath(); polaroidRect(ctx, -350, -265, 350, 175, b, POL_PEAK); ctx.clip();
  const g = ctx.createLinearGradient(0, -265, 0, 175);
  g.addColorStop(0, '#5a6fb8'); g.addColorStop(1, '#f0a37a');
  ctx.fillStyle = g; ctx.fillRect(-420, -270, 800, 450);
  circle(ctx, 210, -130, 46, 'rgba(255,233,199,0.85)');
  ctx.fillStyle = '#3a3f6b'; ctx.fillRect(-420, 140, 800, 40);
  drawYou(ctx, 190, 140 - 70, { t: t, r: 70, look: -0.6, groundY: 140 });
  ctx.restore();
  // 手写标题逐字出现
  const cap = '朋友 / FRIENDS', n = Math.floor(prog(t, 69.9, 70.8) * cap.length + 1e-6);
  if (n > 0) {

    ctx.save(); ctx.rotate(-0.02);

    ctx.restore();
  }
  // “我”走到左边缘并顶住（画在相框之上，看起来把边框撑变形）
  const walk = prog(t, 69.8, 70.3, easeInOutCubic), sq = lerp(1, 0.88, prog(t, 70.1, 70.4));

    hands: walk > 0.5 ? [{ a: PI - 0.4, len: 0.45 }, { a: PI + 0.4, len: 0.45 }] : undefined });
  ctx.restore();
  veil(ctx, '#ffffff', 0.85 * (1 - prog(t, 69.0, 69.35)));   // 拍照闪光
  // 斜向擦除揭示下一镜（深海）
  const wk = prog(t, 73.55, 74.0, easeInOutCubic);

}
// 斜向擦除揭示：在左→右推进的斜切区域内绘制 fn
function diagReveal(ctx, k, fn) {
  const s = 300, x = lerp(-s, W + s, k);
  ctx.save();
  ctx.beginPath(); ctx.moveTo(-10, -10); ctx.lineTo(x + s, -10); ctx.lineTo(x - s, H + 10); ctx.lineTo(-10, H + 10); ctx.closePath();
  ctx.clip(); fn(); ctx.restore();

}
